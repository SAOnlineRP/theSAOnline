<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - theSAOnline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="loading-overlay">
        <div>Loading Assets...</div>
        <div class="loading-bar-container">
            <div id="loading-bar" class="loading-bar"></div>
        </div>
    </div>
    <div class="main-container">
        <!-- <img src="logo_sao.png" alt="SAO Logo" class="logo" /> -->
        <div class="top-bar">
            <div class="top-left">
                <div class="icon-btn" onclick="goBack()"><img src="/img/back2.png" alt="Back"></div>
                <div class="icon-btn" onclick="goHome()"><img src="/img/home2.png" alt="Home"></div>
            </div>
            <div class="top-right">
                <div class="currency-box">
                    <span class="coin">🪙</span>
                    <span id="col">10000</span>
                </div>
                <div class="currency-box">
                    <span class="gem">💎</span>
                    <span id="arcana-gem">50</span>
                </div>
            </div>
        </div>
        <div class="profile-card">
            <div class="info-section">
                <div class="name" id="player-name"><span>ARJUNA</span><span class="level">Lv. 100</span></div>
                <div class="avatar-section">
                    <img id="avatar" src="/img/default-nodata.png" alt="avatar" class="avatar-img">
                </div>
                
                <div class="box badge-box">
                    <div class="badge-section">
                        <img id="badge-1" src="/img/badge-1.png" alt="badge" class="badge-img">
                    </div>
                    <div class="badge-section">
                        <img id="badge-2" src="/img/badge-2.png" alt="badge" class="badge-img">
                    </div>
                </div>
            </div>

            <div class="stat-section">
                <div class="stat-box">
                    <div class="radar">
                        <svg id="radarChart" viewBox="0 0 300 300">
                        <defs>
                            <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                            </filter>
                        </defs>

                        <!-- ring/grid -->
                        <polygon class="ring" id="ring4"></polygon>
                        <polygon class="ring" id="ring3"></polygon>
                        <polygon class="ring" id="ring2"></polygon>
                        <polygon class="ring" id="ring1"></polygon>

                        <!-- axis -->
                        <g id="axisLines"></g>

                        <!-- stat fill -->
                        <polygon id="statShape" class="stat-shape" filter="url(#glow)"></polygon>

                        <!-- nodes -->
                        <g id="nodes"></g>
                        </svg>

                        <div class="stat-label label-atk">ATK</div>
                        <div class="stat-label label-def">DEF</div>
                        <div class="stat-label label-crit">Crit%</div>
                        <div class="stat-label label-cdmg">CritDMG</div>
                        <div class="stat-label label-mp">MP</div>
                        <div class="stat-label label-hp">HP</div>
                    </div>
                </diV>
            </div>
            <div>
                <div class="wequip-container">
                    <div class="wequip-box">Skill Records</div>
                    <div class="wequip-box-edit">Edit</div>
                </div>
                
                <div class="grid-container">
                    <div class="skill-records"><img id="skill-record-1" src="/img/default-nodata.png" alt="sr" class="avatar-img"></div>
                    <div class="skill-records"><img id="skill-record-2" src="/img/default-nodata.png" alt="sr" class="avatar-img"></div>
                </div>
                <div class="wequip-container">
                    <div class="wequip-box">Equipment</div>
                    <div class="wequip-box-edit">Edit</div>
                </div>
                <div class="equipment-container">
                    <div class="box-equip"><img id="equipped-right-arm" src="/img/default-nodata.png" alt="sr" class="avatar-img"></div>
                    <div class="box-equip"><img id="equipped-left-arm" src="/img/default-nodata.png" alt="sr" class="avatar-img"></div>
                    <div class="box-equip"><img id="armor-lower" src="/img/default-nodata.png" alt="sr" class="avatar-img"></div>
                    <div class="box-equip"><img id="armor-upper" src="/img/default-nodata.png" alt="sr" class="avatar-img"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { supabase } from "/js/supabaseClient.js";
        import { requireLogin } from "/js/authGuard.js";

        const overlay = document.getElementById("loading-overlay");
        const bar = document.getElementById("loading-bar");

        let progress = 0;

        function goBack() {
            window.history.back();
        }

        function goHome() {
            window.location.href = "menu.html";
        }

        window.goBack = goBack;
        window.goHome = goHome;


        const radarOrder = ["atk", "def", "crit", "cdmg", "mp", "hp"];

        function getPolygonPoints(cx, cy, radius, count, scale = 1) {
        const points = [];
        const angleStep = (Math.PI * 2) / count;
        const startAngle = -Math.PI / 2;

        for (let i = 0; i < count; i++) {
            const angle = startAngle + i * angleStep;
            const x = cx + Math.cos(angle) * radius * scale;
            const y = cy + Math.sin(angle) * radius * scale;
            points.push(`${x},${y}`);
        }

        return points.join(" ");
        }

        function getStatPoints(cx, cy, radius, stats, order) {
            const points = [];
            const angleStep = (Math.PI * 2) / order.length;
            const startAngle = -Math.PI / 2;

            for (let i = 0; i < order.length; i++) {
                const key = order[i];
                const value = Math.max(0, Math.min(100, stats[key])) / 100;
                const angle = startAngle + i * angleStep;
                const x = cx + Math.cos(angle) * radius * value;
                const y = cy + Math.sin(angle) * radius * value;
                points.push({ x, y });
            }

            return points;
        }

        function drawRadar(stats) {
            const cx = 150;
            const cy = 150;
            const radius = 110;
            const count = radarOrder.length;

            document.getElementById("ring4").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 1));
            document.getElementById("ring3").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 0.75));
            document.getElementById("ring2").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 0.5));
            document.getElementById("ring1").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 0.25));

            const axisGroup = document.getElementById("axisLines");
            axisGroup.innerHTML = "";

            const angleStep = (Math.PI * 2) / count;
            const startAngle = -Math.PI / 2;

            for (let i = 0; i < count; i++) {
                const angle = startAngle + i * angleStep;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", cx);
                line.setAttribute("y1", cy);
                line.setAttribute("x2", x);
                line.setAttribute("y2", y);
                line.setAttribute("class", "axis-line");
                axisGroup.appendChild(line);
            }

            const statPoints = getStatPoints(cx, cy, radius, stats, radarOrder);
            const statShape = document.getElementById("statShape");
            statShape.setAttribute(
                "points",
                statPoints.map(point => `${point.x},${point.y}`).join(" ")
            );

            const nodesGroup = document.getElementById("nodes");
            nodesGroup.innerHTML = "";

            statPoints.forEach(point => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", point.x);
                circle.setAttribute("cy", point.y);
                circle.setAttribute("r", 4.5);
                circle.setAttribute("class", "node");
                nodesGroup.appendChild(circle);
            });
        }

        // ================== FUNCTION BARU ==================
        async function loadProfile(session) {
            try {
                setProgress(10);

                const headers = {
                    Authorization: `Bearer ${session.access_token}`,
                };

                setProgress(20);

                const [profileRes, equippedRes, statRes, badgeRes] = await Promise.all([
                    fetch("/api/profile", { headers }),
                    fetch("/api/profile_equipped", { headers }),
                    fetch("/api/profile_stat", { headers }),
                    fetch("/api/profile_badges", { headers }),
                ]);

                setProgress(40);

                const profileResult = await profileRes.json();
                const equippedResult = await equippedRes.json();
                const statResult = await statRes.json();
                const badgeResult = await badgeRes.json();  

                if (!profileRes.ok) throw new Error(profileResult.error);
                if (!equippedRes.ok) throw new Error(equippedResult.error);
                if (!statRes.ok) throw new Error(statResult.error);
                if (!badgeRes.ok) throw new Error(badgeResult.error);

                const profile = profileResult.data;
                const equipped = equippedResult.data;
                const stats = statResult.data;
                const badges = badgeResult.data;

                var equippedRightArm = equipped.equipped.right_arm.catalog.link_photo;
                var equippedLeftArm = equipped.equipped.left_arm.catalog.link_photo;

                document.getElementById("player-name").innerHTML = `
                <span>${profile.name}</span>
                <span class="level">Lv. ${profile.level}</span>
                `;

                document.getElementById("avatar").src = profile.avatar || "/img/avatar.png";

                document.getElementById("col").textContent = profile.col;
                document.getElementById("arcana-gem").textContent = profile.arcana_gems;
 
                document.getElementById("equipped-right-arm").src = equipped.equipped.right_arm.catalog.link_photo || "/img/eq-1.png";
                document.getElementById("equipped-left-arm").src = equipped.equipped.left_arm.catalog.link_photo || "/img/eq-2.png";
                document.getElementById("armor-lower").src = equipped.equipped.lower.catalog.link_photo || "/img/eq-3.png";
                document.getElementById("armor-upper").src = equipped.equipped.upper.catalog.link_photo || "/img/eq-4.png";
                document.getElementById("skill-record-1").src = equipped.equipped.first_partner.catalog.link_photo || "/img/sr-1.png";
                document.getElementById("skill-record-2").src = equipped.equipped.second_partner.catalog.link_photo || "/img/sr-2.png";

                document.getElementById("badge-1").src = badges.badges[0]?.catalog.link_photo || "/img/badge-1.png";
                document.getElementById("badge-2").src = badges.badges[1]?.catalog.link_photo || "/img/badge-2.png";

                console.log("profile:", profile);
                console.log("equipped:", equipped);
                console.log("badges:", badges);

                setProgress(50); // API done (50%)

                const radarStats = {
                    atk: stats.stats.atk,
                    def: stats.stats.def,
                    crit: stats.stats.crit_pct,
                    cdmg: stats.stats.crit_dmg,
                    mp: stats.stats.max_mp,
                    hp: stats.stats.max_hp
                };

                // 🔥 tunggu gambar
                await waitForImages();

                await drawRadar(radarStats);

                // selesai semua
                setProgress(100);

                setTimeout(hideLoading, 300);

            } catch (err) {
                console.error("Load error:", err);
                hideLoading();
            }
        }


        function setProgress(value) {
            progress = value;
            bar.style.width = progress + "%";
        }

        function hideLoading() {
            overlay.classList.add("fade-out");
            setTimeout(() => {
                overlay.style.display = "none";
            }, 500);
        }

        function waitForImages() {
            const images = document.querySelectorAll("img");
            let loaded = 0;
            const total = images.length;

            if (total === 0) return Promise.resolve();

            return new Promise((resolve) => {
                images.forEach((img) => {
                if (img.complete) {
                    loaded++;
                    update();
                } else {
                    img.onload = () => {
                    loaded++;
                    update();
                    };
                    img.onerror = () => {
                    loaded++;
                    update();
                    };
                }
                });

                function update() {
                const percent = (loaded / total) * 50; // max 50%
                setProgress(50 + percent);

                if (loaded === total) resolve();
                }
            });
        }

        const session = await requireLogin();

        if (session) {
            await loadProfile(session);
        }
    </script>
</body>
</html>
