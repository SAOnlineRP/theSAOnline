        const radarOrder = ["atk", "def", "crit", "cdmg", "mp", "hp"];

        function getPolygonPoints(cx, cy, radius, count, scale = 1) {
        const points = [];
        const angleStep = (Math.PI * 2) / count;
        const startAngle = -Math.PI / 2;

        for (let i = 0; i < count; i++) {
            const angle = startAngle + i * angleStep;
            const x = cx + Math.cos(angle) * radius * scale;
            const y = cy + Math.sin(angle) * radius * scale;
            points.push(`${x},${y}`);
        }

        return points.join(" ");
        }

        function getStatPoints(cx, cy, radius, stats, order) {
            const points = [];
            const angleStep = (Math.PI * 2) / order.length;
            const startAngle = -Math.PI / 2;

            for (let i = 0; i < order.length; i++) {
                const key = order[i];
                const value = Math.max(0, Math.min(100, stats[key])) / 100;
                const angle = startAngle + i * angleStep;
                const x = cx + Math.cos(angle) * radius * value;
                const y = cy + Math.sin(angle) * radius * value;
                points.push({ x, y });
            }

            return points;
        }

        function drawRadar(stats) {
            const cx = 150;
            const cy = 150;
            const radius = 110;
            const count = radarOrder.length;

            document.getElementById("ring4").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 1));
            document.getElementById("ring3").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 0.75));
            document.getElementById("ring2").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 0.5));
            document.getElementById("ring1").setAttribute("points", getPolygonPoints(cx, cy, radius, count, 0.25));

            const axisGroup = document.getElementById("axisLines");
            axisGroup.innerHTML = "";

            const angleStep = (Math.PI * 2) / count;
            const startAngle = -Math.PI / 2;

            for (let i = 0; i < count; i++) {
                const angle = startAngle + i * angleStep;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", cx);
                line.setAttribute("y1", cy);
                line.setAttribute("x2", x);
                line.setAttribute("y2", y);
                line.setAttribute("class", "axis-line");
                axisGroup.appendChild(line);
            }

            const statPoints = getStatPoints(cx, cy, radius, stats, radarOrder);
            const statShape = document.getElementById("statShape");
            statShape.setAttribute(
                "points",
                statPoints.map(point => `${point.x},${point.y}`).join(" ")
            );

            const nodesGroup = document.getElementById("nodes");
            nodesGroup.innerHTML = "";

            statPoints.forEach(point => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", point.x);
                circle.setAttribute("cy", point.y);
                circle.setAttribute("r", 4.5);
                circle.setAttribute("class", "node");
                nodesGroup.appendChild(circle);
            });
        }

        // ================== FUNCTION BARU ==================

                document.getElementById("equipped-right-arm").src = equipped.right_arm.catalog.link_photo || "/img/eq-1.png";
                document.getElementById("equipped-left-arm").src = equipped.left_arm.catalog.link_photo || "/img/eq-2.png";

                console.log("profile:", profile);
                console.log("equipped:", equipped);
                console.log("badges:", badges);

                    crit: stats.crit_pct,

                setProgress(100);

                setTimeout(hideLoading, 300);

            } catch (err) {
                console.error("Load error:", err);
                hideLoading();
            }
        }


        function setProgress(value) {

        function hideLoading() {

        function waitForImages() {
            const images = document.querySelectorAll("img");
            let loaded = 0;
            const total = images.length;

            if (total === 0) return Promise.resolve();

            return new Promise((resolve) => {
                images.forEach((img) => {
                if (img.complete) {
                    loaded++;
                    update();
                } else {
                    img.onload = () => {
                    loaded++;
                    update();
                    };
                    img.onerror = () => {
                    loaded++;
                    update();
                    };
                }
                });

                function update() {
                const percent = (loaded / total) * 50; // max 50%
                setProgress(50 + percent);

                if (loaded === total) resolve();
                }
            });
        }

                        img.src = data.partner.link_ava;
                    }

                    closeModal(partnerListModal);

                };
            });
        }

        async function renderEquipmentList(position) {
            let equipments;
            const session = await requireLogin();
            try {
                setEquipmentsLoading(true);
                
                const response = await fetch(
                    `/api/player_data`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${session.access_token}`,
                        },
                        body: JSON.stringify({
                            action: "getDataPlayer",
                            table: "player_equipments"
                        })
                    }
                );
                const equipmentRes = await response.json();
                equipments = equipmentRes.data;
                // filter sesuai slot
                const filteredEquipments = equipments.filter(
                    eq => eq.catalog.position === position
                );

                const equipmentList = document.querySelector(".equipment-list");
                equipmentList.innerHTML = filteredEquipments.map(p => `
                    <div class="equipment-item" data-index="${p.id}">
                        <img src="${p.catalog.link_photo}">
                        <div class="equipment-name">${p.catalog.name}</div>
                    </div>
                `).join("");
            } catch (err) {
                console.error(
                    "Render Equipment Error:",
                    err
                    );
            } finally {
                setEquipmentsLoading(false);
            }
            
            const equipmentSection = document.querySelectorAll(".equipment-section");
            /* pasang event setelah render */
            const items = document.querySelectorAll(".equipment-item");

            items.forEach(item => {
                item.onclick = () => {
                    const equipmentId = item.dataset.index;

                    const data = filteredEquipments.find(
                        equipment => equipment.id === equipmentId
                    );
                    console.log("data equipment ", data);

                    // ❌ CEK DUPLIKAT
                    if (selectedEquipments.includes(equipmentId)) {
                        alert("Equipment ini sudah dipakai di slot lain!");
                        return;
                    }

                    if (selectedSlotEquipment !== null) {
                        // simpan pilihan
                        selectedEquipments[selectedSlotEquipment] = equipmentId;

                        // update UI
                        const section = equipmentSection[selectedSlotEquipment];
                        const img = section.querySelector("img");
                        img.src = data.catalog.link_photo;
                    }

                    closeModal(equipmentListModal);

                };
            });
        }

        async function init() {
            try {
                const session = await requireLogin();
                if (!session) return; // ✅ sekarang valid

                await loadProfile(session);
                setTimeout(hideLoading, 500);

            } catch (err) {
                console.error("Loading error:", err);
            }
        }

        init();
    </script>
</body>
</html>
