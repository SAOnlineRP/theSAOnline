<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #003973;
            --bg-mid: #11375d;
            --bg-bottom: #020813;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif !important;
        }

        body {
            min-height: 100vh;
            background-size: cover;
            background: radial-gradient(circle at top, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
        }

        .container {
            height: 100vh;              /* patok ke tinggi layar */
            width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
            max-width: 100%;
            margin: 0 auto;

            position: relative;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(600px, 60vw);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 0 20px rgba(0, 221, 255, 0.5)) blur(0.5px);
            z-index: -1;
        }

        /* top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 40px;
        }

        .topbar-left {
            display: flex;
            gap: 18px;
            color: #000;
            align-items: center;
        }

        .topbar-left button {
            border: none;
            background: none;
            font-size: 40px;
            cursor: pointer;
        }

        .topbar-right {
            display: flex;
            gap: 14px;
        }

        .currency-box {
            min-width: 100px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 40px;
            color: white;
            padding: 0 12px;
        }

        .content {
            min-height: 75%;
            background: #215b7a;
            border-radius: 10px;
            box-shadow:
            inset 0 0 18px rgba(255,255,255,0.04),
            0 10px 28px rgba(0,0,0,0.35);

            overflow-x: auto; /* penting */
            overflow-y: hidden;
            padding: 15px;
            display: flex;
            flex-direction: column;

            justify-content: center; /* ini bikin center atas-bawah */

            

            scroll-behavior: smooth;
        }

        .title {
            background: #bbb;
            color: black;
            padding: 5px 10px;
            margin-bottom: 20px;
            width: 200px;

            position: sticky;
            left: 0;

            z-index: 10;
            background: #bbb;
        }

        /* cards jadi scroll horizontal */
        .cards {
            display: flex;
            gap: 20px; /* kasih jarak antar card */
            width: max-content; /* biar bisa melebar */

            scroll-snap-type: x mandatory;
        }

        /* card jangan pakai % lagi */
        .card {
            min-width: 300px; /* atau 180px / 220px bebas */
            flex-shrink: 0;   /* biar ga ngecil */
            scroll-snap-align: center;
        }

        .card-title {
            margin-bottom: 5px;
            color: white;
        }

        .box {
            min-height: 120px;
            min-width: 300px;
            background: #ccc;
            border-radius: 10px;
            position: relative;
        }

        .content::-webkit-scrollbar {
            height: 8px;
        }

        .content::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .button-event{
            position: absolute;
            bottom: 0;
            right: 0;
            margin: 10px;
            padding: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
        <div class="topbar">
            <div class="topbar-left">
                <button onclick="goBack()"><img src="/img/back2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
                <button onclick="goHome()"><img src="/img/home2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
            </div>

            <div class="topbar-right">
                <div class="currency-box">🪙 10000</div>
                <div class="currency-box">💎 50</div>
            </div>
        </div>
        <div class="content">
            <div class="title">The Beginning</div>

            <div class="cards">
                <div class="card">
                    <p class="card-title">Story 1-1</p>
                    <div class="box">
                        <button class="button-event" onclick="goToStory()">Masuk Story</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Battle 1-1</p>
                    <div class="box">
                        <button class="button-event" onclick="goToParty()">Masuk Battle</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Story 1-2</p>
                    <div class="box">
                        <button class="button-event" onclick="goToStory()">Masuk Story</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Battle 1-2</p>
                    <div class="box">
                        <button class="button-event" onclick="goToParty()">Masuk Battle</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Story 1-3</p>
                    <div class="box">
                        <button class="button-event" onclick="goToStory()">Masuk Story</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function goBack() {
        window.history.back();
        }

        function goHome() {
        window.location.href = "menu.html";
        }

        function goToStory() {
        window.location.href = "quest-story.html";
        }

        function goToParty() {
        window.location.href = "party.html";
        }
    </script>
</body>
</html>
