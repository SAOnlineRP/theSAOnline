<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Screen Wireframe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .game-screen {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

        /* TOP BAR */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
      }

      .left-icons {
        font-size: 40px;
        display: flex;
        gap: 15px;
      }

      .turn-area {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .turn {
        text-align: center;
        font-size: 35px;
      }

      .next {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .square {
        width: 60px;
        height: 60px;
        background: #ccc;
        border: 1px solid #333;
      }

      .queue {
        display: flex;
        border: 1px solid #333;
      }

      .queue div {
        width: 60px;
        height: 60px;
        background: #ccc;
        border-right: 1px solid #333;
      }

      .queue div:last-child {
        border-right: none;
      }

      /* MAIN 3 COLUMN */
      .main-layout {
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }

      /* SIDEBAR */
      .sidebar {
        width: 180px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .label {
        font-size: 14px;
      }

      .bar {
        height: 25px;
        background: #ccc;
      }

      /* CENTER */
      .center-area {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .enemy-area {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .enemy-photo {
        width: 300px;
        height: 300px;
        background: #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .enemy-info {
        width: 300px;
        height: 20px;
        background: #ccc;
      }

      /* BOTTOM */
      .bottom-bar {
        display: flex;
        justify-content: space-between;
        position: relative;
        bottom: -60px;
      }

      .player {
        display: flex;
        gap: 10px;
      }

      .status {
        background: gray;
        padding: 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .status-bar {
        width: 80px;
        height: 10px;
        background: white;
        margin-top: 3px;
      }

      .actions {
        text-align: center;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px;
        background: #ccc;
        border: none;
        cursor: pointer;
        height: 60px;
      }

      .action-left {
        font-size: 14px;
      }
  </style>
</head>
<body>
  <div class="game-screen">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="left-icons">
      <button onclick="goBack()"><img src="/img/back.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
        <button onclick="goHome()"><img src="/img/home.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
    </div>

    <div class="turn-area">
      <div class="turn">
        TURN<br><strong>1</strong>
      </div>

      <div class="next">
        <div class="square"></div>
        <span>NEXT</span>
      </div>

      <div class="queue">
        <div></div><div></div><div></div><div></div><div></div>
      </div>
    </div>
  </div>

  <!-- MAIN 3 COLUMN -->
  <div class="main-layout">
    
    <!-- LEFT -->
    <div class="sidebar left">
      <div class="label">list enemies</div>
      <div class="bar"></div>
    </div>

    <!-- CENTER -->
    <div class="center-area">
      <div class="enemy-area">
        <div class="enemy-photo">Foto<br>Enemies</div>
        <div class="enemy-info"></div>
        <div class="enemy-info"></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="sidebar right">
      <div class="label">list party members</div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

  </div>

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <div class="player">
      <span><img src="/img/avatar.img" style="width:50px; height: 50px;"></span>
      <div class="status">
        <div style="display: flex; gap: 10px"><span>HP</span> <div class="status-bar"></div></div>
        <div style="display: flex; gap: 10px"><span>MP</span> <div class="status-bar"></div></div>
      </div>
    </div>

    <div class="actions">
      <div class="buttons">
        <button>Basic Attack</button>
        <button>Skill Player</button>
        <button>Skill Partner 1</button>
        <button>Skill Partner 2</button>
      </div>
    </div>

    <div class="action-left">Actions Left : 1</div>
  </div>
  <script>
    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }
  </script>
</div>
</body>
</html>
