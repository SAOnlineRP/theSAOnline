<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Screen Wireframe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: white;
    }

    .game-screen {
      height: 100vh;
      width: calc(100vh * 16 / 9);
      max-width: 100%;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .left-icons {
      display: flex;
      gap: 10px;
    }

    .turn-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .turn {
      text-align: center;
      font-size: 28px;
    }

    .turn-indicator {
      font-size: 18px;
      font-weight: bold;
    }

    .next {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .square {
      width: 50px;
      height: 50px;
      background: #ccc;
      border: 1px solid #333;
    }

    .current-turn-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .turn-avatar-box,
    .square {
      width: 50px;
      height: 50px;
      background: #ccc center center / cover no-repeat;
      border: 1px solid #333;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .queue {
      display: flex;
      gap: 6px;
      border: none;
    }

    .queue .turn-avatar-box {
      width: 40px;
      height: 40px;
    }

    .main-layout {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .sidebar {
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      font-size: 14px;
    }

    .bar {
      height: 25px;
      background: #ccc;
    }

    .center-area {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .enemy-area {
      display: flex;
      flex-direction: row;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border: 2px solid transparent;
      border-radius: 12px;
      transition: 0.2s;
    }

    .enemy-area.selected {
      border-color: yellow;
    }

    .enemy-area.dead {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .enemy-photo {
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .enemy-photo img {
      width: 75%;
      height: 75%;
      object-fit: contain;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 30px;
      gap: 16px;
    }

    .player {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .actions {
      text-align: center;
      flex: 1;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      background: #ccc;
      border: none;
      cursor: pointer;
      min-height: 50px;
      border-radius: 8px;
    }

    .action-left {
      font-size: 14px;
      min-width: 120px;
    }

    .status-card {
      background-color: #2c3e50;
      border: 1px solid #ecf0f1;
      border-radius: 8px;
      padding: 15px;
      color: white;
      min-width: 220px;
    }

    .status-card .name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-card .stat {
      margin-bottom: 6px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .health-bar,
    .mana-bar {
      width: 140px;
      height: 18px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .health-bar-fill,
    .mana-bar-fill {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.3s ease;
      min-width: 0;
    }

    .health-bar-fill {
      background: linear-gradient(to right, #4caf50, #2e7d32);
    }

    .mana-bar-fill {
      background: linear-gradient(to right, #2196f3, #1565c0);
    }

    .health-text,
    .mana-text {
      font-size: 11px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      white-space: nowrap;
    }

    .log-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .log-modal.show {
      display: flex;
    }

    .log-modal-content {
      width: min(600px, 90%);
      max-height: 80vh;
      background: #1f2a36;
      border: 1px solid #ecf0f1;
      border-radius: 12px;
      padding: 16px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-header h3 {
      margin: 0;
    }

    #close-log-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .battle-log {
      height: 300px;
      overflow-y: auto;
      background: rgba(255,255,255,0.08);
      padding: 10px;
      border-radius: 8px;
    }

    .log-entry {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .avatar {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="game-screen">

    <div class="top-bar">
      <div class="left-icons">
        <button onclick="goBack()">Back</button>
        <button onclick="goHome()">Home</button>
      </div>
      <button id="open-log-btn">Battle Log</button>
      <div class="turn-area">
        <div class="turn">
          TURN<br><strong id="turn-number">1</strong>
        </div>

        <div class="current-turn-box">
          <div id="current-turn-avatar" class="turn-avatar-box"></div>
          <div class="turn-indicator">Hero A's turn</div>
        </div>

        <div class="next">
          <div id="next-turn-avatar" class="square turn-avatar-box"></div>
          <span>NEXT</span>
        </div>

        <div class="queue" id="turn-queue">
          <div class="turn-avatar-box"></div>
          <div class="turn-avatar-box"></div>
          <div class="turn-avatar-box"></div>
          <div class="turn-avatar-box"></div>
          <div class="turn-avatar-box"></div>
        </div>
      </div>
    </div>

    <div class="main-layout">
      <div class="sidebar left">
        <div class="label">list enemies</div>
        <div class="bar"></div>
      </div>

      <div class="center-area">
        <div class="enemy-area enemy-section selected">
          <div class="enemy-photo">
            <img src="/img/slime.png" alt="Enemy">
          </div>

          <div class="status-card enemy-card">
            <div class="name">Orc</div>
            <div class="stat enemy-hp-label">HP: 120 / 120</div>
            <div class="health-bar">
              <div class="health-bar-fill enemy-health-fill" style="width: 100%;">
                <span class="health-text">120 / 120</span>
              </div>
            </div>
            <div class="stat enemy-atk">ATK: 0</div>
            <div class="stat enemy-def">DEF: 0</div>
          </div>
        </div>
      </div>

      <div class="sidebar right">
        <div class="label">list party members</div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="player">
        <img src="/img/avatar.png" alt="Avatar" class="avatar">

        <div class="status-card player-card">
          <div class="name">Hero A</div>

          <div class="stat-row">
            <span>HP</span>
            <div class="health-bar">
              <div class="health-bar-fill player-health-fill" style="width: 100%;">
                <span class="health-text">100 / 100</span>
              </div>
            </div>
          </div>

          <div class="stat-row">
            <span>MP</span>
            <div class="mana-bar">
              <div class="mana-bar-fill player-mana-fill" style="width: 100%;">
                <span class="mana-text">50 / 50</span>
              </div>
            </div>
          </div>

          <div class="stat player-shield"></div>
        </div>
      </div>

      <div class="actions">
        <div class="buttons">
          <button class="btn attack-btn">Basic Attack</button>
          <button class="btn skill-btn" data-skill="0">Fireball</button>
          <button class="btn skill-btn" data-skill="1">Shadow Strike</button>
          <button class="btn skill-btn" data-skill="2">Flame Burst</button>
          <button class="btn skill-btn" data-skill="3">Critical Boost</button>
          <button class="btn skill-btn" data-skill="4">Protective Barrier</button>
        </div>
      </div>

      <div class="action-left">Actions Left : 1</div>
    </div>

    <div id="log-modal" class="log-modal">
      <div class="log-modal-content">
        <div class="log-header">
          <h3>Battle Log</h3>
          <button id="close-log-btn">X</button>
        </div>

        <div class="battle-log" id="battle-log"></div>
      </div>
    </div>
    <script src="/js/battle.js"></script>
  </div>
</body>
</html>
