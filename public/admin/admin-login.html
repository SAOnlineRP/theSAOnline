<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body admin-login-page">
  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <p class="admin-login-subtitle">THE SAONLINE</p>
        <h1>Admin Panel</h1>
        <p class="admin-login-desc">Login untuk masuk ke dashboard admin.</p>
      </div>

      <form id="adminLoginForm" class="admin-login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            required
          />
        </div>

        <button type="submit" class="admin-btn primary-btn">Login</button>

        <p id="loginMessage" class="form-message"></p>
      </form>
    </div>
  </div>

  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
