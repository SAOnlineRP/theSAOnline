<section id="share" class="content-section">
    <div id="shareOverlayLoading" class="table-overlay hidden">
        <div class="spinner"></div>
    </div>
    <div class="panel-card">
        <div class="panel-head">
            <h3>Share</h3>
        </div>
        <div class="panel-body">
            <!-- TABS -->
            <div class="share-tabs">
                <button class="share-tab active" onclick="switchShareTab(event, 'update-bulk')">
                    Update Bulk
                </button>
                <button class="share-tab" onclick="switchShareTab(event, 'gifts')">
                    Gifts
                </button>
            </div>
            <div id="tab-update-bulk" class="share-tab-content active">
                <div id="bulkOverlayLoading" class="table-overlay hidden">
                    <div class="spinner"></div>
                </div>
                <div class="share-layout">
                    <div class="share-left">
                        <div class="form-share-grid">
                            <div class="form-share-group">
                                <label>Player Terpilih</label>
                                <button class="admin-btn" id="recepientSelectedSummary" onclick="openRecipientModal()">
                                    Pilih penerima
                                </button>
                            </div>

                            <div class="form-share-group">
                                <label>Tipe Update</label>
                                <select id="shareType">
                                    <option value="">Pilih Tipe</option>
                                    <option value="type-a">Col/Gems</option>
                                    <option value="type-b">Equipments/Partner</option>
                                    <option value="type-c">Items</option>
                                    <option value="type-d">Badges</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="share-right">
                        <div class="form-share-grid hidden" id="type-a">
                            <div class="form-share-group">
                                <label>Data</label>
                                <select id="type-a-data">
                                    <option value="col">Col</option>
                                    <option value="arcana_gems">Arcana Gems</option>
                                </select>
                            </div>
                            <div class="form-share-group">
                                <label>Amount:</label>
                                <input type="number" id="type-a-amount">
                            </div>
                        </div>

                        <div class="form-share-grid hidden" id="type-b">
                            <div class="form-share-group">
                                <label>Table</label>
                                <select id="type-b-table">
                                    <option value="">Select one</option>
                                    <option value="player_equipments">Equipments</option>
                                    <option value="player_partners">Partners</option>
                                </select>
                            </div>
                            <div class="form-share-group hidden">
                                <label>Catalog</label>
                                <select id="type-b-catalog-eq">
                                    <option value="ini-id1">Equipment 1</option>
                                    <option value="ini-id2">Equipment 1</option>
                                </select>
                            </div>
                            <div class="form-share-group hidden">
                                <label>Catalog</label>
                                <select id="type-b-catalog-partner">
                                    <option value="ini-id1">Equipment 1</option>
                                    <option value="ini-id2">Equipment 1</option>
                                </select>
                            </div>
                            <div class="form-share-group">
                                <label>Level</label>
                                <input id="type-b-level" type="number">
                            </div>
                            <div class="form-share-group">
                                <label>Star</label>
                                <input id="type-b-star" type="number">
                            </div>
                        </div>

                        <div class="form-share-grid hidden" id="type-c">
                            <div class="form-share-group">
                                <label>Catalog</label>
                                <select id="type-c-catalog">
                                    <option>Item A</option>
                                </select>
                            </div>
                            <div clas="form-share-group">
                                <label>Quantity</label>
                                <input id="type-c-qty" type="number">
                            </div>
                        </div>

                        <div class="form-share-grid hidden" id="type-d">
                            <div class="form-share-group">
                                <label>Catalog</label>
                                <select id="type-d-catalog">
                                    <option>Badge A</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;">
                    <button class="admin-btn primary-btn" onclick="updateSelected()">Update Selected</button>
                </div>
            </div>
            <div id="tab-gifts" class="share-tab-content">
                <div id="giftOverlayLoading" class="table-overlay hidden">
                    <div class="spinner"></div>
                </div>
                <div class="share-layout">
                    <div class="share-left">
                        <div class="form-share-grid">
                            <div class="form-share-group">
                                <label>Player Terpilih</label>
                                <button class="admin-btn" id="playerSelectedSummary" onclick="openRecipientModal()">
                                    Pilih penerima
                                </button>
                            </div>

                            <div class="form-share-group">
                                <label>Tipe Update</label>
                                <select id="giftType">
                                    <option value="">Pilih Tipe</option>
                                    <option value="gift-a">Col/Gems</option>
                                    <option value="gift-b">Equipments/Partner</option>
                                    <option value="gift-c">Items</option>
                                    <option value="gift-d">Badges</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="share-right">
                        <div class="form-share-grid hidden" id="gift-a">
                            <div class="form-share-group">
                                <label>Data</label>
                                <select id="gift-a-column">
                                    <option value="col">Col</option>
                                    <option value="arcana_gems">Arcana Gems</option>
                                </select>
                            </div>
                            <div class="form-share-group">
                                <label>Amount:</label>
                                <input id="gift-a-amount" type="number">
                            </div>
                        </div>

                        <div class="form-share-grid hidden" id="gift-b">
                            <div class="form-share-group">
                                <label>Table</label>
                                <select id="gift-b-table">
                                    <option value="">Select one</option>
                                    <option value="player_equipments">Equipments</option>
                                    <option value="player_partners">Partners</option>
                                </select>
                            </div>
                            <div class="form-share-group hidden">
                                <label>Catalog</label>
                                <select id="gift-b-catalog-eq">
                                    <option>Equipment 1</option>
                                </select>
                            </div>
                            <div class="form-share-group hidden">
                                <label>Catalog</label>
                                <select id="gift-b-catalog-partner">
                                    <option>Equipment 1</option>
                                </select>
                            </div>
                            <div class="form-share-group">
                                <label>Level</label>
                                <input id="gift-b-level" type="number">
                            </div>
                            <div class="form-share-group">
                                <label>Star</label>
                                <input id="gift-b-star" type="number">
                            </div>
                        </div>

                        <div class="form-share-grid hidden" id="gift-c">
                            <div class="form-share-group">
                                <label>Catalog</label>
                                <select id="gift-c-catalog">
                                    <option>Item A</option>
                                </select>
                            </div>
                            <div clas="form-share-group">
                                <label>Quantity</label>
                                <input id="gift-c-qty" type="number">
                            </div>
                        </div>

                        <div class="form-share-grid hidden" id="gift-d">
                            <div class="form-share-group">
                                <label>Catalog</label>
                                <select id="gift-d-catalog">
                                    <option>Badge A</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;">
                    <button class="admin-btn primary-btn" onclick="sendSelected()">Send</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Modal -->
<div class="modal" id="recipientModal">

    <div class="modal-content">

        <div class="modal-header">
            <div style="display:flex; gap:10px;">
                <h3>Pilih Penerima</h3>
                <button onclick="uploadCSV()"><i class="fa-solid fa-upload"></i></button>
            </div>
            <span class="close-btn" onclick="closeRecipientModal()">
            ✕
            </span>
        </div>

        <div class="search-wrapper">

            <input type="text" id="searchInput" placeholder="Cari nama..." class="search-input">

            <button type="button" id="clearSearch" class="clear-search">
                ✕
            </button>

        </div>

        <div class="actions">
            <button id="selectAllBtn" onclick="toggleAllRecipients()">
                Pilih Semua
            </button>
        </div>

        <div class="user-list" id="user-list">
            
        </div>

        <div class="modal-footer">
            <button id="saveBtn" onclick="saveRecipients()">
                Simpan
            </button>
        </div>

    </div>

</div>

<div class="modal" id="uploadCSVmodal">
    <div class="modal-content">
        <h2>Upload CSV</h2>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="csvFile" accept=".csv" hidden>

            <div class="upload-icon">📄</div>
            <p>Drag & Drop CSV di sini</p>
            <span>atau</span>

            <button type="button" onclick="document.getElementById('csvFile').click()">
                Pilih File
            </button>

            <div class="selected-file" id="selectedFile">
                Belum ada file dipilih
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeUploadCSVModal()">Batal</button>
            <button class="btn-primary">Upload</button>
        </div>
    </div>
</div>
