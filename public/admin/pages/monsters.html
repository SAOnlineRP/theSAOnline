<section id="monsters" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Monsters</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedMonstersBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openMonsterModal">
                    + Add Monster
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <div id="tableMonsterOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
            <table id="monstersTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllMonsterTasks"></th>
                    <th>Photo</th>
                    <th>Monster Name</th>
                    <th>Monster Type</th>
                    <th>Monster Stats</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="monstersTableBody">
                
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- modal -->
<div class="modal" id="monsterModal">

    <div class="modal-content">

        <span class="close-btn" id="closeMonsterModal">
        &times;
        </span>

        <h2>Add New Monster</h2>
        <div class="modal-body">
            <form id="monsterForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="monsterName">Name:</label>
                        <input type="text" id="monsterName" name="monsterName" required />
                    </div>
                    <div class="form-group">
                        <label for="monsterDescription">Description:</label>
                        <input type="text" id="monsterDescription" name="monsterDescription" required />
                    </div>
                    
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveMonsterBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
