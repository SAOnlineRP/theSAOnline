<section id="summon_pools" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Summon Pools</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedSummonPoolBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openSummonPoolModal">
                    + Add Summon Pool
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="summonPoolsTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllSummonPools"></th>
                    <th>Summon Type</th>
                    <th>Reward Type</th>
                    <th>Reward Name</th>
                    <th>Probability</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="summonPoolsTableBody">
                
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- modal -->
<div class="modal" id="summonPoolModal">

    <div class="modal-content">

        <span class="close-btn" id="closeSummonPoolModal">
        &times;
        </span>

        <h2>Add New Summon Pool</h2>
        <div class="modal-body">
            <form id="summonPoolForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="summonType">Summon Type</label>
                        <select id="summonType" name="summonType" required>
                            <option value="regular">Regular</option>
                            <option value="special">Special</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rewardType">Reward Type:</label>
                        <select id="rewardType" name="rewardType" required>
                            <option value="item">Item</option>
                            <option value="partner">Partner</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rewardName">Reward Type:</label>
                        <select id="rewardName" name="rewardName">
                            
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="probability">Probability</label>
                        <input type="number" id="probability" name="probability">
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="quantity" id="quantity" name="probability">
                    </div>
                    
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveSummonPoolBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
