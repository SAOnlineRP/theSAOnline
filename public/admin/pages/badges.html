<section id="badges" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Badges</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedBadgesBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openBadgeModal">+ Add Badge</button>
            </div>
        </div>

        <div class="table-wrapper">
            <div id="tableBadgeOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
        
            <table id="badgesTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllBadgeTasks"></th>
                    <th>Photo</th>
                    <th>Badge Name</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="badgesTableBody">
                
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- modal -->
<div class="modal" id="badgeModal">

    <div class="modal-content">

        <span class="close-btn" id="closeBadgeModal">
        &times;
        </span>

        <h2>Add New Badge</h2>
        <div class="modal-body">
            <form id="badgeForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="badgeName">Name:</label>
                        <input type="text" id="badgeName" name="badgeName" required />
                    </div>
                    <div class="form-group">
                        <label for="badgeDescription">Description:</label>
                        <input type="text" id="badgeDescription" name="badgeDescription" required />
                    </div>
                    
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveBadgeBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
