<section id="soul_traits" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Soul Traits</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedSoulTraitsBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openSoulTraitModal">+ Add Soul Trait</button>
            </div>
        </div>

        <div class="table-wrapper">
            <div id="tableOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
            <table id="soulTraitsTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllSoulTraits"></th>
                    <th>Name</th>
                    <th>Stats</th>
                    <th>Growth</th>
                    <th>Skill Name</th>
                    <th>Skill MP Cost</th>
                    <th>Effects</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="soulTraitsTableBody">
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- modal -->
<div class="modal" id="soulTraitModal">

    <div class="modal-content">

        <span class="close-btn" id="closeSoulTraitModal">
        &times;
        </span>

        <h2>Add New Soul Trait</h2>
        <div class="modal-body">
            <form id="soulTraitForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="soulTraitName">Name:</label>
                        <input type="text" id="soulTraitName" name="soulTraitName" required />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitATK">ATK:</label>
                        <input type="text" id="soulTraitATK" name="soulTraitATK" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitDEF">DEF:</label>
                        <input type="text" id="soulTraitDEF" name="soulTraitDEF" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitMAX_HP">MAX_HP:</label>
                        <input type="text" id="soulTraitMAX_HP" name="soulTraitMAX_HP" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitMAX_MP">MAX_MP:</label>
                        <input type="text" id="soulTraitMAX_MP" name="soulTraitMAX_MP" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitCRIT_DMG">CRIT DMG:</label>
                        <input type="text" id="soulTraitCRIT_DMG" name="soulTraitCRIT_DMG" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitCRIT_PCT">CRIT RATE (%):</label>
                        <input type="text" id="soulTraitCRIT_PCT" name="soulTraitCRIT_PCT" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitGrowthATK">Growth ATK:</label>
                        <input type="text" id="soulTraitGrowthATK" name="soulTraitGrowthATK" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitGrowthDEF">Growth DEF:</label>
                        <input type="text" id="soulTraitGrowthDEF" name="soulTraitGrowthDEF" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitGrowthMAX_HP">Growth MAX HP:</label>
                        <input type="text" id="soulTraitGrowthMAX_HP" name="soulTraitGrowthMAX_HP" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitGrowthMAX_MP">Growth MAX MP:</label>
                        <input type="text" id="soulTraitGrowthMAX_MP" name="soulTraitGrowthMAX_MP" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitGrowthCRIT_DMG">Growth CRIT DMG:</label>
                        <input type="text" id="soulTraitGrowthCRIT_DMG" name="soulTraitGrowthCRIT_DMG" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitGrowthCRIT_PCT">Growth CRIT RATE (%):</label>
                        <input type="text" id="soulTraitGrowthCRIT_PCT" name="soulTraitGrowthCRIT_PCT" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitSkillName">Skill Name:</label>
                        <input type="text" id="soulTraitSkillName" name="soulTraitSkillName" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitSkillMPCost">Skill MP Cost:</label>
                        <input type="number" id="soulTraitSkillMPCost" name="soulTraitSkillMPCost" />
                    </div>
                    <div class="form-group">
                        <label for="soulTraitEffects">Effects:</label>
                        <input type="text" id="soulTraitEffects" name="soulTraitEffects" />
                    </div>
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveSoulTraitBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
