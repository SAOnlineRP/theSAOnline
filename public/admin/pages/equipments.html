<section id="equipments" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Equipments</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedEqBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openEquipmentModal">+ Add Equipment</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="equipmentsTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllTasks"></th>
                    <th>Photo</th>
                    <th>Equipment Name</th>
                    <th>Position</th>
                    <th>Type</th>
                    <th>Stats</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="equipmentsTableBody">
                
                </tbody>
            </table>
        </div>
    </div>
</section>
<!-- modal -->
<div class="modal" id="equipmentModal">

    <div class="modal-content">

        <span class="close-btn" id="closeEquipmentModal">
        &times;
        </span>

        <h2>Add New Equipment</h2>
        <div class="modal-body">
            <form id="equipmentForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="equipmentName">Name:</label>
                        <input type="text" id="equipmentName" name="equipmentName" required />
                    </div>
                    <div class="form-group">
                        <label for="equipmentPosition">Position:</label>
                        <input type="text" id="equipmentPosition" name="equipmentPosition" required />
                    </div>
                    <div class="form-group">
                        <label for="equipmentType">Type:</label>
                        <input type="text" id="equipmentType" name="equipmentType" required />
                    </div>
                    <div class="form-group">
                        <label for="equipmentATK">ATK:</label>
                        <input type="text" id="equipmentATK" name="equipmentATK" />
                    </div>
                    <div class="form-group">
                        <label for="equipmentDEF">DEF:</label>
                        <input type="text" id="equipmentDEF" name="equipmentDEF" />
                    </div>
                    <div class="form-group">
                        <label for="equipmentMAX_HP">MAX_HP:</label>
                        <input type="text" id="equipmentMAX_HP" name="equipmentMAX_HP" />
                    </div>
                    
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveEquipmentBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
