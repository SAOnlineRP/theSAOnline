<section id="users" class="content-section">
    <!-- USER LIST -->
    <div id="usersListView">
        <div class="panel-card">
        <div class="panel-head">
            <h3>Users</h3>
        </div>

        <div class="table-wrapper">
            <div id="tableUserOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
            <table class="admin-table">
            <thead>
                <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
                </tr>
            </thead>
            <tbody id="listPlayersBody">
                
            </tbody>
            </table>
        </div>
        </div>
    </div>
    <!-- USER DETAIL -->
    <div id="userDetailView" style="display:none;">

        <div class="panel-card">

        <!-- HEADER -->
        <div class="user-profile-header">

            <div class="user-profile-info">
            <h2 id="detailUsername">Player</h2>
            <p>Player Profile & Inventory</p>
            </div>

            <button
            class="admin-btn primary-btn"
            onclick="editPlayerInfo()"
            > Edit Player
            </button>

        </div>

        <!-- STATS -->
        <div class="stats-grid">

            <div class="stat-card">
            <h3>Level</h3>
            <p id="userLevel">25</p>
            </div>

            <div class="stat-card">
            <h3>Gold</h3>
            <p id="userGold">5000</p>
            </div>

            <div class="stat-card">
            <h3>Gems</h3>
            <p id="userGems">1200</p>
            </div>

            <div class="stat-card">
            <h3>Total Weapon</h3>
            <p id="userWeaponCount">2</p>
            </div>

        </div>

        <!-- INVENTORY -->
        <div class="inventory-grid">

            <!-- WEAPONS -->
            <div class="inventory-card">
            <h4>Weapons</h4>
            <ul id="weaponList"></ul>
            </div>

            <!-- ITEMS -->
            <div class="inventory-card">
            <h4>Items</h4>
            <ul id="itemList"></ul>
            </div>

            <!-- GACHA -->
            <div class="inventory-card">
            <h4>Gacha History</h4>
            <ul id="gachaList"></ul>
            </div>

            <!-- ACCOUNT -->
            <div class="inventory-card">
            <h4>Account Info</h4>

            <ul>
                <li>Email: player1@mail.com</li>
                <li>Status: Active</li>
                <li>Role: User</li>
            </ul>
            </div>

        </div>
    </div>

</section>

<!-- EDIT PLAYER MODAL -->
<div id="editPlayerModal" class="modal">

    <div class="modal-content edit-player-modal">

        <span
            class="close-btn"
            onclick="closeEditPlayerModal()"
        >
            ✕
        </span>

        <h2 style="margin-bottom:20px;">
            Edit Player
        </h2>

        <!-- TABS -->
        <div class="player-tabs">

            <button
                class="player-tab active"
                onclick="switchPlayerTab(event, 'profile')"
            >
                Profile
            </button>

            <button
                class="player-tab"
                onclick="switchPlayerTab(event, 'equipment')"
            >
                Equipment
            </button>

            <button
                class="player-tab"
                onclick="switchPlayerTab(event, 'items')"
            >
                Items
            </button>

            <button
                class="player-tab"
                onclick="switchPlayerTab(event, 'stats')"
            >
                Stats
            </button>

        </div>

        <!-- PROFILE -->
        <div
            id="tab-profile"
            class="player-tab-content active"
        >

            <div class="form-grid">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="editUsername">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail">
                </div>

                <div class="form-group">
                    <label>Role</label>

                    <select id="editRole">
                        <option>User</option>
                        <option>Admin</option>
                    </select>
                </div>

            </div>

        </div>

        <!-- EQUIPMENT -->
        <div
            id="tab-equipment"
            class="player-tab-content"
        >

            <div id="equipmentContainer"></div>

            <button
                class="admin-btn primary-btn"
                onclick="addEquipmentRow()"
            >
                + Add Equipment
            </button>

        </div>

        <!-- ITEMS -->
        <div
            id="tab-items"
            class="player-tab-content"
        >

            <div id="itemsContainer"></div>

            <button
                class="admin-btn primary-btn"
                onclick="addItemRow()"
            >
                + Add Item
            </button>

        </div>

        <!-- STATS -->
        <div
            id="tab-stats"
            class="player-tab-content"
        >

            <div class="form-grid">

                <div class="form-group">
                    <label>Level</label>
                    <input type="number" id="editLevel">
                </div>

                <div class="form-group">
                    <label>Gold</label>
                    <input type="number" id="editGold">
                </div>

                <div class="form-group">
                    <label>Gems</label>
                    <input type="number" id="editGems">
                </div>

            </div>

        </div>

        <div
            style="
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:24px;
            "
        >

            <button
                class="admin-btn"
                onclick="closeEditPlayerModal()"
            >
                Cancel
            </button>

            <button
                class="admin-btn primary-btn"
                onclick="savePlayerChanges()"
            >
                Save Changes
            </button>
        </div>
    </div>
</div>
<script src="../js/user.js"></script>
