<section id="partners" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Partners</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedPartnersBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openPartnerModal">+ Add Partner</button>
            </div>
        </div>

        <div class="table-wrapper">
            <div id="tablePartnerOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
            <table id="partnersTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllPartnerTasks"></th>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Stats</th>
                    <th>Skills</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="partnersTableBody">
                </tbody>
            </table>
        </div>
    </div>
</section>
<!-- modal -->
<div class="modal" id="partnerModal">

    <div class="modal-content">

        <span class="close-btn" id="closePartnerModal">
        &times;
        </span>

        <h2>Add New Partner</h2>
        <div class="modal-body">
            <form id="partnerForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="partnerName">Name:</label>
                        <input type="text" id="partnerName" name="partnerName" required />
                    </div>
                    <div class="form-group">
                        <label for="statAtk">ATK:</label>
                        <input type="text" id="statAtk" name="statAtk" required />
                    </div>
                    <div class="form-group">
                        <label for="statDef">DEF:</label>
                        <input type="text" id="statDef" name="statDef" required />
                    </div>
                    <div class="form-group">
                        <label for="statMaxHP">MAX_HP:</label>
                        <input type="text" id="statMaxHP" name="statMaxHP" required />
                    </div>
                    <div class="form-group">
                        <label for="statMaxMP">MAX_MP:</label>
                        <input type="text" id="statMaxMP" name="statMaxMP" required />
                    </div>
                    <div class="form-group">
                        <label for="statShard">Reward Shard:</label>
                        <input type="text" id="statShard" name="statShard" required />
                    </div>
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="savePartnerBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>

    </div>

</div>
