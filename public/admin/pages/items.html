<section id="items" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Items</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedItemsBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openItemModal">+ Add Item</button>
            </div>
        </div>

        <div class="table-wrapper">
            <div id="tableItemsOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
            <table id="itemsTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllItemTasks"></th>
                    <th>Photo</th>
                    <th>Item Name</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="itemsTableBody">
                
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- modal -->
<div class="modal" id="itemModal">

    <div class="modal-content">

        <span class="close-btn" id="closeItemModal">
        &times;
        </span>

        <h2>Add New Item</h2>
        <div class="modal-body">
            <form id="itemForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="itemName">Name:</label>
                        <input type="text" id="itemName" name="itemName" required />
                    </div>
                    <div class="form-group">
                        <label for="itemDescription">Description:</label>
                        <input type="text" id="itemDescription" name="itemDescription" required />
                    </div>
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveItemBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
