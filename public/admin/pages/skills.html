<section id="skills" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
        <h3>Skills</h3>
        <button class="admin-btn primary-btn" id="openSkillModal">+ Add Skill</button>
        </div>

        <div class="table-wrapper">
            <div id="tableSkillOverlayLoading" class="table-overlay hidden">
                <div class="spinner"></div>
            </div>
            <table id="skillsTable" class="admin-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>MP Cost</th>
                    <th>Effects</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="skillsTableBody">
                </tbody>
            </table>
        </div>
    </div>
</section>
<!-- modal -->
<div class="modal" id="skillModal">

    <div class="modal-content">

        <span class="close-btn" id="closeSkillModal">
        &times;
        </span>

        <h2>Add New Skill</h2>
        <div class="modal-body">
            <form id="skillForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="skillName">Name:</label>
                        <input type="text" id="skillName" name="skillName" required />
                    </div>
                    <div class="form-group">
                        <label for="mpCost">MP Cost:</label>
                        <input type="text" id="mpCost" name="mpCost" required />
                    </div>
                    <div class="form-group">
                        <label for="effects">Effects:</label>
                        <input type="text" id="effects" name="effects" required />
                    </div>
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveSkillBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>

    </div>

</div>
