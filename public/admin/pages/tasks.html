<section id="tasks" class="content-section">
    <div class="panel-card">
        <div class="panel-head">
            <h3>Tasks</h3>
            <div>
                <button class="admin-btn danger-btn hidden" id="deleteSelectedTasksBtn">
                    Delete Selected
                </button>
                <button class="admin-btn primary-btn" id="openTaskModal">
                    + Add Task
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="tasksTable" class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllTasks"></th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Rewards</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="tasksTableBody">
                
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- modal -->
<div class="modal" id="taskModal">

    <div class="modal-content">

        <span class="close-btn" id="closeTaskModal">
        &times;
        </span>

        <h2>Add New Task</h2>
        <div class="modal-body">
            <form id="taskForm" style="overflow: visible;">
                <div class="form-grid" style="max-height: 220px; overflow-y: auto;">
                    <div class="form-group">
                        <label for="taskName">Name:</label>
                        <input type="text" id="taskName" name="taskName" required />
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description:</label>
                        <input type="text" id="taskDescription" name="taskDescription" required />
                    </div>
                    
                </div>
                <button
                    type="submit"
                    class="admin-btn primary-btn"
                    id="saveTaskBtn"
                >
                    <span class="btn-text">Save</span>

                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

</div>
