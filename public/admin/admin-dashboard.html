<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.min.css" rel="stylesheet" />
</head>

<body class="admin-body">

  <div class="admin-layout">

    <aside class="admin-sidebar">

      <div class="sidebar-top">
        <h2>Admin CMS</h2>
        <p>THE SAONLINE</p>
      </div>

      <nav class="sidebar-menu">

        <button class="menu-item menu-click active" data-page="overview">
          Overview
        </button>

        <!-- Catalog -->
        <div class="menu-group">

          <button class="menu-item expand-btn">
            Catalogs
          </button>

          <div class="submenu">
            <button class="submenu-item menu-click" data-page="soul_traits">Soul Traits</button>
            <button class="submenu-item menu-click" data-page="partners">Partners</button>
            <button class="submenu-item menu-click" data-page="skills">Skills</button>
            <button class="submenu-item menu-click" data-page="equipments">Equipments</button>
            <button class="submenu-item menu-click" data-page="items">Items</button>
            <button class="submenu-item menu-click" data-page="badges">Badges</button>
            <button class="submenu-item menu-click" data-page="monsters">Monsters</button>
            <button class="submenu-item menu-click" data-page="quests">Quests</button>
            <button class="submenu-item menu-click" data-page="tasks">Tasks</button>
          </div>

        </div>
        <button class="menu-item menu-click" data-page="summon_pools">
          Summon Pools
        </button>

        <button class="menu-item menu-click" data-page="merchant">
          Merchant
        </button>

        <button class="menu-item menu-click" data-page="users">
          Users
        </button>

        <button class="menu-item menu-click" data-page="share">
          Share
        </button>

      </nav>

      <div class="sidebar-bottom">
        <button id="logoutBtn" class="admin-btn danger-btn">
          Logout
        </button>
      </div>

    </aside>

    <main class="admin-main" id="mainContent">

    </main>

  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://kit.fontawesome.com/bf6001b681.js" crossorigin="anonymous"></script>
  <script src="https://cdn.datatables.net/2.3.8/js/dataTables.min.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/user.js"></script>
  <script src="js/partner.js"></script>
  <script src="js/skill.js"></script>
  <script src="js/equipment.js"></script>
  <script src="js/item.js"></script>
  <script src="js/soul_trait.js"></script>
  <script src="js/share.js"></script>
  <script src="js/task.js"></script>
  <script src="js/badge.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/summon_pool.js"></script>
</body>
</html>
