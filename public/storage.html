  <script type="text/javascript">
    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }
    function switchTab(event) {
        event.preventDefault();
        // Remove active class from all nav links
        document.querySelectorAll('.nav-link-storage').forEach(link => {
            link.classList.remove('active');
        });

        // Hide all tab panes
        document.querySelectorAll('.tab-pane').forEach(pane => {
            pane.classList.remove('active', 'show');
        });

        // Activate clicked nav
        const clicked = event.target;
        clicked.classList.add('active');

        // Show target tab
        const targetId = clicked.getAttribute('data-target');
        const targetPane = document.getElementById(targetId);
        if (targetPane) {
            targetPane.classList.add('active', 'show');
        }
    }
    const scrollArrow = document.getElementById('scrollArrow');
    const inventoryBox = document.getElementById('storageTabsContent');

    scrollArrow.addEventListener('click', () => {
        inventoryBox.scrollBy({
        top: 100,     // jumlah pixel yang di-scroll (ubah sesuai kebutuhan)
        behavior: 'smooth' // animasi smooth
        });
    });

    function openPopup() {
        document.getElementById('myPopup').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('myPopup').style.display = 'none';
    }
  </script>
