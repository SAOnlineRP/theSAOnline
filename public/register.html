<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theSAOnline</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/register.css" />
</head>
<body>
  <main class="screen">
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
    <div class="nebula"></div>
    <div class="grid-plane"></div>

    <div class="stars-container">
      <div class="star-layer"></div>
      <div class="star-layer"></div>
      <div class="star-layer"></div>
    </div>

    <div class="button-container" id="startContainer">
      <div class="button-hexagons">
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
      </div>      
      
    </div>
    <div>
      <h2 class="register-title">REGISTER</h2>
      <div class="register-modal">
        <div class="register-panel">
          <div class="sao-overlay"></div>

          <div class="register-corners" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <img src="img/characters/cewek1.png">
        </div>
        <div class="register-panel">
          <div class="sao-overlay"></div>

          <div class="register-corners" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <form class="register-form" id="registerForm">
            <input type="text" id="username" placeholder="USERNAME" required />
            <input type="password" id="password" placeholder="PASSWORD" required />

            <div class="register-actions">
              <button type="submit" class="register-btn">ENTER</button>
              <button type="button" class="close-btn" id="closeModalBtn">CANCEL</button>
            </div>

            <div class="register-status" id="registerStatus"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module">

  </script>
</body>
</html>
