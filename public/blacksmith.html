<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Wireframe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
    }

    .screen {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

    /* top bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .topbar-left {
      display: flex;
      gap: 18px;
      color: #000;
      align-items: center;
    }

    .topbar-left button {
      border: none;
      background: none;
      font-size: 40px;
      cursor: pointer;
    }

    .topbar-right {
      display: flex;
      gap: 14px;
    }

    .currency-box {
      min-width: 100px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 24px;
      color: #222;
      padding: 0 12px;
    }

    /* main section */
    .inventory-area {
      position: absolute;
      right: 55px;
      top: 145px;
      z-index: 2;
      color: #fff;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    /* category tabs */
    .category-tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .category-tabs button {
      width: 80px;
      height: 80px;
      border: none;
      background: transparent;
      font-size: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
    }

    .category-tabs .tab {
      font-size: 30px;
    }

    .category-tabs button.active {
      background: #8d8d8d;
      color: white;
    }

    .grid-box {
      background: #8d8d8d;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-auto-rows: 80px;
      gap: 8px;

      max-height: calc((80px * 4) + (8px * 3) + 24px);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .slot {
      position: relative;
      background: #e9e9e9;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #222;
      cursor: pointer;
    }

    /* label selected */
    .selected-label {
      position: absolute;
      bottom: 4px;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }

    /* kalau dipilih */
    .slot.selected {
      outline: 3px solid yellow;
    }

    .slot.selected .selected-label {
      display: block;
    }

    .bottom-buttons {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      border: none;
      background: #d2d2d2;
      padding: 10px 16px;
      font-size: 20px;
      cursor: pointer;
      color: #222;
    }

    .action-btn:hover {
      background: #c4c4c4;
    }

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup.hidden {
      display: none;
    }

    .popup-content {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
    }
    @media (max-width: 640px) {
      .inventory-area {
        height: 80%;
        position: unset;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .category-tabs {
        flex-direction: row;
      }

      .category-tabs button {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }

      .grid-box {
        grid-template-columns: repeat(4, 60px);
        max-height: none;
        grid-auto-rows: 60px;
      }

      .slot {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="topbar-left">
        <button onclick="goBack()"><img src="/img/back.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
        <button onclick="goHome()"><img src="/img/home.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
      </div>

      <div class="topbar-right">
        <div class="currency-box">🪙 10000</div>
        <div class="currency-box">💎 50</div>
      </div>
    </div>

    <!-- Main Inventory -->
    <div class="inventory-area">
        <div class="category-tabs">
            <button class="tab active" data-category="all" onclick="switchTab(event)">ALL</button>
            <button class="tab-icon" data-category="weapon" onclick="switchTab(event)">⚔</button>
            <button class="tab-icon" data-category="armor" onclick="switchTab(event)">🛡</button>
            <button class="tab-icon" data-category="potion" onclick="switchTab(event)">🧪</button>
        </div>

        <div class="inventory-panel">
            <div class="grid-box" id="gridBox"></div>

            <div class="bottom-buttons">
            <button class="action-btn" onclick="levelUp()">Level Up</button>
            <button class="action-btn">Limit Break</button>
            </div>
        </div>
        </div>

  </div>
  <div id="popup" class="popup hidden">
    <div class="popup-content">
        <h2>Level Up</h2>
        <p id="popupText"></p>
        <button onclick="closePopup()">Close</button>
    </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script>
  function goBack() {
    window.history.back();
  }

  function goHome() {
    window.location.href = "menu.html";
  }

  const inventoryData = {
    all: [
        { icon: "⚔", name: "Item A" },
        { icon: "🛡", name: "Item B" },
        { icon: "🧪", name: "Item C" },
        { icon: "⚔", name: "Item D" },
        { icon: "🧪", name: "Item E" },
        { icon: "🛡", name: "Item F" },
        { icon: "⚔", name: "Item G" },
        { icon: "🧪", name: "Item H" },
        { icon: "🛡", name: "Item I" },
        { icon: "⚔", name: "Item J" },
        { icon: "🧪", name: "Item K" },
        { icon: "🛡", name: "Item L" },
        { icon: "⚔", name: "Item M" },
        { icon: "🧪", name: "Item N" }
    ],
    weapon: [
        { icon: "⚔", name: "Weapon A" },
        { icon: "⚔", name: "Weapon B" },
        { icon: "⚔", name: "Weapon C" },
        { icon: "⚔", name: "Weapon D" },
        { icon: "⚔", name: "Weapon E" }
    ],
    armor: [
        { icon: "🛡", name: "Armor A" },
        { icon: "🛡", name: "Armor B" },
        { icon: "🛡", name: "Armor C" },
        { icon: "🛡", name: "Armor D" },
        { icon: "🛡", name: "Armor E" }
    ],
    potion: [
      { icon: "🧪", name: "Potion A" },
      { icon: "🧪", name: "Potion B" },
      { icon: "🧪", name: "Potion C" },
      { icon: "🧪", name: "Potion D" },
      { icon: "🧪", name: "Potion E" },
      { icon: "🧪", name: "Potion F" }
    ]
  };

    let selectedItem = null;
    function renderGrid(category) {
        const gridBox = document.getElementById("gridBox");
        const items = inventoryData[category];
        gridBox.innerHTML = "";

        items.forEach(item => {
            const slot = document.createElement("div");
            slot.classList.add("slot");

            slot.innerHTML = `
            <span>${item.icon}</span>
            <span class="selected-label">Selected</span>
            `;

            slot.onclick = () => selectSlot(slot, item);

            gridBox.appendChild(slot);
        });
    }

    function selectSlot(clickedSlot, item) {
        document.querySelectorAll(".slot").forEach(slot => {
            slot.classList.remove("selected");
        });

        clickedSlot.classList.add("selected");

        // simpan item yang dipilih
        selectedItem = item;
    }

  function switchTab(event) {
    const clicked = event.currentTarget;
    const category = clicked.getAttribute("data-category");

    document.querySelectorAll(".category-tabs button").forEach(btn => {
      btn.classList.remove("active");
    });

    clicked.classList.add("active");
    renderGrid(category);
  }

  renderGrid("all");

  function levelUp() {
  if (!selectedItem) {
    alert("Pilih item dulu!");
    return;
  }

  const popup = document.getElementById("popup");
  const text = document.getElementById("popupText");

  text.textContent = `Leveling up ${selectedItem.name}`;
  popup.classList.remove("hidden");
}

function closePopup() {
  document.getElementById("popup").classList.add("hidden");
}
</script>
</body>
</html>
