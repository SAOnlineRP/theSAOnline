<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blacksmith - theSAOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/blacksmith.css">
</head>
<body>
  <div class="screen">
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="loading-overlay">
        <div>Loading Assets...</div>
        <div class="loading-bar-container">
            <div id="loading-bar" class="loading-bar"></div>
        </div>
    </div>
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
    <div class="topbar">
      <div class="topbar-left">
        <button onclick="goBack()"><img src="/img/back2.png" style="width: 40px; height: 40px; margin-top:10px" alt="Back"></button>
        <button onclick="goHome()"><img src="/img/home2.png" style="width: 40px; height: 40px; margin-top:10px" alt="Home"></button>
      </div>

      <div class="topbar-right">
        <div class="currency-box"><img src="img/col.png" style="width: 50px; height: 50px;"><span id="col-player">10000</span></div>
        <div class="currency-box"><img src="img/gems.png" style="width: 50px; height: 50px;"><span id="gems-player">50</span></div>
      </div>
    </div>

    <!-- Main Inventory -->
    <div class="inventory-area">
        <div class="category-tabs">
            <button class="tab active" data-category="all" onclick="switchTab(event)">ALL</button>
            <button class="tab-icon" data-category="weapon" onclick="switchTab(event)">⚔</button>
            <button class="tab-icon" data-category="armor" onclick="switchTab(event)">🛡</button>
        </div>

        <div class="inventory-panel">
            <div class="search-row">
              <input id="searchInput" type="search" placeholder="Search item by name..." />
              <div class="filters-row">
                <select id="typeFilter">
                  <option value="">All Types</option>
                </select>
                <select id="positionFilter">
                  <option value="">All Positions</option>
                </select>
                <select id="starFilter">
                  <option value="">All Stars</option>
                  <option value="1">1★</option>
                  <option value="2">2★</option>
                  <option value="3">3★</option>
                  <option value="4">4★</option>
                  <option value="5">5★</option>
                </select>
              </div>
            </div>
            <div class="grid-box" id="gridBox"></div>

            <div class="bottom-buttons">
              <button class="action-btn" onclick="levelUp()">Level Up</button>
              <button class="action-btn" onclick="openLimitBreak()">Limit Break</button>
            </div>
        </div>
        </div>

  </div>
  <div id="popup" class="popup hidden">
    <div class="popup-content">
        <h2 id="popupName"></h2>
        <br>
        <div style="display:flex; gap: 20px; justify-content: space-evenly;">
          <div style="display: flex;
              flex-direction: column;
              gap: 10px;">
            <img id="popupImage" width="120">
            <p>Level: <span id="popupLevel"></span></p>
            <p>Position: <span id="popupPosition"></span></p>
          </div>
          <div style="display: flex;
              flex-direction: column;
              gap: 10px;">
            <label for="levelupItemSelect">Item yang dipakai</label>
            <select id="levelupItemSelect"></select>

            <p>Qty tersedia: <span id="levelupItemQty">0</span></p>
            <p>Dibutuhkan: <span id="levelupItemNeeded">0</span></p>

            <label for="levelupAmount">Naikkan berapa level</label>
            <input id="levelupAmount" type="number" min="1" value="1">

            <p>Level baru: <span id="levelupResult">0</span></p>
          </div>
        </div>
        <br>
        <div class="popup-actions">
            <button class="popup-save" id="confirmLevelupBtn">Konfirmasi</button>
            <button class="popup-cancel"onclick="closePopup()">Batal</button>
        </div>

        <p id="levelupMessage"></p>
    </div>
  </div>

  <div id="limitBreakPopup" class="popup hidden">
    <div class="popup-content">
        <h2 id="limitBreakName"></h2>
        <br>
        <div style="display:flex; gap: 20px; justify-content: space-evenly;">
          <div style="display: flex;
              flex-direction: column;
              gap: 10px;">
            <img id="limitBreakImage" width="120">
            <p>Star sekarang: <span id="limitBreakCurrentStar">0</span></p>
            <p>Level sekarang: <span id="limitBreakCurrentLevel">0</span></p>
          </div>
          <div style="display: flex;
              flex-direction: column;
              gap: 10px;">
              <p id="limitBreakRequirement">-</p>
              <p>Qty tersedia:</p>
              <p>Refining Hammer / Hammer+: <span id="limitBreakHammerQty">0</span></p>
              <p>Jewel / Jewel+: <span id="limitBreakJewelQty">0</span></p>
              <p id="limitBreakMessage"></p>
          </div>
        </div>
        <br>
        <div class="popup-actions">
            <button class="popup-save" id="confirmLimitBreakBtn">Konfirmasi</button>
            <button class="popup-cancel" onclick="closeLimitBreak()">Batal</button>
        </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script type="module">
    import { supabase } from "/js/supabaseClient.js";
    import { requireLogin } from "/js/authGuard.js";

    const overlay = document.getElementById("loading-overlay");
    const bar = document.getElementById("loading-bar");

    let progress = 0;

    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }

    window.goBack = goBack;
    window.goHome = goHome;
    window.levelUp = levelUp;
    window.openLimitBreak = openLimitBreak;
    window.switchTab = switchTab;
    window.closePopup = closePopup;
    window.closeLimitBreak = closeLimitBreak;

    function setProgress(value) {
      progress = value;
      bar.style.width = progress + "%";
    }

    function hideLoading() {
      overlay.classList.add("fade-out");
      setTimeout(() => {
        overlay.style.display = "none";
      }, 500);
    }

    function waitForImages() {
      const images = document.querySelectorAll("img");
      let loaded = 0;
      const total = images.length;

      if (total === 0) return Promise.resolve();

      return new Promise((resolve) => {
          images.forEach((img) => {
          if (img.complete) {
              loaded++;
              update();
          } else {
              img.onload = () => {
              loaded++;
              update();
              };
              img.onerror = () => {
              loaded++;
              update();
              };
          }
          });

          function update() {
          const percent = (loaded / total) * 50; // max 50%
          setProgress(50 + percent);

          if (loaded === total) resolve();
          }
      });
  }

    const inventoryData = {
      all: [
          { icon: "⚔", name: "Item A" },
          { icon: "🛡", name: "Item B" },
          { icon: "🧪", name: "Item C" },
          { icon: "⚔", name: "Item D" },
          { icon: "🧪", name: "Item E" },
          { icon: "🛡", name: "Item F" },
          { icon: "⚔", name: "Item G" },
          { icon: "🧪", name: "Item H" },
          { icon: "🛡", name: "Item I" },
          { icon: "⚔", name: "Item J" },
          { icon: "🧪", name: "Item K" },
          { icon: "🛡", name: "Item L" },
          { icon: "⚔", name: "Item M" },
          { icon: "🧪", name: "Item N" }
      ],
      weapon: [
          { icon: "⚔", name: "Weapon A" },
          { icon: "⚔", name: "Weapon B" },
          { icon: "⚔", name: "Weapon C" },
          { icon: "⚔", name: "Weapon D" },
          { icon: "⚔", name: "Weapon E" }
      ],
      armor: [
          { icon: "🛡", name: "Armor A" },
          { icon: "🛡", name: "Armor B" },
          { icon: "🛡", name: "Armor C" },
          { icon: "🛡", name: "Armor D" },
          { icon: "🛡", name: "Armor E" }
      ],
      potion: [
        { icon: "🧪", name: "Potion A" },
        { icon: "🧪", name: "Potion B" },
        { icon: "🧪", name: "Potion C" },
        { icon: "🧪", name: "Potion D" },
        { icon: "🧪", name: "Potion E" },
        { icon: "🧪", name: "Potion F" }
      ]
    };

    let selectedItem = null;
    let items = [];
    let equipments = [];
    let playerItems = [];
    let limitBreakItem = null;

    async function loadData(session){
      try {

        setProgress(10);

        const response = await fetch(
            `/api/player_data`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${session.access_token}`,
                },
                body: JSON.stringify({
                    action: "getColGems",
                })
            }
        );

        const colGem = await response.json();

        if (!response.ok) throw new Error(colGem.error);

        document.getElementById("col-player").innerHTML = colGem.data.col;
        document.getElementById("gems-player").innerHTML = colGem.data.arcana_gems;
        
        const resEq = await fetch(
            `/api/player_data`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${session.access_token}`,
                },
                body: JSON.stringify({
                    action: "getDataPlayer",
                    table: "player_equipments"
                })
            }
        );

        const equipmentResult = await resEq.json();
        equipments = equipmentResult.data;
        if (!resEq.ok) throw new Error(equipmentResult.error);

        const resItems = await fetch(
            `/api/player_data`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${session.access_token}`,
                },
                body: JSON.stringify({
                    action: "getDataPlayer",
                    table: "player_items"
                })
            }
        );

        const itemResult = await resItems.json();
        if (!resItems.ok) throw new Error(itemResult.error);

        playerItems = itemResult.data.filter(row => {
            const name = row.catalog?.name || "";
            return [
                "Glare Rigid Stone",
                "Glare Dragon Stone",
                "Refining Hammer",
                "Refining Hammer+",
                "Jewel",
                "Jewel+"
            ].includes(name);
        });

        setProgress(20);

        await renderGrid()

        setProgress(50);

        await waitForImages();

        // selesai semua
        setProgress(100);

        setTimeout(hideLoading, 300);

      } catch (err) {
        console.error("Load error:", err);
        hideLoading();
      }
    }

    async function renderGrid(category = "all", searchTerm = "") {
      const gridBox = document.getElementById("gridBox");

      gridBox.innerHTML = "";

      let data = [];

      switch (category) {
          case "all":
            data = [...equipments];
            break;

          case "weapon":
            data = equipments.filter(
              eq => eq.catalog.position === "right-weapon" || eq.catalog.position === "left-weapon" 
            );
            break;

          case "armor":
            data = equipments.filter(
              eq => eq.catalog.position === "upper" || eq.catalog.position === "lower" 
            );
            break;

          default:
            data = [];
      }

      // apply additional filters from selects
      const typeSel = document.getElementById('typeFilter');
      const positionSel = document.getElementById('positionFilter');
      const starSel = document.getElementById('starFilter');

      const selType = typeSel ? typeSel.value : '';
      const selPosition = positionSel ? positionSel.value : '';
      const selStar = starSel ? starSel.value : '';

      if (selType) {
        data = data.filter(it => (it.catalog && it.catalog.type) ? String(it.catalog.type) === selType : false);
      }

      if (selPosition) {
        data = data.filter(it => (it.catalog && it.catalog.position) ? String(it.catalog.position) === selPosition : false);
      }

      if (selStar) {
        data = data.filter(it => String(it.star) === selStar);
      }

      // apply search filter if provided
      const term = (searchTerm || "").trim().toLowerCase();
      if (term) {
        data = data.filter(it => {
          const name = (it.catalog && it.catalog.name) ? it.catalog.name : (it.name || "");
          return name.toLowerCase().includes(term);
        });
      }

      data.forEach(item => {
          const slot = document.createElement("div");
          slot.classList.add("slot");

          slot.innerHTML = `
              <img src="${item.catalog.link_photo || '/img/eq-1.png'}">
              <span class="selected-label">Selected</span>
          `;

          slot.onclick = () => selectSlot(slot, item);

          gridBox.appendChild(slot);
      });
    }

    function selectSlot(clickedSlot, item) {
        document.querySelectorAll(".slot").forEach(slot => {
            slot.classList.remove("selected");
        });

        clickedSlot.classList.add("selected");

        // simpan item yang dipilih
        selectedItem = item;
    }

    function switchTab(event) {
      const clicked = event.currentTarget;
      const category = clicked.getAttribute("data-category");

      document.querySelectorAll(".category-tabs button").forEach(btn => {
        btn.classList.remove("active");
      });

      clicked.classList.add("active");
      const searchInput = document.getElementById("searchInput");
      renderGrid(category, searchInput ? searchInput.value : "");
    }

    // debounce helper
    function debounce(fn, wait) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    function populateFilterOptions() {
      const typeFilter = document.getElementById('typeFilter');
      const positionFilter = document.getElementById('positionFilter');

      if (!equipments || equipments.length === 0) return;

      const types = Array.from(new Set(equipments.map(e => e.catalog && e.catalog.type).filter(Boolean))).sort();
      const positions = Array.from(new Set(equipments.map(e => e.catalog && e.catalog.position).filter(Boolean))).sort();

      if (typeFilter) {
        // keep the default option then append
        types.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          typeFilter.appendChild(opt);
        });
      }

      if (positionFilter) {
        positions.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          positionFilter.appendChild(opt);
        });
      }
    }

    const EQUIPMENT_MAX_LEVEL_BY_STAR = {
      1: 30,
      2: 60,
      3: 100,
    };

    const LIMIT_BREAK_REQUIREMENTS = {
      1: {
        toStar: 2,
        requiredLevel: 30,
        hammer: "Refining Hammer",
        hammerQty: 40,
        jewel: "Jewel",
        jewelQty: 10,
      },
      2: {
        toStar: 3,
        requiredLevel: 60,
        hammer: "Refining Hammer+",
        hammerQty: 80,
        jewel: "Jewel+",
        jewelQty: 50,
      },
    };

    function getMaxEquipmentLevel(item) {
      const star = Number(item?.star || 1);
      return EQUIPMENT_MAX_LEVEL_BY_STAR[star] || EQUIPMENT_MAX_LEVEL_BY_STAR[1];
    }

    const LEVEL_UP_COST = {
      "Glare Rigid Stone": 10,
      "Glare Dragon Stone": 5,
    };

    function getLevelUpCost(itemName) {
      return LEVEL_UP_COST[itemName] || 0;
    }

    function getItemQty(itemName) {
      return playerItems.find(item => item.catalog?.name === itemName)?.quantity || 0;
    }

    function updateLevelUpSummary() {
      const select = document.getElementById("levelupItemSelect");
      const qtyDisplay = document.getElementById("levelupItemQty");
      const neededDisplay = document.getElementById("levelupItemNeeded");
      const amountInput = document.getElementById("levelupAmount");
      const resultDisplay = document.getElementById("levelupResult");
      const message = document.getElementById("levelupMessage");
      const confirmButton = document.getElementById("confirmLevelupBtn");

      if (!selectedItem) {
        return;
      }

      const selectedConsumable = playerItems.find(item => String(item.id) === select.value);
      const amount = Math.max(1, parseInt(amountInput.value, 10) || 1);
      const maxLevel = getMaxEquipmentLevel(selectedItem);
      const maxCanLevelUp = Math.max(0, maxLevel - (selectedItem.level || 0));
      const safeAmount = Math.min(amount, maxCanLevelUp || 1);
      const cost = selectedConsumable ? getLevelUpCost(selectedConsumable.catalog?.name) : 0;
      const requiredQty = cost * safeAmount;

      amountInput.value = safeAmount;
      qtyDisplay.textContent = selectedConsumable?.quantity ?? 0;
      neededDisplay.textContent = requiredQty;
      resultDisplay.textContent = (selectedItem.level || 0) + safeAmount;
      message.textContent = "";

      if (!selectedConsumable) {
        confirmButton.disabled = true;
        message.textContent = "Tidak ada item level up yang tersedia.";
        return;
      }

      if (maxCanLevelUp <= 0) {
        confirmButton.disabled = true;
        message.textContent = `Item sudah mencapai batas level untuk bintang ${selectedItem.star || 1}.`;
        return;
      }

      confirmButton.disabled = (selectedConsumable.quantity || 0) < requiredQty;
      if ((selectedConsumable.quantity || 0) < requiredQty) {
        message.textContent = `Item tidak cukup. Butuh ${requiredQty} ${selectedConsumable.catalog?.name} untuk naik ${safeAmount} level.`;
      }
    }

    function levelUp() {
      if (!selectedItem) {
          alert("Pilih item dulu!");
          return;
      }

      document.getElementById("popupImage").src =
          selectedItem.catalog.link_photo;

      document.getElementById("popupName").textContent =
          selectedItem.catalog.name;

      document.getElementById("popupLevel").textContent =
          selectedItem.level;

      document.getElementById("popupPosition").textContent =
          selectedItem.catalog.position;

      const select = document.getElementById("levelupItemSelect");
      const amountInput = document.getElementById("levelupAmount");
      const message = document.getElementById("levelupMessage");
      const confirmButton = document.getElementById("confirmLevelupBtn");

      select.innerHTML = playerItems.map(item => {
        const quantity = item.quantity ?? 0;
        return `<option value="${item.id}">${item.catalog.name} (${quantity})</option>`;
      }).join("");

      if (!playerItems.length) {
        select.innerHTML = `<option value="">Tidak ada item</option>`;
      }

      amountInput.value = 1;
      message.textContent = "";
      document.getElementById("levelupResult").textContent = selectedItem.level || 0;
      updateLevelUpSummary();
      document.getElementById("popup").classList.remove("hidden");

      if (getMaxEquipmentLevel(selectedItem) <= (selectedItem.level || 0)) {
        confirmButton.disabled = true;
        message.textContent = `Item sudah mencapai batas level untuk bintang ${selectedItem.star || 1}.`;
      } else {
        confirmButton.disabled = false;
      }
    }

    function closePopup() {
      document.getElementById("popup").classList.add("hidden");
    }

    function openLimitBreak() {
      if (!selectedItem) {
        alert("Pilih item dulu!");
        return;
      }

      limitBreakItem = selectedItem;
      const currentStar = Number(selectedItem.star || 1);
      const req = LIMIT_BREAK_REQUIREMENTS[currentStar];
      const message = document.getElementById("limitBreakMessage");
      const confirmButton = document.getElementById("confirmLimitBreakBtn");

      document.getElementById("limitBreakImage").src = selectedItem.catalog.link_photo;
      document.getElementById("limitBreakName").textContent = selectedItem.catalog.name;
      document.getElementById("limitBreakCurrentStar").textContent = currentStar;
      document.getElementById("limitBreakCurrentLevel").textContent = selectedItem.level || 0;

      if (!req) {
        document.getElementById("limitBreakRequirement").textContent = "Tidak ada limit break yang tersedia untuk star ini.";
        message.textContent = "";
        confirmButton.disabled = true;
      } else {
        document.getElementById("limitBreakRequirement").textContent =
          `Naik ke bintang ${req.toStar} butuh level ${req.requiredLevel} dan ${req.hammerQty} ${req.hammer} + ${req.jewelQty} ${req.jewel}`;
        document.getElementById("limitBreakHammerQty").textContent = getItemQty(req.hammer);
        document.getElementById("limitBreakJewelQty").textContent = getItemQty(req.jewel);
        message.textContent = "";
        confirmButton.disabled = false;
      }

      updateLimitBreakState();
      document.getElementById("limitBreakPopup").classList.remove("hidden");
    }

    function updateLimitBreakState() {
      const currentStar = Number(limitBreakItem?.star || 1);
      const currentLevel = Number(limitBreakItem?.level || 0);
      const req = LIMIT_BREAK_REQUIREMENTS[currentStar];
      const message = document.getElementById("limitBreakMessage");
      const confirmButton = document.getElementById("confirmLimitBreakBtn");

      if (!req) {
        confirmButton.disabled = true;
        return;
      }

      const hasLevel = currentLevel >= req.requiredLevel;
      const hasHammer = getItemQty(req.hammer) >= req.hammerQty;
      const hasJewel = getItemQty(req.jewel) >= req.jewelQty;

      if (!hasLevel) {
        message.textContent = `Butuh level ${req.requiredLevel} untuk limit break ke bintang ${req.toStar}.`;
      } else if (!hasHammer || !hasJewel) {
        message.textContent = `Item tidak cukup untuk limit break ke bintang ${req.toStar}.`;
      } else {
        message.textContent = "";
      }

      confirmButton.disabled = !(hasLevel && hasHammer && hasJewel);
    }

    function closeLimitBreak() {
      document.getElementById("limitBreakPopup").classList.add("hidden");
      limitBreakItem = null;
    }

    function confirmLimitBreak() {
      if (!limitBreakItem) {
        return;
      }

      const currentStar = Number(limitBreakItem.star || 1);
      const req = LIMIT_BREAK_REQUIREMENTS[currentStar];
      const message = document.getElementById("limitBreakMessage");

      if (!req) {
        message.textContent = "Tidak ada limit break yang tersedia untuk star ini.";
        return;
      }

      if ((limitBreakItem.level || 0) < req.requiredLevel) {
        message.textContent = `Butuh level ${req.requiredLevel} untuk limit break ke bintang ${req.toStar}.`;
        return;
      }

      const hammerQty = getItemQty(req.hammer);
      const jewelQty = getItemQty(req.jewel);

      if (hammerQty < req.hammerQty || jewelQty < req.jewelQty) {
        message.textContent = `Item tidak cukup untuk limit break ke bintang ${req.toStar}.`;
        return;
      }

      const hammerItem = playerItems.find(item => item.catalog?.name === req.hammer);
      const jewelItem = playerItems.find(item => item.catalog?.name === req.jewel);

      if (hammerItem) hammerItem.quantity -= req.hammerQty;
      if (jewelItem) jewelItem.quantity -= req.jewelQty;

      limitBreakItem.star = req.toStar;
      limitBreakItem.level = req.requiredLevel;

      document.getElementById("limitBreakPopup").classList.add("hidden");
      limitBreakItem = null;
      renderGrid();
    }

    function confirmLevelUp() {
      const select = document.getElementById("levelupItemSelect");
      const amountInput = document.getElementById("levelupAmount");
      const message = document.getElementById("levelupMessage");

      if (!selectedItem) {
        message.textContent = "Pilih item dulu.";
        return;
      }

      const selectedConsumable = playerItems.find(item => String(item.id) === select.value);
      const amount = Math.max(1, parseInt(amountInput.value, 10) || 1);
      const maxLevel = getMaxEquipmentLevel(selectedItem);
      const maxCanLevelUp = Math.max(0, maxLevel - (selectedItem.level || 0));
      const safeAmount = Math.min(amount, maxCanLevelUp || 1);
      const cost = selectedConsumable ? getLevelUpCost(selectedConsumable.catalog?.name) : 0;
      const requiredQty = cost * safeAmount;

      if (!selectedConsumable) {
        message.textContent = "Pilih item yang tersedia terlebih dahulu.";
        return;
      }

      if (maxCanLevelUp <= 0) {
        message.textContent = `Item sudah mencapai batas level untuk bintang ${selectedItem.star || 1}.`;
        return;
      }

      if ((selectedConsumable.quantity || 0) < requiredQty) {
        message.textContent = `Item tidak cukup. Butuh ${requiredQty} ${selectedConsumable.catalog?.name} untuk naik ${safeAmount} level.`;
        return;
      }

      selectedConsumable.quantity -= requiredQty;
      selectedItem.level += safeAmount;
      document.getElementById("popupLevel").textContent = selectedItem.level;
      document.getElementById("levelupResult").textContent = selectedItem.level;
      renderGrid();
      updateLevelUpSummary();
      message.textContent = "Level berhasil ditingkatkan.";
    }

    async function init() {
      try {
          const session = await requireLogin();
          if (!session) return; // ✅ sekarang valid

          await loadData(session);
          //renderGrid("all");
          setTimeout(hideLoading, 500);

          // wire up search input after initial render
          const searchInput = document.getElementById("searchInput");
          if (searchInput) {
            const handleSearch = debounce(() => {
              // find active category
              const activeBtn = document.querySelector('.category-tabs button.active');
              const category = activeBtn ? activeBtn.getAttribute('data-category') : 'all';
              renderGrid(category, searchInput.value);
            }, 200);

            searchInput.addEventListener('input', handleSearch);
          }

          document.getElementById('levelupItemSelect')?.addEventListener('change', updateLevelUpSummary);
          document.getElementById('levelupAmount')?.addEventListener('input', updateLevelUpSummary);
          document.getElementById('confirmLevelupBtn')?.addEventListener('click', confirmLevelUp);

          // populate filter selects and wire changes
          populateFilterOptions();
          const typeFilter = document.getElementById('typeFilter');
          const positionFilter = document.getElementById('positionFilter');
          const starFilter = document.getElementById('starFilter');

          const handleFilterChange = debounce(() => {
            const activeBtn = document.querySelector('.category-tabs button.active');
            const category = activeBtn ? activeBtn.getAttribute('data-category') : 'all';
            renderGrid(category, searchInput ? searchInput.value : '');
          }, 150);

          if (typeFilter) typeFilter.addEventListener('change', handleFilterChange);
          if (positionFilter) positionFilter.addEventListener('change', handleFilterChange);
          if (starFilter) starFilter.addEventListener('change', handleFilterChange);

      } catch (err) {
          console.error("Loading error:", err);
      }
    }

    init();
  </script>
</body>
</html>
