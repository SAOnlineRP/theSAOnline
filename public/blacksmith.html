<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/blacksmith.css">
</head>
<body>
  <div class="screen">
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
    <div class="topbar">
      <div class="topbar-left">
        <button onclick="goBack()"><img src="/img/back2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
        <button onclick="goHome()"><img src="/img/home2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
      </div>

      <div class="topbar-right">
        <div class="currency-box">🪙 10000</div>
        <div class="currency-box">💎 50</div>
      </div>
    </div>

    <!-- Main Inventory -->
    <div class="inventory-area">
        <div class="category-tabs">
            <button class="tab active" data-category="all" onclick="switchTab(event)">ALL</button>
            <button class="tab-icon" data-category="weapon" onclick="switchTab(event)">⚔</button>
            <button class="tab-icon" data-category="armor" onclick="switchTab(event)">🛡</button>
            <button class="tab-icon" data-category="potion" onclick="switchTab(event)">🧪</button>
        </div>

        <div class="inventory-panel">
            <div class="grid-box" id="gridBox"></div>

            <div class="bottom-buttons">
              <button class="action-btn" onclick="levelUp()">Level Up</button>
              <button class="action-btn">Limit Break</button>
            </div>
        </div>
        </div>

  </div>
  <div id="popup" class="popup hidden">
    <div class="popup-content">
        <h2>Level Up</h2>
        <p id="popupText"></p>
        <button onclick="closePopup()">Close</button>
    </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script>
  function goBack() {
    window.history.back();
  }

  function goHome() {
    window.location.href = "menu.html";
  }

  const inventoryData = {
    all: [
        { icon: "⚔", name: "Item A" },
        { icon: "🛡", name: "Item B" },
        { icon: "🧪", name: "Item C" },
        { icon: "⚔", name: "Item D" },
        { icon: "🧪", name: "Item E" },
        { icon: "🛡", name: "Item F" },
        { icon: "⚔", name: "Item G" },
        { icon: "🧪", name: "Item H" },
        { icon: "🛡", name: "Item I" },
        { icon: "⚔", name: "Item J" },
        { icon: "🧪", name: "Item K" },
        { icon: "🛡", name: "Item L" },
        { icon: "⚔", name: "Item M" },
        { icon: "🧪", name: "Item N" }
    ],
    weapon: [
        { icon: "⚔", name: "Weapon A" },
        { icon: "⚔", name: "Weapon B" },
        { icon: "⚔", name: "Weapon C" },
        { icon: "⚔", name: "Weapon D" },
        { icon: "⚔", name: "Weapon E" }
    ],
    armor: [
        { icon: "🛡", name: "Armor A" },
        { icon: "🛡", name: "Armor B" },
        { icon: "🛡", name: "Armor C" },
        { icon: "🛡", name: "Armor D" },
        { icon: "🛡", name: "Armor E" }
    ],
    potion: [
      { icon: "🧪", name: "Potion A" },
      { icon: "🧪", name: "Potion B" },
      { icon: "🧪", name: "Potion C" },
      { icon: "🧪", name: "Potion D" },
      { icon: "🧪", name: "Potion E" },
      { icon: "🧪", name: "Potion F" }
    ]
  };

    let selectedItem = null;
    function renderGrid(category) {
        const gridBox = document.getElementById("gridBox");
        const items = inventoryData[category];
        gridBox.innerHTML = "";

        items.forEach(item => {
            const slot = document.createElement("div");
            slot.classList.add("slot");

            slot.innerHTML = `
            <span>${item.icon}</span>
            <span class="selected-label">Selected</span>
            `;

            slot.onclick = () => selectSlot(slot, item);

            gridBox.appendChild(slot);
        });
    }

    function selectSlot(clickedSlot, item) {
        document.querySelectorAll(".slot").forEach(slot => {
            slot.classList.remove("selected");
        });

        clickedSlot.classList.add("selected");

        // simpan item yang dipilih
        selectedItem = item;
    }

  function switchTab(event) {
    const clicked = event.currentTarget;
    const category = clicked.getAttribute("data-category");

    document.querySelectorAll(".category-tabs button").forEach(btn => {
      btn.classList.remove("active");
    });

    clicked.classList.add("active");
    renderGrid(category);
  }

  renderGrid("all");

  function levelUp() {
  if (!selectedItem) {
    alert("Pilih item dulu!");
    return;
  }

  const popup = document.getElementById("popup");
  const text = document.getElementById("popupText");

  text.textContent = `Leveling up ${selectedItem.name}`;
  popup.classList.remove("hidden");
}

function closePopup() {
  document.getElementById("popup").classList.add("hidden");
}
</script>
</body>
</html>
