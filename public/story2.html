<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story - theSAOnline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #003973;
            --bg-mid: #11375d;
            --bg-bottom: #020813;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif !important;
        }

        body {
            min-height: 100vh;
            background-size: cover;
            background: radial-gradient(circle at top, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
        }

        .container {
            height: 100vh;              /* patok ke tinggi layar */
            width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
            max-width: 100%;
            margin: 0 auto;

            position: relative;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(600px, 60vw);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 0 20px rgba(0, 221, 255, 0.5)) blur(0.5px);
            z-index: -1;
        }

        /* top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 40px;
        }

        .topbar-left {
            display: flex;
            gap: 18px;
            color: #000;
            align-items: center;
        }

        .topbar-left button {
            border: none;
            background: none;
            font-size: 40px;
            cursor: pointer;
        }

        .topbar-right {
            display: flex;
            gap: 14px;
        }

        .currency-box {
            min-width: 100px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 40px;
            color: white;
            padding: 0 12px;
        }

        .content {
            min-height: 75%;
            background: #215b7a;
            border-radius: 10px;
            box-shadow:
            inset 0 0 18px rgba(255,255,255,0.04),
            0 10px 28px rgba(0,0,0,0.35);

            overflow-x: auto; /* penting */
            overflow-y: hidden;
            padding: 15px;
            display: flex;
            flex-direction: column;

            justify-content: center; /* ini bikin center atas-bawah */

            

            scroll-behavior: smooth;
        }

        .title {
            background: #bbb;
            color: black;
            padding: 5px 10px;
            margin-bottom: 20px;
            width: 200px;

            position: sticky;
            left: 0;

            z-index: 10;
            background: #bbb;
        }

        /* cards jadi scroll horizontal */
        .cards {
            display: flex;
            gap: 20px; /* kasih jarak antar card */
            width: max-content; /* biar bisa melebar */

            scroll-snap-type: x mandatory;
        }

        /* card jangan pakai % lagi */
        .card {
            min-width: 300px; /* atau 180px / 220px bebas */
            flex-shrink: 0;   /* biar ga ngecil */
            scroll-snap-align: center;
        }

        .card-title {
            margin-bottom: 5px;
            color: white;
        }

        .box {
            min-height: 120px;
            min-width: 300px;
            background: #ccc;
            border-radius: 10px;
            position: relative;
        }

        .content::-webkit-scrollbar {
            height: 8px;
        }

        .content::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .button-event{
            position: absolute;
            bottom: 0;
            right: 0;
            margin: 10px;
            padding: 5px;
            border-radius: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.95);

            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .modal-image {
            display: block;
            object-fit: contain;
            height: 675px;
            width: 1200px;
        }

        .overlay-image-right {
            position: absolute;
            top: 50px;
            right: 40px;

            height: 100%;
            width: auto;

            z-index: 10;
        }

        .overlay-image-left {
            position: absolute;
            transform: scaleX(-1);
            top: 50px;
            left: 40px;

            height: 100%;
            width: auto;

            z-index: 10;
        }

        .dialog-box {
            position: absolute;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);

            width: 80%;
            max-width: 900px;

            padding: 30px 24px 20px;

            background: rgba(10, 15, 30, 0.92);
            border: 2px solid #4fc3f7;
            border-radius: 14px;

            color: white;
            font-family: "Orbitron", sans-serif;

            box-shadow:
                0 0 20px rgba(79,195,247,0.4),
                inset 0 0 10px rgba(255,255,255,0.05);

            z-index: 15;
        }

        .speaker-name {
            position: absolute;
            top: -18px;
            left: 20px;

            padding: 6px 18px;

            background: #4fc3f7;
            color: #08111f;

            font-weight: 700;
            font-size: 14px;

            border-radius: 8px;

            box-shadow: 0 0 10px rgba(79,195,247,0.5);
        }

        #dialogText {
            font-size: 18px;
            line-height: 1.6;
        }

        .next-btn {
            position: absolute;
            bottom: 80px;
            right: 80px;

            z-index: 20;

            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background: #2196f3;
            color: white;
            font-weight: bold;
            font-size: 18px;
            
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            z-index: 99;
        }

        .narration-box {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 70%;
            max-width: 800px;

            padding: 25px;

            background: rgba(0,0,0,0.75);

            border-radius: 12px;

            color: white;

            text-align: center;

            font-size: 24px;
            line-height: 1.8;

            font-family: "Orbitron", sans-serif;

            z-index: 20;

            backdrop-filter: blur(4px);
        }

        #storyVideo {
            display: block;

            width: 1200px;
            height: 675px;

            object-fit: cover;

            background: black;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .image-wrapper {
                transform: rotate(90deg);
            }
            .modal-image{
                height: 394px;
                width: 700px;
            }
            .next-btn {
                bottom:60px;
            }
            #storyVideo {
                width: 700px;
                height: 394px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
        <div class="topbar">
            <div class="topbar-left">
                <button onclick="goBack()"><img src="/img/back2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
                <button onclick="goHome()"><img src="/img/home2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
            </div>

            <div class="topbar-right">
                <div class="currency-box">🪙 10000</div>
                <div class="currency-box">💎 50</div>
            </div>
        </div>
        <div class="content">
            <div class="title">The Beginning</div>

            <div class="cards">
                <div class="card">
                    <p class="card-title">Story 1-1</p>
                    <div class="box">
                        <button class="button-event" onclick="openImage()">Masuk Story</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Battle 1-1</p>
                    <div class="box">
                        <button class="button-event" onclick="goToParty()">Masuk Battle</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Story 1-2</p>
                    <div class="box">
                        <button class="button-event" onclick="goToStory()">Masuk Story</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Battle 1-2</p>
                    <div class="box">
                        <button class="button-event" onclick="goToParty()">Masuk Battle</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Story 1-3</p>
                    <div class="box">
                        <button class="button-event" onclick="goToStory()">Masuk Story</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeImage()">✕</span>
  

        <div class="image-wrapper">
            <video
                id="storyVideo"
                autoplay>
            </video>
            
            <img
                id="backgroundImage"
                src="img/bg-bg.jpg"
                alt="Background"
                class="modal-image"
            />

            <img
                src="img/character_kirito.png"
                alt="Character"
                id="characterImageLeft"
                class="overlay-image-left"
            >

            <img
                src="img/character_kiel.png"
                alt="Character"
                id="characterImageRight"
                class="overlay-image-right"
            >
            <div id="narrationBox" class="narration-box">
                Tahun 2022.
                Sword Art Online akhirnya resmi dibuka.
            </div>

            <div id="dialogBox" class="dialog-box">

                <div id="speakerName" class="speaker-name">
                    Kirito
                </div>

                <div id="dialogText">
                    Selamat datang di Aincrad!
                </div>

            </div>

            <button id="nextBtn" class="next-btn" onclick="nextStory()">
                NEXT
            </button>
        </div>
    </div>
    <script>
        function goBack() {
        window.history.back();
        }

        function goHome() {
        window.location.href = "menu.html";
        }

        function goToStory() {
        window.location.href = "quest-story.html";
        }

        function goToParty() {
        window.location.href = "party.html";
        }
        const storyData = [

            {
                type: "video",
                background_url: "https://res.cloudinary.com/djeiswvsw/video/upload/link_start_q2wgon.mp4"
            },

            {
                type: "narration",
                background_url: "img/bg-bg.jpg",
                text: "Tahun 2022."
            },

            {
                type: "narration",
                text: "Sword Art Online akhirnya resmi dibuka."
            },

            {
                type: "dialog",
                character_left_url: "img/character_kirito.png",
                speaker: "Kirito",
                text: "Selamat datang di Aincrad!"
            },

            {
                type: "dialog",
                character_left_url: "img/character_kirito.png",
                speaker: "Kirito",
                text: "Ini adalah dunia baru."
            },

            {
                type: "dialog",
                character_right_url: "img/character_kiel.png",
                audio_url: "https://hodpkhycowhjlzyrnhwk.supabase.co/storage/v1/object/public/audio/sword.mp3",
                speaker: "Kiel",
                text: "Aku siap bertarung."
            },

            {
                type: "dialog",
                character_right_url: "img/character_kiel.png",
                hide_left: true,
                speaker: "Kiel",
                text: "Kirito sudah pergi."
            },

            {
                type: "system",
                text: "All players will be transported shortly."
            }
        ];
        let currentIndex = 0;

        const backgroundImage =
            document.getElementById("backgroundImage");

        const characterImageLeft =
            document.getElementById("characterImageLeft");

        const characterImageRight =
            document.getElementById("characterImageRight");

        const dialogBox =
            document.getElementById("dialogBox");

        const narrationBox =
            document.getElementById("narrationBox");

        const speakerName =
            document.getElementById("speakerName");

        const dialogText =
            document.getElementById("dialogText");
        const nextBtn =
        document.getElementById("nextBtn");

        const storyVideo =
            document.getElementById("storyVideo");

        const storyAudio = new Audio();
        const bgmAudio = new Audio();

        bgmAudio.loop = true;

        storyVideo.addEventListener("ended", () => {
            setBgmVolume(1);

            nextBtn.style.display = "block";

        });

        function setBgmVolume(volume) {
            bgmAudio.volume = volume;
        }

        setBgmVolume(1);

        function renderEntry() {

            const entry = storyData[currentIndex];

            if (!entry) {
                closeImage();
                return;
            }

            // reset hanya UI sementara
            storyVideo.style.display = "none";
            storyVideo.pause();
            storyVideo.src = "";

            dialogBox.style.display = "none";
            narrationBox.style.display = "none";
            nextBtn.style.display = "block";

            storyAudio.pause();
            storyAudio.currentTime = 0;
            storyAudio.src = "";

            // =====================
            // VIDEO
            // =====================

            if (entry.type === "video") {
                
                setBgmVolume(0.3);

                backgroundImage.style.display = "none";
                characterImageLeft.style.display = "none";
                characterImageRight.style.display = "none";

                // sembunyikan tombol
                nextBtn.style.display = "none";

                storyVideo.style.display = "block";

                storyVideo.src = entry.background_url;

                storyVideo.load();

                storyVideo.play()
                    .catch(err => console.log(err));

                return;
            }

            // jika bukan video tampilkan background lagi
            backgroundImage.style.display = "block";

            // =====================
            // BACKGROUND
            // =====================

            if (entry.background_url) {
                backgroundImage.src = entry.background_url;
            }

            // =====================
            // CHARACTER LEFT
            // =====================

            if (entry.character_left_url) {

                characterImageLeft.style.display = "block";

                characterImageLeft.src =
                    entry.character_left_url;
            }

            if (entry.hide_left){
                characterImageLeft.style.display = "none";
            }

            // =====================
            // CHARACTER RIGHT
            // =====================

            if (entry.character_right_url) {

                characterImageRight.style.display = "block";

                characterImageRight.src =
                    entry.character_right_url;
            }

            if (entry.hide_right){
                characterImageRight.style.display = "none";
            }

            if (entry.audio_url) {
                console.log("play:", entry.audio_url);
                setBgmVolume(0.3);
                nextBtn.disabled = true;

                storyAudio.src = entry.audio_url;

                storyAudio.play()
                    .then(() => console.log("audio play"))
                    .catch(err => console.error(err));

                storyAudio.onended = () => {
                    setBgmVolume(1);
                    nextBtn.disabled = false;
                };
            }

            // =====================
            // NARRATION
            // =====================

            if (entry.type === "narration") {

                narrationBox.style.display = "block";

                narrationBox.textContent =
                    entry.text;

                return;
            }

            // =====================
            // DIALOG
            // =====================

            if (entry.type === "dialog") {

                dialogBox.style.display = "block";

                speakerName.textContent =
                    entry.speaker || "";

                dialogText.textContent =
                    entry.text || "";

                return;
            }

            // =====================
            // SYSTEM
            // =====================

            if (entry.type === "system") {

                dialogBox.style.display = "block";

                speakerName.textContent = "SYSTEM";

                dialogText.textContent =
                    entry.text || "";

                return;
            }
        }

        function nextStory() {

            currentIndex++;

            renderEntry();
        }

        function openImage() {

            currentIndex = 0;

            bgmAudio.src = "https://hodpkhycowhjlzyrnhwk.supabase.co/storage/v1/object/public/audio/The%20First%20Town.mp3";

            bgmAudio.play()
                .catch(err => console.log(err));

            document
                .getElementById("imageModal")
                .classList.add("show");

            renderEntry();
        }

        function closeImage() {

            storyVideo.pause();
            storyVideo.src = "";

            bgmAudio.pause();
            bgmAudio.currentTime = 0;

            document
                .getElementById("imageModal")
                .classList.remove("show");
        }
    </script>
</body>
</html>
