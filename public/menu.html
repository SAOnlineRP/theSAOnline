<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAO Futuristic Menu UI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/menu.css">
</head>

<body>
  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="loading-overlay">
      <div>Loading Assets...</div>
      <div class="loading-bar-container">
          <div id="loading-bar" class="loading-bar"></div>
      </div>
  </div>
  <main class="game-screen">
    <div class="top-bar">
        <div class="top-left">
            <div class="avatar-box hud-panel" onclick="goToProfile()">
                <img src="/img/kirito.png" alt="Kirito Avatar">
            </div>

            <div class="info-box hud-panel">
                <div class="name">KIRITO</div>
                <div class="lvl">Lvl. 100</div>
            </div>

            <div class="gold-box hud-panel">
                <div class="gold-row">🪙 <span>10000</span></div>
                <div class="gold-row">💎 <span>50</span></div>
            </div>
        </div>

        <div class="top-right">
            <button class="icon-btn hud-panel" onclick="goToFriends()">👥</button>
            <button class="icon-btn hud-panel">📋</button>
            <button class="icon-btn hud-panel">🎁</button>
        </div>
    </div>

    <div class="character" onclick="showText(this)">
      <img src="/img/character_sao.png" alt="Character">
    </div>

    <div class="character-text hud-panel" id="character_box">
      You stole this world and its people. You are a king of thieves, alone upon a stolen throne.
    </div>

    <nav class="menu-panel">
      <button class="quest-title hud-panel" onclick="goToQuest()">
        <span class="btn-content">QUEST</span>
      </button>

      <div class="menu-grid">
        <button class="menu-btn hud-panel" onclick="goToParty()">
          <span class="btn-content">PARTY</span>
        </button>

        <button class="menu-btn hud-panel" onclick="goToSummon()">
          <span class="btn-content">SUMMON</span>
        </button>
      </div>

      <div class="bottom-grid">
        <button class="menu-btn small hud-panel" onclick="goToMarketPlace()">
          <span class="btn-content">MARKET<br>PLACE</span>
        </button>

        <button class="menu-btn small hud-panel" onclick="goToBlackSmith()">
          <span class="btn-content">BLACK<br>SMITH</span>
        </button>

        <button class="menu-btn small hud-panel" onclick="goToStorage()">
          <span class="btn-content">STORAGE</span>
        </button>
      </div>
    </nav>

  </main>

  <script type="module">
    import { supabase } from "/js/supabaseClient.js";
    import { requireLogin } from "/js/authGuard.js";

    const overlay = document.getElementById("loading-overlay");
    const bar = document.getElementById("loading-bar");

    let progress = 0;

    function showText(el) {
      const textBox = document.getElementById("character_box");
      textBox.classList.toggle("show");
      el.classList.toggle("active");
    }

    function goToQuest() {
      window.location.href = "quest.html";
    }

    function goToParty() {
      window.location.href = "party.html";
    }

    function goToSummon() {
      window.location.href = "summon.html";
    }

    function goToFriends() {
      window.location.href = "friends.html";
    }

    function goToProfile() {
      window.location.href = "profile.html";
    }

    function goToStorage() {
      window.location.href = "storage.html";
    }

    function goToMarketPlace() {
      window.location.href = "marketplace.html";
    }

    function goToBlackSmith() {
      window.location.href = "blacksmith.html";
    }

    function setProgress(value) {
      progress = value;
      bar.style.width = progress + "%";
    }

    function hideLoading() {
      overlay.classList.add("fade-out");
      setTimeout(() => {
          overlay.style.display = "none";
      }, 500);
    }

    function waitForImages() {
      const images = document.querySelectorAll("img");
      let loaded = 0;
      const total = images.length;

      if (total === 0) return Promise.resolve();

      return new Promise((resolve) => {
          images.forEach((img) => {
          if (img.complete) {
              loaded++;
              update();
          } else {
              img.onload = () => {
              loaded++;
              update();
              };
              img.onerror = () => {
              loaded++;
              update();
              };
          }
          });

          function update() {
          const percent = (loaded / total) * 50; // max 50%
          setProgress(50 + percent);

          if (loaded === total) resolve();
          }
      });
    }

    window.goToQuest = goToQuest;
    window.goToParty = goToParty;
    window.goToSummon = goToSummon;
    window.goToFriends = goToFriends;
    window.goToProfile = goToProfile;
    window.goToStorage = goToStorage;
    window.goToMarketPlace = goToMarketPlace;
    window.goToBlackSmith = goToBlackSmith;
    window.showText = showText;

    async function init() {
      try {
        setProgress(10);

        const session = await requireLogin();
        if (!session) return; // ✅ sekarang valid

        setProgress(50);

        await waitForImages();

        setProgress(100);
        setTimeout(hideLoading, 500);

      } catch (err) {
        console.error("Loading error:", err);
      }
    }

    init();
  </script>
</body>
</html>
