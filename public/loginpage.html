<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic Login UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background:
        radial-gradient(circle at top, #11375d 0%, #07142d 45%, #020813 100%);
      overflow: hidden;
      color: #bffcff;
      position: relative;
    }

    /* Background hexagons */
    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(120deg, transparent 0 48%, rgba(255,255,255,0.04) 49%, transparent 50%) 0 0 / 120px 120px,
        linear-gradient(60deg, transparent 0 48%, rgba(255,255,255,0.03) 49%, transparent 50%) 0 0 / 120px 120px;
      opacity: 0.3;
    }

    .hex {
      position: absolute;
      width: 110px;
      height: 126px;
      background: rgba(118, 229, 255, 0.08);
      clip-path: polygon(
        25% 6%, 75% 6%,
        100% 50%,
        75% 94%, 25% 94%,
        0% 50%
      );
      filter: blur(0.3px);
    }

    .hex.small { width: 70px; height: 80px; }
    .hex.large { width: 150px; height: 172px; }

    .hex.h1 { top: 70px; left: 90px; }
    .hex.h2 { top: 170px; left: 210px; }
    .hex.h3 { top: 90px; right: 90px; }
    .hex.h4 { bottom: 130px; left: 40px; }
    .hex.h5 { bottom: 40px; right: 80px; }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px 140px;
      position: relative;
      z-index: 1;
    }

    .login-shell {
      position: relative;
      width: 430px;
      max-width: 100%;
    }

    .login-title {
      text-align: center;
      font-size: 2rem;
      color: #f1ef9e;
      margin-bottom: 18px;
      text-shadow: 0 0 8px rgba(241, 239, 158, 0.45);
    }

    .login-panel {
      position: relative;
      padding: 40px 28px 34px;
      background: rgba(10, 28, 53, 0.35);
      border: 2px solid #61efff;
      clip-path: polygon(
        8% 0%, 84% 0%, 92% 8%, 100% 8%,
        100% 100%, 12% 100%, 0% 84%, 0% 12%
      );
      box-shadow:
        0 0 10px rgba(97, 239, 255, 0.8),
        inset 0 0 18px rgba(97, 239, 255, 0.12);
      backdrop-filter: blur(4px);
    }

    .corner-accent {
      position: absolute;
      width: 70px;
      height: 70px;
      top: -8px;
      right: -8px;
      background: rgba(255, 145, 210, 0.2);
      border: 2px solid #f5a8d8;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      box-shadow: 0 0 10px rgba(245, 168, 216, 0.6);
    }

    .corner-accent::after {
      content: "✕";
      position: absolute;
      top: 16px;
      right: 16px;
      color: #ffd4f0;
      font-size: 1.5rem;
      text-shadow: 0 0 8px rgba(255, 212, 240, 0.7);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .icon-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid #66efff;
      box-shadow:
        0 0 10px rgba(102, 239, 255, 0.7),
        inset 0 0 10px rgba(102, 239, 255, 0.2);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      position: relative;
      background: rgba(14, 42, 68, 0.4);
      font-size: 1.4rem;
    }

    .sci-input {
      flex: 1;
      position: relative;
      height: 58px;
      border: 2px solid #8cf7ff;
      background: rgba(120, 200, 230, 0.08);
      box-shadow:
        0 0 8px rgba(140, 247, 255, 0.55),
        inset 0 0 8px rgba(140, 247, 255, 0.12);
      clip-path: polygon(
        4% 0%, 96% 0%, 100% 12%, 100% 88%,
        96% 100%, 4% 100%, 0% 88%, 0% 12%
      );
    }

    .sci-input input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #d8fbff;
      font-family: inherit;
      font-size: 1.15rem;
      padding: 0 18px;
    }

    .sci-input input::placeholder {
      color: rgba(220, 245, 255, 0.7);
    }

    .login-btn-wrap {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .login-btn {
      min-width: 170px;
      height: 62px;
      border: 2px solid #b8ffff;
      background: rgba(95, 225, 255, 0.08);
      color: #f2ef9c;
      font-family: inherit;
      font-size: 1.8rem;
      cursor: pointer;
      clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
      box-shadow:
        0 0 10px rgba(140, 247, 255, 0.7),
        inset 0 0 10px rgba(140, 247, 255, 0.08);
      text-shadow: 0 0 8px rgba(242, 239, 156, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 16px rgba(140, 247, 255, 0.95),
        inset 0 0 10px rgba(140, 247, 255, 0.12);
    }

    /* top icons */
    .top-icons {
      position: absolute;
      top: 22px;
      right: 22px;
      display: flex;
      gap: 18px;
    }

    .top-icon,
    .bottom-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid #67efff;
      box-shadow: 0 0 12px rgba(103, 239, 255, 0.7);
      display: grid;
      place-items: center;
      color: #3fdfff;
      background: rgba(10, 30, 55, 0.35);
      font-size: 1.8rem;
    }

    .bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px 16px 26px;
      background: linear-gradient(to top, rgba(75,180,255,0.15), rgba(75,180,255,0.03));
      border-top: 1px solid rgba(123, 240, 255, 0.3);
      display: flex;
      justify-content: center;
      gap: 28px;
      backdrop-filter: blur(6px);
    }

    @media (max-width: 600px) {
      .login-title {
        font-size: 1.6rem;
      }

      .login-panel {
        padding: 30px 18px 28px;
      }

      .field {
        gap: 12px;
      }

      .icon-ring {
        width: 52px;
        height: 52px;
        font-size: 1.1rem;
      }

      .sci-input {
        height: 52px;
      }

      .sci-input input {
        font-size: 1rem;
      }

      .login-btn {
        min-width: 150px;
        height: 56px;
        font-size: 1.5rem;
      }

      .top-icon,
      .bottom-icon {
        width: 56px;
        height: 56px;
        font-size: 1.4rem;
      }

      .bottom-bar {
        gap: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="hex h1"></div>
  <div class="hex small h2"></div>
  <div class="hex large h3"></div>
  <div class="hex large h4"></div>
  <div class="hex h5"></div>

  <div class="top-icons">
    <div class="top-icon">♪</div>
    <div class="top-icon">⚙</div>
  </div>

  <main class="page">
    <section class="login-shell">
      <h1 class="login-title">Login</h1>

      <div class="login-panel">
        <div class="corner-accent"></div>

        <div class="field">
          <div class="icon-ring">👤</div>
          <div class="sci-input">
            <input type="text" placeholder="Username">
          </div>
        </div>

        <div class="field">
          <div class="icon-ring">🔒</div>
          <div class="sci-input">
            <input type="password" placeholder="Password">
          </div>
        </div>

        <div class="login-btn-wrap">
          <button class="login-btn">Login</button>
        </div>
      </div>
    </section>
  </main>

  
</body>
</html>
