<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Setup UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      min-height: 100vh;
    }

    .game-ui {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

    /* top icons */
    .top-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
      font-size: 40px;
    }

    .top-bar button {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 40px;
      line-height: 1;
    }

    /* section titles */
    .content-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: center;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title {
      font-size: 28px;
      color: #111;
      margin-left: 6px;
      display: flex;
      justify-content: space-between;
    }

    /* main panels */
    .panel {
      background: #6b6b6b;
      padding: 10px;
      position: relative;
    }

    .edit-icon {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 14px;
      color: #000;
      cursor: pointer;
    }

    /* party members */
    .members-panel {
      width: 430px;
      display: flex;
      gap: 10px;
    }

    .member-card {
      width: 200px;
      height: 340px;
      background: #d9d9d9;
      border: 1px solid #999;
      overflow: hidden;
    }

    .member-name {
      background: #cfcfcf;
      text-align: center;
      font-size: 20px;
      padding: 2px 4px;
      border-bottom: 1px solid #999;
    }

    .member-image {
      height: 180px;
      background: #efefef;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .member-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .member-bottom {
      background: #f4f4f4;
      padding: 4px;
      border-top: 1px solid #999;
      font-size: 15px;
    }

    .member-role {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #444;
    }

    .member-weapon {
      height: 18px;
      background: #fff;
      border: 1px solid #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .member-weapon img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* partners */
    .partners-panel {
      width: 170px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .partner-card {
      background: #cfcfcf;
      border: 1px solid #9a9a9a;
      padding: 6px;
      position: relative;
    }

    .partner-image {
      width: 100%;
      height: 132px;
      background: #f2f2f2;
      overflow: hidden;
    }

    .partner-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .partner-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 12px;
    }

    .partner-badge {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: red;
    }

    .stars {
      color: gold;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* equipments */
    .equipments-panel {
      width: 190px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .equip-card {
      background: #bfe9f2;
      border: 2px solid #e9f9ff;
      height: 165px;
      width: 165px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .equip-card img {
      width: 75%;
      height: 75%;
      object-fit: contain;
    }

    .equip-type {
      position: absolute;
      bottom: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      border: 1px solid #aaa;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* bottom row */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .weapon-section {
      width: 180px;
    }

    .weapon-panel {
      width: 280px;
      background: #8f8f8f;
      padding: 8px;
      position: relative;
    }

    .weapon-box {
      height: 80px;
      width: 240px;
      background: #efefef;
      border: 1px solid #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .weapon-box img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .save-btn {
      width: 110px;
      height: 72px;
      border: none;
      background: #cfcfcf;
      font-size: 18px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px #bbb;
    }

    .save-btn:hover {
      background: #bfbfbf;
    }

    /* mobile */
    @media (max-width: 768px) {
      .game-ui {
        aspect-ratio: 9 / 16;
        min-height: 100vh;
        width: unset;
      }

      .content-row {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
      }

      /* Party Members tetap lebar besar */
      .content-row > .column:nth-child(1) {
        width: calc(100% - 140px);
      }

      .members-panel {
        width: 100%;
        gap: 8px;
      }

      .member-card {
        width: calc(50% - 4px);
        height: auto;
      }

      /* Partners di samping party */
      .content-row > .column:nth-child(2) {
        width: 128px;
      }

      .partners-panel {
        width: 100%;
      }

      .partner-image {
        height: 100px;
      }

      /* Equipments turun ke bawah full row */
      .content-row > .column:nth-child(3) {
        width: 100%;
      }

      .equipments-panel {
        width: 100%;
        flex-direction: row;
        gap: 10px;
      }

      .equip-card {
        width: calc(50% - 5px);
        height: 140px;
      }

      /* Weapon ada di bawah equipments */
      .bottom-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin-top: 12px;
      }

      .weapon-section {
        width: 100%;
      }

      .weapon-panel {
        width: 100%;
      }

      .weapon-box {
        width: 100%;
      }

      .save-btn {
        width: 100%;
        height: 56px;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="game-ui">
    <div class="top-bar">
      <button onclick="goBack()"><img src="/img/back.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
      <button onclick="goHome()"><img src="/img/home.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
    </div>

    <div class="content-row">
      <!-- Party Members -->
      <div class="column">
        <div class="title"><span>Party Members</span><span>✎</span></div>
        <div class="panel members-panel">

          <div class="member-card">
            <div class="member-name">Aleyna</div>
            <div class="member-image">
              <img src="https://via.placeholder.com/120x140" alt="Aleyna">
            </div>
            <div class="member-bottom">
              <div class="member-role">
                <span>Partners</span>
                <span>Lv.100</span>
              </div>
              <div class="member-weapon">
                <img src="https://via.placeholder.com/70x14" alt="weapon">
              </div>
            </div>
          </div>

          <div class="member-card">
            <div class="member-name">Arjuna</div>
            <div class="member-image">
              <img src="https://via.placeholder.com/120x140" alt="Arjuna">
            </div>
            <div class="member-bottom">
              <div class="member-role">
                <span>Skill Record</span>
                <span>Lv.100</span>
              </div>
              <div class="member-weapon">
                <img src="https://via.placeholder.com/70x14" alt="weapon">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Partners -->
      <div class="column">
        <div class="title"><span>Partners</span><span>✎</span></div>
        <div class="panel partners-panel">
          

          <div class="partner-card">
            <div class="partner-image">
              <img src="https://via.placeholder.com/150x70" alt="Partner 1">
            </div>
            <div class="partner-info">
              <div class="partner-badge"></div>
              <div class="stars">★★★★★</div>
            </div>
          </div>

          <div class="partner-card">
            <div class="partner-image">
              <img src="https://via.placeholder.com/150x70" alt="Partner 2">
            </div>
            <div class="partner-info">
              <div class="partner-badge"></div>
              <div class="stars">★★★★★</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Equipments -->
      <div class="column">
        <div class="title"><span>Equipments</span><span>✎</span></div>
        <div class="panel equipments-panel">

          <div class="equip-card">
            <img src="https://via.placeholder.com/90x70" alt="Armor Top">
            <div class="equip-type">👕</div>
          </div>

          <div class="equip-card">
            <img src="https://via.placeholder.com/90x70" alt="Armor Bottom">
            <div class="equip-type">👖</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="weapon-section">
        <div class="title">Weapon</div>
        <div class="weapon-panel">
          <div class="edit-icon">✎</div>
          <div class="weapon-box">
            <img src="https://via.placeholder.com/90x26" alt="Weapon">
          </div>
        </div>
      </div>

      <button class="save-btn">SAVE</button>
    </div>
  </div>
  <script>
    function goBack() {
      window.history.back();
    }
    function goHome() {
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
