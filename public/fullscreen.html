<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.95);

            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .modal-image {
            display: block;
            object-fit: contain;
            height: 675px;
            width: 1200px;
        }

        .overlay-image-right {
            position: absolute;
            top: 50px;
            right: 40px;

            height: 100%;
            width: auto;

            z-index: 10;
        }

        .overlay-image-left {
            position: absolute;
            transform: scaleX(-1);
            top: 50px;
            left: 40px;

            height: 100%;
            width: auto;

            z-index: 10;
        }

        .dialog-box {
            position: absolute;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);

            width: 80%;
            max-width: 900px;

            padding: 30px 24px 20px;

            background: rgba(10, 15, 30, 0.92);
            border: 2px solid #4fc3f7;
            border-radius: 14px;

            color: white;
            font-family: "Orbitron", sans-serif;

            box-shadow:
                0 0 20px rgba(79,195,247,0.4),
                inset 0 0 10px rgba(255,255,255,0.05);

            z-index: 15;
        }

        .speaker-name {
            position: absolute;
            top: -18px;
            left: 20px;

            padding: 6px 18px;

            background: #4fc3f7;
            color: #08111f;

            font-weight: 700;
            font-size: 14px;

            border-radius: 8px;

            box-shadow: 0 0 10px rgba(79,195,247,0.5);
        }

        #dialogText {
            font-size: 18px;
            line-height: 1.6;
        }

        .next-btn {
            position: absolute;
            bottom: 80px;
            right: 80px;

            z-index: 20;

            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background: #2196f3;
            color: white;
            font-weight: bold;
            font-size: 18px;
            
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            z-index: 99;
        }

        .narration-box {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 70%;
            max-width: 800px;

            padding: 25px;

            background: rgba(0,0,0,0.75);

            border-radius: 12px;

            color: white;

            text-align: center;

            font-size: 24px;
            line-height: 1.8;

            font-family: "Orbitron", sans-serif;

            z-index: 20;

            backdrop-filter: blur(4px);
        }

        #storyVideo {
            display: block;

            width: 1200px;
            height: 675px;

            object-fit: cover;

            background: black;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .image-wrapper {
                transform: rotate(90deg);
            }
            .modal-image{
                height: 394px;
                width: 700px;
            }
            .next-btn {
                bottom:60px;
            }
            #storyVideo {
                width: 700px;
                height: 394px;
            }
        }
    </style>
<body>
    <button onclick="openImage()">Lihat Gambar</button>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeImage()">✕</span>
  

        <div class="image-wrapper">
            <video
                id="storyVideo"
                autoplay>
            </video>
            
            <img
                id="backgroundImage"
                src="img/bg-bg.jpg"
                alt="Background"
                class="modal-image"
            />

            <img
                src="img/character_kirito.png"
                alt="Character"
                id="characterImageLeft"
                class="overlay-image-left"
            >

            <img
                src="img/character_kiel.png"
                alt="Character"
                id="characterImageRight"
                class="overlay-image-right"
            >
            <div id="narrationBox" class="narration-box">
                Tahun 2022.
                Sword Art Online akhirnya resmi dibuka.
            </div>

            <div id="dialogBox" class="dialog-box">

                <div id="speakerName" class="speaker-name">
                    Kirito
                </div>

                <div id="dialogText">
                    Selamat datang di Aincrad!
                </div>

            </div>

            <button id="nextBtn" class="next-btn" onclick="nextStory()">
                NEXT
            </button>
        </div>
    </div>
<script>
    const storyData = [

        {
            type: "video",
            background_url: "https://res.cloudinary.com/djeiswvsw/video/upload/YTDown_YouTube_Sword-Art-Online-Sachi-s-Death-HD_Media_p8_NMj7hvRI_001_720p_pqkbqy.mp4"
        },

        {
            type: "narration",
            background_url: "img/bg-bg.jpg",
            text: "Tahun 2022."
        },

        {
            type: "narration",
            text: "Sword Art Online akhirnya resmi dibuka."
        },

        {
            type: "dialog",
            character_left_url: "img/character_kirito.png",
            speaker: "Kirito",
            text: "Selamat datang di Aincrad!"
        },

        {
            type: "dialog",
            character_left_url: "img/character_kirito.png",
            speaker: "Kirito",
            text: "Ini adalah dunia baru."
        },

        {
            type: "dialog",
            character_right_url: "img/character_kiel.png",
            audio_url: "audio/sword.mp3",
            speaker: "Kiel",
            text: "Aku siap bertarung."
        },

        {
            type: "dialog",
            character_right_url: "img/character_kiel.png",
            hide_left: true,
            speaker: "Kiel",
            text: "Kirito sudah pergi."
        },

        {
            type: "system",
            text: "All players will be transported shortly."
        }
    ];
    let currentIndex = 0;

    const backgroundImage =
        document.getElementById("backgroundImage");

    const characterImageLeft =
        document.getElementById("characterImageLeft");

    const characterImageRight =
        document.getElementById("characterImageRight");

    const dialogBox =
        document.getElementById("dialogBox");

    const narrationBox =
        document.getElementById("narrationBox");

    const speakerName =
        document.getElementById("speakerName");

    const dialogText =
        document.getElementById("dialogText");
    const nextBtn =
    document.getElementById("nextBtn");

    const storyVideo =
        document.getElementById("storyVideo");

    const storyAudio = new Audio();
    const bgmAudio = new Audio();

    bgmAudio.loop = true;
    bgmAudio.volume = 0.3; // 30%

    storyVideo.addEventListener("ended", () => {

        nextBtn.style.display = "block";

    });

    function renderEntry() {

        const entry = storyData[currentIndex];

        if (!entry) {
            closeImage();
            return;
        }

        // reset hanya UI sementara
        storyVideo.style.display = "none";
        storyVideo.pause();
        storyVideo.src = "";

        dialogBox.style.display = "none";
        narrationBox.style.display = "none";
        nextBtn.style.display = "block";

        storyAudio.pause();
        storyAudio.currentTime = 0;
        storyAudio.src = "";

        // =====================
        // VIDEO
        // =====================

        if (entry.type === "video") {

            backgroundImage.style.display = "none";
            characterImageLeft.style.display = "none";
            characterImageRight.style.display = "none";

             // sembunyikan tombol
            nextBtn.style.display = "none";

            storyVideo.style.display = "block";

            storyVideo.src = entry.background_url;

            storyVideo.load();

            storyVideo.play()
                .catch(err => console.log(err));

            return;
        }

        // jika bukan video tampilkan background lagi
        backgroundImage.style.display = "block";

        // =====================
        // BACKGROUND
        // =====================

        if (entry.background_url) {
            backgroundImage.src = entry.background_url;
        }

        // =====================
        // CHARACTER LEFT
        // =====================

        if (entry.character_left_url) {

            characterImageLeft.style.display = "block";

            characterImageLeft.src =
                entry.character_left_url;
        }

        if (entry.hide_left){
            characterImageLeft.style.display = "none";
        }

        // =====================
        // CHARACTER RIGHT
        // =====================

        if (entry.character_right_url) {

            characterImageRight.style.display = "block";

            characterImageRight.src =
                entry.character_right_url;
        }

        if (entry.hide_right){
            characterImageRight.style.display = "none";
        }

        if (entry.audio_url) {
            console.log("play:", entry.audio_url);
            nextBtn.disabled = true;

            storyAudio.src = entry.audio_url;

            storyAudio.play()
                .then(() => console.log("audio play"))
                .catch(err => console.error(err));

            storyAudio.onended = () => {
                nextBtn.disabled = false;
            };
        }

        // =====================
        // NARRATION
        // =====================

        if (entry.type === "narration") {

            narrationBox.style.display = "block";

            narrationBox.textContent =
                entry.text;

            return;
        }

        // =====================
        // DIALOG
        // =====================

        if (entry.type === "dialog") {

            dialogBox.style.display = "block";

            speakerName.textContent =
                entry.speaker || "";

            dialogText.textContent =
                entry.text || "";

            return;
        }

        // =====================
        // SYSTEM
        // =====================

        if (entry.type === "system") {

            dialogBox.style.display = "block";

            speakerName.textContent = "SYSTEM";

            dialogText.textContent =
                entry.text || "";

            return;
        }
    }

    function nextStory() {

        currentIndex++;

        renderEntry();
    }

    function openImage() {

        currentIndex = 0;

        bgmAudio.src = "audio/bgm1.mp3";

        bgmAudio.play()
            .catch(err => console.log(err));

        document
            .getElementById("imageModal")
            .classList.add("show");

        renderEntry();
    }

    function closeImage() {

        storyVideo.pause();
        storyVideo.src = "";

        bgmAudio.pause();
        bgmAudio.currentTime = 0;

        document
            .getElementById("imageModal")
            .classList.remove("show");
    }
</script>
</body>
</html>
