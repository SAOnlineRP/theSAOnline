<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.95);

            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .overlay-image {
            position: absolute;
            top: 10px;
            left: 180px;
            height: stretch;
            z-index: 10;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 32px;
            cursor: pointer;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .modal-image {
                transform: rotate(90deg);
                max-width: 90vh;
                max-height: 90vw;
            }
        }
    </style>
<body>
    <button onclick="openImage()">Lihat Gambar</button>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeImage()">✕</span>

        <img
        src="https://lh3.googleusercontent.com/d/1bgmcX_MuUsY45-SRajivOUl1HodX8jdG"
        alt="Background"
        class="modal-image"
        >

        <img
            src="https://lh3.googleusercontent.com/d/19jbF1pme1_6kKAbICFxJBetiFhJ3J4QA"
            alt="character"
            class="overlay-image"
        >
    </div>
<script>
    function openImage() {
    document.getElementById('imageModal').classList.add('show');
    }

    function closeImage() {
        document.getElementById('imageModal').classList.remove('show');
    }
</script>
</body>
</html>
