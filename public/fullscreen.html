<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.95);

            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .modal-image {
            display: block;
            object-fit: contain;
        }

        .overlay-image-right {
            position: absolute;
            top: 0;
            right: 40px;

            height: 100%;
            width: auto;

            z-index: 10;
        }

        .overlay-image-left {
            position: absolute;
            top: 0;
            left: 40px;

            height: 100%;
            width: auto;

            z-index: 10;
        }

        .dialog-box {
            position: absolute;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);

            width: 80%;
            max-width: 700px;

            padding: 16px 20px;

            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4fc3f7;
            border-radius: 12px;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;

            z-index: 15;
        }

        .next-btn {
            position: absolute;
            bottom: 80px;
            right: 80px;

            z-index: 20;

            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background: #2196f3;
            color: white;
            font-weight: bold;
            font-size: 18px;
            
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            z-index: 99;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .image-wrapper {
                transform: rotate(90deg);
            }
            .next-btn {
                bottom:60px;
            }
        }
    </style>
<body>
    <button onclick="openImage()">Lihat Gambar</button>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeImage()">✕</span>

        <div class="image-wrapper">
            <img
                src="https://lh3.googleusercontent.com/d/1bgmcX_MuUsY45-SRajivOUl1HodX8jdG"
                alt="Background"
                class="modal-image"
            >

            <img
                src="https://lh3.googleusercontent.com/d/19jbF1pme1_6kKAbICFxJBetiFhJ3J4QA"
                alt="Character"
                id="characterImageLeft"
                class="overlay-image-left"
            >

            <img
                src="https://lh3.googleusercontent.com/d/1oaGWmBXujU3mr4HAveUGE04SuPk9EOBB"
                alt="Character"
                id="characterImageRight"
                class="overlay-image-right"
            >

            <div id="dialogBox" class="dialog-box">
                Selamat datang di Aincrad!
            </div>

            <button class="next-btn" onclick="nextCharacter()">
                NEXT
            </button>
        </div>
    </div>
<script>
    function openImage() {
    document.getElementById('imageModal').classList.add('show');
    }

    function closeImage() {
        document.getElementById('imageModal').classList.remove('show');
    }

    function nextCharacter() {
        document.getElementById("characterImage").src =
            "https://lh3.googleusercontent.com/d/1RSZiiGzj98af673SSPihI596lsXGWbss";
    }
</script>
</body>
</html>
