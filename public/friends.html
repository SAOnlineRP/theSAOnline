<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friend Menu Wireframe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .screen {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

    .top-bar {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 50px;
    }

    .top-icon {
      font-size: 50px;
      cursor: pointer;
      user-select: none;
    }

    .layout {
      display: flex;
      gap: 34px;
      align-items: center;
      justify-content: center;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 150px;
    }

    .menu-btn {
      background: #bfbfbf;
      border: none;
      padding: 12px 8px;
      font-size: 30px;
      text-align: center;
      cursor: pointer;
      color: #222;
    }

    .menu-btn.active {
      background: #707070;
      color: white;
    }

    .main-panel {
      background: #707070;
      width: 500px;
      min-height: 300px;
      padding: 18px 22px;
      position: relative;
    }

    .search-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #d9d9d9;
      height: 24px;
      padding: 0 8px;
      width: 135px;
      font-size: 13px;
      color: #444;
    }

    .search-box input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 13px;
    }

    .search-icon {
      margin-left: 6px;
      font-size: 12px;
    }

    .content-area {
      display: flex;
      gap: 18px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
      flex: 1;
    }

    .friend-card {
      background: #d9d9d9;
      height: 60px;
      width: 100%;
    }

    .scroll-bar {
      width: 10px;
      height: 136px;
      background: #d9d9d9;
      position: relative;
      margin-top: 2px;
    }

    .scroll-thumb {
      width: 100%;
      height: 70px;
      background: #b5b5b5;
    }
  </style>
</head>
<body>
    <div class="screen">
        <div class="top-bar">
            <div class="top-icon" onclick="goBack()">↩</div>
            <div class="top-icon" onclick="goHome()">🏠</div>
        </div>

        <div class="layout">
            <div class="sidebar">
            <button class="menu-btn active">My Friends</button>
            <button class="menu-btn">Add Friends</button>
            <button class="menu-btn">Request Add</button>
            </div>

            <div class="main-panel">
            <div class="search-bar">
                <div class="search-box">
                <input type="text" placeholder="Search by ID" />
                <span class="search-icon">🔍</span>
                </div>
            </div>

            <div class="content-area">
                <div class="card-grid">
                <div class="friend-card"></div>
                <div class="friend-card"></div>
                <div class="friend-card"></div>
                <div class="friend-card"></div>
                <div class="friend-card"></div>
                <div class="friend-card"></div>
                </div>

                <div class="scroll-bar">
                <div class="scroll-thumb"></div>
                </div>
            </div>
            </div>
        </div>
    </div>
    <script>
        function goBack() {
            window.history.back();
        }

        function goHome() {
            window.location.href = "menu.html";
        }
    </script>

</body>
</html>
