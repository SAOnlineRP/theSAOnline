<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style_coba.css" />
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="hex h1"></div>
  <div class="hex h2"></div>
  <div class="hex h3"></div>
  <div class="hex h4"></div>
  <div class="hex h5"></div>

  <div class="top-icons">
    <button class="hud-icon" aria-label="Music">
      <span class="inner-ring"></span>
      <span class="icon">♪</span>
    </button>
    <button class="hud-icon" aria-label="Settings">
      <span class="inner-ring"></span>
      <span class="icon">⚙</span>
    </button>
  </div>

  <main class="page">
    <section class="login-shell">
      <h1 class="login-title">Login</h1>

      <div class="login-panel">
        <div class="panel-stripes top">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="panel-corner">
          <span>×</span>
        </div>

        <div class="panel-lines">
          <span class="line left-top"></span>
          <span class="line left-bottom"></span>
          <span class="line right-top"></span>
          <span class="line bottom-left"></span>
        </div>

        <label class="field">
          <div class="field-icon">
            <span class="inner-ring"></span>
            <span class="icon">👤</span>
          </div>
          <div class="sci-input">
            <span class="input-frame"></span>
            <input type="text" placeholder="Username">
          </div>
        </label>

        <label class="field">
          <div class="field-icon">
            <span class="inner-ring"></span>
            <span class="icon">🔒</span>
          </div>
          <div class="sci-input">
            <span class="input-frame"></span>
            <input type="password" placeholder="Password">
          </div>
        </label>

        <div class="btn-wrap">
          <button class="login-btn">Login</button>
        </div>

        <div class="panel-stripes bottom">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-bar">
    <button class="hud-icon small" aria-label="Achievement"><span class="inner-ring"></span><span class="icon">⚙</span></button>
    <button class="hud-icon small" aria-label="Bag"><span class="inner-ring"></span><span class="icon">👜</span></button>
    <button class="hud-icon small" aria-label="Community"><span class="inner-ring"></span><span class="icon">👥</span></button>
    <button class="hud-icon small" aria-label="Cart"><span class="inner-ring"></span><span class="icon">🛒</span></button>
    <button class="hud-icon small" aria-label="Mail"><span class="inner-ring"></span><span class="icon">✉</span></button>
  </nav>
</body>
</html>
