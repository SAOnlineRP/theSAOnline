<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #003973;
            --bg-mid: #11375d;
            --bg-bottom: #020813;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif !important;
        }

        body {
            min-height: 100vh;
            background-size: cover;
            background: radial-gradient(circle at top, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
        }

        .container {
            height: 100vh;              /* patok ke tinggi layar */
            width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
            max-width: 100%;
            margin: 0 auto;

            position: relative;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(600px, 60vw);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 0 20px rgba(0, 221, 255, 0.5)) blur(0.5px);
            z-index: -1;
        }

        /* top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 40px;
        }

        .topbar-left {
            display: flex;
            gap: 18px;
            color: #000;
            align-items: center;
        }

        .topbar-left button {
            border: none;
            background: none;
            font-size: 40px;
            cursor: pointer;
        }

        

        .content {
            min-height: 75%;
            background: #215b7a;
            border-radius: 10px;
            box-shadow:
            inset 0 0 18px rgba(255,255,255,0.04),
            0 10px 28px rgba(0,0,0,0.35);

            overflow-x: auto; /* penting */
            overflow-y: hidden;
            padding: 15px;

            justify-content: center; /* ini bikin center atas-bawah */
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
        <div class="topbar">
            <div class="topbar-left">
                <button onclick="goBack()"><img src="/img/back2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
                <button onclick="goHome()"><img src="/img/home2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
            </div>

        </div>
        <div class="content">
            <img src="/img/bg-bg.jpg" style="width: 100%;
  height: 460px; object-fit: fill;">

            
        </div>
    </div>
    <script>
        function goBack() {
        window.history.back();
        }

        function goHome() {
        window.location.href = "menu.html";
        }

        function goToParty() {
        window.location.href = "party.html";
        }
    </script>
</body>
</html>
