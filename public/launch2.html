<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic Login UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
       
        font-family: 'Orbitron', sans-serif;
        background:
            radial-gradient(circle at top, #11375d 0%, #07142d 45%, #020813 100%);
        overflow: hidden;
        color: #bffcff;
        display: flex;
        justify-content: center; /* horizontal */
        align-items: center;     /* vertical */
        height: 100vh;           /* tinggi full layar */
        margin: 0;
    }
    .stars-container {
        position: absolute;
        width: 100%;
        height: 100%;
        perspective: 500px;
        transform-style: preserve-3d;
    }

    .star-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        opacity: 0.8;
    }

    .star-layer:nth-child(1) {
        transform: translateZ(-50px);
        animation: star-drift 150s linear infinite;
    }

    .star-layer:nth-child(2) {
        transform: translateZ(-100px);
        animation: star-drift 200s linear infinite reverse;
        opacity: 0.6;
    }

    .star-layer:nth-child(3) {
        transform: translateZ(-200px);
        animation: star-drift 250s linear infinite;
        opacity: 0.4;
    }

    @keyframes star-drift {
        0% {
            transform: translateZ(-50px) translateY(0);
        }
        100% {
            transform: translateZ(-50px) translateY(100%);
        }
    }

    .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        filter: blur(1px);
    }

    .star-layer::before,
    .star-layer::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .star-layer:nth-child(1)::before {
        background-image: radial-gradient(1px 1px at 10% 10%, white 100%, transparent),
            radial-gradient(1px 1px at 20% 20%, white 100%, transparent),
            radial-gradient(2px 2px at 30% 30%, white 100%, transparent),
            radial-gradient(1px 1px at 40% 40%, white 100%, transparent),
            radial-gradient(2px 2px at 50% 50%, white 100%, transparent),
            radial-gradient(1px 1px at 60% 60%, white 100%, transparent),
            radial-gradient(2px 2px at 70% 70%, white 100%, transparent),
            radial-gradient(1px 1px at 80% 80%, white 100%, transparent),
            radial-gradient(2px 2px at 90% 90%, white 100%, transparent),
            radial-gradient(1px 1px at 15% 85%, white 100%, transparent);
    }

    .nebula {
        position: absolute;
        width: 120%;
        height: 120%;
        top: -10%;
        left: -10%;
        background: radial-gradient(
            ellipse at 30% 30%,
            rgba(63, 0, 113, 0.3) 0%,
            rgba(63, 0, 113, 0) 70%
            ),
            radial-gradient(
            ellipse at 70% 60%,
            rgba(0, 113, 167, 0.3) 0%,
            rgba(0, 113, 167, 0) 70%
            ),
            radial-gradient(
            ellipse at 50% 50%,
            rgba(167, 0, 157, 0.2) 0%,
            rgba(167, 0, 157, 0) 70%
            );
        filter: blur(30px);
        opacity: 0.5;
        animation: nebula-shift 30s infinite alternate ease-in-out;
    }

    @keyframes nebula-shift {
        0% {
            transform: scale(1) rotate(0deg);
            opacity: 0.3;
        }
        50% {
            opacity: 0.5;
        }
        100% {
            transform: scale(1.2) rotate(5deg);
            opacity: 0.4;
        }
 }

    .grid-plane {
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background-image: linear-gradient(
            rgba(0, 162, 255, 0.15) 1px,
            transparent 1px
            ),
            linear-gradient(90deg, rgba(0, 162, 255, 0.15) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(60deg);
        transform-origin: center;
        animation: grid-move 20s linear infinite;
        opacity: 0.3;
    }

    @keyframes grid-move {
        0% {
            transform: perspective(500px) rotateX(60deg) translateY(0);
        }
        100% {
            transform: perspective(500px) rotateX(60deg) translateY(40px);
        }
    }

    .button-container {
        position: relative;
        perspective: 1000px;
        transform-style: preserve-3d;
        z-index: 10;
    }

    .holo-button {
        position: relative;
        width: 500px;
        height: 300px;
        background: rgba(10, 10, 30, 0.3);
        border: none;
        color: rgba(0, 221, 255, 0.8);
        font-family: "Orbitron", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 3px;
        text-shadow: 0 0 10px rgba(0, 221, 255, 0.5);
        cursor: pointer;
        overflow: hidden;
        transform-style: preserve-3d;
        transition: all 0.3s ease;
        -webkit-tap-highlight-color: transparent;
        outline: none;
        z-index: 5;
        border-radius: 2px;
    }

    .holo-button::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        right: 2px;
        bottom: 2px;
        background: linear-gradient(
            45deg,
            rgba(0, 0, 40, 0.8) 0%,
            rgba(0, 20, 50, 0.8) 50%,
            rgba(5, 10, 30, 0.8) 100%
        );
        z-index: -1;
        border-radius: 1px;
    }

    .button-border {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    .button-border::before,
    .button-border::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid transparent;
        box-shadow: 0 0 10px rgba(0, 221, 255, 0.7);
        animation: border-flow 3s infinite;
    }

    .button-border::before {
        border-top-color: rgba(0, 221, 255, 0.8);
        border-left-color: rgba(0, 221, 255, 0.8);
        filter: drop-shadow(0 0 5px rgba(0, 221, 255, 0.7));
    }

    .button-border::after {
        border-bottom-color: rgba(255, 0, 222, 0.8);
        border-right-color: rgba(255, 0, 222, 0.8);
        filter: drop-shadow(0 0 5px rgba(255, 0, 222, 0.7));
    }

    @keyframes border-flow {
        0%,
        100% {
            transform: scale(1);
            opacity: 1;
        }
        50% {
            transform: scale(1.03);
            opacity: 0.8;
        }
    }

    .button-hexagons {
        position: absolute;
        width: 1000px;
        height: 400px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 1;
    }

    .hexagon {
        position: absolute;
        width: 30px;
        height: 17.32px;
        background: transparent;
        border: 1.5px solid rgba(0, 221, 255, 0.3);
        transform: rotate(30deg);
        opacity: 0;
        animation: hexagon-pulse 3s infinite;
    }

    .hexagon::before,
    .hexagon::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: transparent;
        border: 1.5px solid rgba(0, 221, 255, 0.3);
    }

    .hexagon::before {
        transform: rotate(60deg);
    }

    .hexagon::after {
        transform: rotate(-60deg);
    }

    .hexagon:nth-child(1) {
        top: 20px;
        left: 20px;
        animation-delay: 0.1s;
    }

    .hexagon:nth-child(2) {
        top: 20px;
        right: 20px;
        animation-delay: 0.3s;
    }

    .hexagon:nth-child(3) {
        bottom: 20px;
        left: 20px;
        animation-delay: 0.5s;
    }

    .hexagon:nth-child(4) {
        bottom: 20px;
        right: 20px;
        animation-delay: 0.7s;
    }

    .hexagon:nth-child(5) {
        top: 50%;
        left: 0;
        transform: translate(0, -50%) rotate(30deg);
        animation-delay: 0.9s;
    }

    .hexagon:nth-child(6) {
        top: 50%;
        right: 0;
        transform: translate(0, -50%) rotate(30deg);
        animation-delay: 1.1s;
    }

    @keyframes hexagon-pulse {
        0% {
            opacity: 0;
            transform: rotate(30deg) scale(0.8);
        }
        20% {
            opacity: 0.5;
            transform: rotate(30deg) scale(1);
        }
        80% {
            opacity: 0.5;
            transform: rotate(30deg) scale(1);
        }
        100% {
            opacity: 0;
            transform: rotate(30deg) scale(1.2);
        }
    }

    .digital-glyphs {
        position: absolute;
        width: 300px;
        height: 400px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 1;
    }

    .digital-glyph {
        position: absolute;
        color: rgba(0, 221, 255, 0.5);
        font-size: 10px;
        font-family: "Orbitron", monospace;
        white-space: nowrap;
        opacity: 0;
        animation: glyph-fade 4s infinite;
    }

    .digital-glyph:nth-child(1) {
        top: -30px;
        left: 60px;
        animation-delay: 0.2s;
    }

    .digital-glyph:nth-child(2) {
        top: -20px;
        right: 40px;
        animation-delay: 0.6s;
    }

    .digital-glyph:nth-child(3) {
        bottom: -30px;
        left: 80px;
        animation-delay: 1s;
    }

    .digital-glyph:nth-child(4) {
        bottom: -20px;
        right: 60px;
        animation-delay: 1.4s;
    }

    @keyframes glyph-fade {
        0% {
            opacity: 0;
            transform: translateY(0);
        }
        10% {
            opacity: 0.7;
        }
        90% {
            opacity: 0.7;
        }
        100% {
            opacity: 0;
            transform: translateY(-10px);
        }
    }

    .corner-accents {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .corner-accent {
        position: absolute;
        width: 15px;
        height: 15px;
        border-style: solid;
        border-width: 2px;
        border-color: rgba(0, 221, 255, 0.7);
    }

    .corner-accent:nth-child(1) {
        top: 0;
        left: 0;
        border-right: none;
        border-bottom: none;
    }

    .corner-accent:nth-child(2) {
        top: 0;
        right: 0;
        border-left: none;
        border-bottom: none;
    }

    .corner-accent:nth-child(3) {
        bottom: 0;
        left: 0;
        border-right: none;
        border-top: none;
    }

    .corner-accent:nth-child(4) {
        bottom: 0;
        right: 0;
        border-left: none;
        border-top: none;
    }

    .button-glitch {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        animation: button-glitch 8s infinite;
    }

    @keyframes button-glitch {
        0%,
        100% {
            opacity: 0;
        }
        94%,
        96% {
            opacity: 0;
        }
        94.5% {
            opacity: 0.8;
            transform: translate(5px, -2px) skew(-5deg, 2deg);
            background: rgba(255, 0, 222, 0.2);
        }
        95% {
            opacity: 0.8;
            transform: translate(-5px, 2px) skew(5deg, -2deg);
            background: rgba(0, 221, 255, 0.2);
        }
        95.5% {
            opacity: 0.8;
            transform: translate(2px, 0) skew(-2deg, 0);
            background: rgba(255, 255, 255, 0.2);
        }
    }

        /* Звуковые волны */
    .sound-wave {
        position: absolute;
        bottom: -30px;
        left: 0;
        width: 100%;
        height: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
    }

    .wave-bar {
        width: 2px;
        height: 5px;
        background: rgba(0, 221, 255, 0.5);
        margin: 0 2px;
        border-radius: 1px;
        animation: wave-animation 1.5s infinite;
    }

    @keyframes wave-animation {
        0%,
        100% {
            height: 5px;
        }
        50% {
            height: 15px;
        }
    }

    .wave-bar:nth-child(1) {
        animation-delay: 0.1s;
    }
    .wave-bar:nth-child(2) {
        animation-delay: 0.2s;
    }
    .wave-bar:nth-child(3) {
        animation-delay: 0.3s;
    }
    .wave-bar:nth-child(4) {
        animation-delay: 0.4s;
    }
    .wave-bar:nth-child(5) {
        animation-delay: 0.5s;
    }
    .wave-bar:nth-child(6) {
        animation-delay: 0.6s;
    }
    .wave-bar:nth-child(7) {
        animation-delay: 0.7s;
    }
    .wave-bar:nth-child(8) {
        animation-delay: 0.8s;
    }
    .wave-bar:nth-child(9) {
        animation-delay: 0.9s;
    }
    .wave-bar:nth-child(10) {
        animation-delay: 1s;
    }
    .wave-bar:nth-child(11) {
        animation-delay: 0.9s;
    }
    .wave-bar:nth-child(12) {
        animation-delay: 0.8s;
    }
    .wave-bar:nth-child(13) {
        animation-delay: 0.7s;
    }
    .wave-bar:nth-child(14) {
        animation-delay: 0.6s;
    }
    .wave-bar:nth-child(15) {
        animation-delay: 0.5s;
    }

    .holo-button:hover {
        color: rgb(255, 255, 255);
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        transform: scale(1.02);
        transition: all 0.2s ease;
    }


    .button-text {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 20px;
        font-size: 35px;
    }

    .holo-button {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
    }

    .holo-button input {
        width: 70%;
        padding: 10px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(0, 221, 255, 0.5);
        color: #bffcff;
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        outline: none;
    }

    .holo-button input::placeholder {
        color: rgba(0, 221, 255, 0.5);
    }

    .login-btn {
        padding: 10px 25px;
        background: transparent;
        border: 1px solid rgba(0, 221, 255, 0.7);
        color: #bffcff;
        cursor: pointer;
        font-family: 'Orbitron', sans-serif;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: rgba(0, 221, 255, 0.2);
    }

    .login-status {
        margin-top: 10px;
        font-size: 14px;
        letter-spacing: 2px;
        opacity: 0;
        transition: 0.3s;
    }

    .success {
        color: #00ffcc;
        text-shadow: 0 0 10px #00ffcc;
        animation: flicker 0.5s infinite alternate;
    }

    .error {
        color: #ff0055;
        text-shadow: 0 0 10px #ff0055;
    }

    @keyframes flicker {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
    }

    /* efek glow sukses */
    .holo-button.success-mode {
        box-shadow: 0 0 30px rgba(0,255,200,0.6),
                    inset 0 0 20px rgba(0,255,200,0.4);
        transform: scale(1.05);
    }

    /* efek scan */
    .scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: rgba(0,255,200,0.8);
        top: 0;
        left: 0;
        animation: scan 1s linear forwards;
    }

    @keyframes scan {
        0% { top: 0; }
        100% { top: 100%; }
    }

    .sao-text {
        margin-top: 10px;
        font-size: 14px;
        letter-spacing: 3px;
        color: #7df9ff;
        text-shadow: 0 0 8px #00eaff;
        opacity: 0.8;
    }

    /* overlay scan */
    .sao-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
    }

    .sao-overlay::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 2px;
        background: #00eaff;
        box-shadow: 0 0 10px #00eaff;
        top: -10px;
        animation: sao-scan 1s linear;
    }

    @keyframes sao-scan {
        0% { top: -10px; }
        100% { top: 100%; }
    }

    /* glow SAO */
    .sao-success {
        border: 1px solid #00eaff;
        box-shadow: 0 0 20px #00eaff, inset 0 0 10px #00eaff;
    }

    .bg-image {
        position: absolute;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        
        width: 300px; /* bisa kamu adjust */
        opacity: 0.4; /* biar subtle di background */
        
        pointer-events: none; /* biar ga ganggu klik */
        z-index: 0;

        filter: 
            drop-shadow(0 0 20px rgba(0, 221, 255, 0.5))
            blur(0.5px);
    }

    @media (max-width: 480px) {
        .grid-plane {
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background-size: 20px 20px;
            transform: perspective(300px) rotateX(50deg);
            opacity: 0.2;
            animation: grid-move 40s linear infinite; /* lebih slow */
        }
        .nebula {
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            filter: blur(15px);
            opacity: 0.25;
            animation: nebula-shift 60s infinite alternate ease-in-out;
        }
        .holo-button {
            width: 90%;
            max-width: 400px;
            height: auto;
            padding: 20px;
        }
        .button-text {
            font-size: 20px;
            padding-top: 0px;
        }
    }
  </style>
</head>
<body>
    <img src="/img/aincard.png" class="bg-image" />
    <div class="nebula"></div>
    <div class="grid-plane"></div>
    <div class="stars-container">
        <div class="star-layer"></div>
        <div class="star-layer"></div>
        <div class="star-layer"></div>
    </div>

    <div class="button-container">
        <div class="button-hexagons">
            <div class="hexagon"></div>
            <div class="hexagon"></div>
            <div class="hexagon"></div>
            <div class="hexagon"></div>
            <div class="hexagon"></div>
            <div class="hexagon"></div>
        </div>

        <div class="digital-glyphs">
            <div class="digital-glyph">0x89F2 EXEC PROTOCOL</div>
            <div class="digital-glyph">SYS.QUANTUM.INIT()</div>
            <div class="digital-glyph">
            01011010 01000001 01010000 01010101 01010011 01001011
            </div>
            <div class="digital-glyph">HOLO-CONN INITIALIZED</div>
        </div>

        <form class="holo-button" onsubmit="handleLogin(event)">

            <!-- overlay scan SAO -->
            <div class="sao-overlay"></div>

            <!-- teks status SAO -->
            <div id="sao-text" class="sao-text">SYSTEM READY</div>

            <!-- judul -->
            <div class="button-text">LOGIN</div>

            <!-- input -->
            <input type="text" id="username" placeholder="USERNAME" required>
            <input type="password" id="password" placeholder="PASSWORD" required>

            <!-- tombol -->
            <button type="submit" class="login-btn">ENTER</button>

        </form>

        <div class="sound-wave">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
    </div>
    <script>
    function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const text = document.getElementById("sao-text");
        const button = document.querySelector(".holo-button");

        if (username === "admin" && password === "1234") {

            text.textContent = "LINK START";

            setTimeout(() => {
                text.textContent = "AUTHENTICATING";
            }, 800);

            setTimeout(() => {
                text.textContent = "ACCESS GRANTED";
                button.classList.add("sao-success");
            }, 1600);

            setTimeout(() => {
                text.textContent = "WELCOME, PLAYER";
            }, 2300);

            setTimeout(() => {
                document.body.style.opacity = 0;
                document.body.style.transition = "1s";

                setTimeout(() => {
                    window.location.href = "user_profile.html";
                }, 1000);
            }, 3000);

        } else {
            text.textContent = "ACCESS DENIED";
        }
    }
    </script>
</body>
</html>
