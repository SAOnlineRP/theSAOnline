<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theSAOnline</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/register.css" />
</head>
<body>
  <main class="screen">
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
    <div class="nebula"></div>
    <div class="grid-plane"></div>

    <div class="stars-container">
      <div class="star-layer"></div>
      <div class="star-layer"></div>
      <div class="star-layer"></div>
    </div>

    <div class="button-container" id="startContainer">
      <div class="button-hexagons">
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
      </div>      
      
    </div>
    <div>
      <h2 class="register-title">YOUR CHARACTER</h2>
      <div class="register-modal">
        <div class="register-panel">
          <div class="sao-overlay"></div>

          <div class="register-corners" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="character-selector">
              <button type="button" class="char-nav" id="prevChar">
                  ◀
              </button>

              <img
                  id="characterImage"
                  src="img/characters/cewek1.png"
                  alt="Character"
                  class="character-image"
              >

              <button type="button" class="char-nav" id="nextChar">
                  ▶
              </button>
          </div>
        </div>
        <div class="register-panel">
          <div class="sao-overlay"></div>

          <div class="register-corners" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <form class="register-form" id="registerForm">
            <input type="text" id="username" placeholder="USERNAME" required />
            <input type="password" id="password" placeholder="PASSWORD" required />

            <div class="register-actions">
              <button type="submit" class="register-btn">REGISTER</button>
            </div>

            <div class="register-status" id="registerStatus"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    const characters = [
        "img/characters/cewek1.png",
        "img/characters/cewek2.png",
        "img/characters/cowok1.png",
        "img/characters/cowok2.png"
    ];

    let currentIndex = 0;

    const image = document.getElementById("characterImage");
    const prevBtn = document.getElementById("prevChar");
    const nextBtn = document.getElementById("nextChar");

    function updateCharacter() {
        image.src = characters[currentIndex];
    }

    nextBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % characters.length;
        updateCharacter();
    });

    prevBtn.addEventListener("click", () => {
        currentIndex =
            (currentIndex - 1 + characters.length) % characters.length;
        updateCharacter();
    });
  </script>
</body>
</html>
