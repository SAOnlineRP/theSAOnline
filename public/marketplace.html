<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/marketplace.css">
</head>
<body>
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
  <div class="container">
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="loading-overlay">
        <div>Loading Assets...</div>
        <div class="loading-bar-container">
            <div id="loading-bar" class="loading-bar"></div>
        </div>
    </div>
    <div class="topbar">
      <div class="topbar-left">
        <button onclick="goBack()"><img src="/img/back2.png" style="width: 35px; height: 35px;" alt="Back"></button>
        <button onclick="goHome()"><img src="/img/home2.png" style="width: 35px; height: 35px;" alt="Home"></button>
      </div>

      <div class="topbar-right">
        <div class="currency-box" style="color: white;">🪙 10000</div>
        <div class="currency-box" style="color: white;">💎 50</div>
      </div>
    </div>
    <div class="market-container">
        <div class="nav-tab-wrapper d-flex justify-content-between align-items-center">
            <ul class="nav nav-tabs" id="marketTabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link-market" href="#" data-target="items-list" onclick="switchTab(event)">Items</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link-market active" href="#" data-target="equipments" onclick="switchTab(event)">Equipments</a>
                </li>
            </ul>
             <div class="right-buttons d-flex gap-2">
                <button class="btn btn-sm btn-info text-btn button-market" style="color: black !important;" onclick="goToStorage()">My Storage</button>
                <button class="btn btn-sm btn-cart" style="background-color: #362f2c;" onclick="openPopup()"><i class="bi bi-cart button-market"></i></button>
            </div>
        </div>
        <div class="tab-content" id="marketTabsContent">
            <div class="tab-pane active show" id="equipments">
                <div class="wequip-list" id="list-equipments">
                    <p>List of equipments available.</p>
                </div>
            </div>
            <div class="tab-pane" id="items-list">
                <h4>ITEMS</h4>
                <p>List of items available in the marketplace.</p>
            </div>
        </div>
    </div>
    <!-- Pop Up Keranjang -->
    <div class="popup" id="myPopup">
        <div class="popup-content">
            <div class="popup-title" style="padding-bottom: 10px; font-size: 20px;">YOUR CART</div>
            <div class="cart-list"></div>

            <div class="cart-footer">
                <div class="cart-total">
                    Total = 0
                </div>

                <div class="cart-actions">
                    <button class="buy-btn">Buy</button>
                    <button class="close-btn" onclick="closePopup()">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script type="module">
    import { supabase } from "/js/supabaseClient.js";
    import { requireLogin } from "/js/authGuard.js";

    const overlay = document.getElementById("loading-overlay");
    const bar = document.getElementById("loading-bar");

    let progress = 0;

    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }

    function goToStorage() {
      window.location.href = "storage.html";
    }

    window.goBack = goBack;
    window.goHome = goHome;
    window.goToStorage = goToStorage;
    window.switchTab = switchTab;
    window.openPopup = openPopup;
    window.closePopup = closePopup;

    let merchantItems = [];

    async function loadData(session){
        try {
            const resMerchant = await fetch(
                `/api/admin`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${session.access_token}`,
                    },
                    body: JSON.stringify({
                        action: "getAll",
                        table: "merchant_items"
                    })
                }
            );

            const merchantData = await resMerchant.json();
            merchantItems = merchantData.data;

            const items = merchantItems.filter(row => row.goods_type === "item");
            const equipments = merchantItems.filter(row => row.goods_type === "equipment");
            console.log("items merchant: ", items);
            console.log("eq merchant: ", equipments);

            renderEquipments(equipments);
            if (!resMerchant.ok) throw new Error(merchantData.error);
        } catch (err) {
            console.error("Load error:", err);
            hideLoading();
        }
    }

    function setProgress(value) {
        progress = value;
        bar.style.width = progress + "%";
    }

    function hideLoading() {
        overlay.classList.add("fade-out");
        setTimeout(() => {
            overlay.style.display = "none";
        }, 500);
    }

    function waitForImages() {
        const images = document.querySelectorAll("img");
        let loaded = 0;
        const total = images.length;

        if (total === 0) return Promise.resolve();

        return new Promise((resolve) => {
            images.forEach((img) => {
            if (img.complete) {
                loaded++;
                update();
            } else {
                img.onload = () => {
                loaded++;
                update();
                };
                img.onerror = () => {
                loaded++;
                update();
                };
            }
            });

            function update() {
            const percent = (loaded / total) * 50; // max 50%
            setProgress(50 + percent);

            if (loaded === total) resolve();
            }
        });
    }

    function switchTab(event) {
        event.preventDefault();
        // Remove active class from all nav links
        document.querySelectorAll('.nav-link-market').forEach(link => {
            link.classList.remove('active');
        });

        // Hide all tab panes
        document.querySelectorAll('.tab-pane').forEach(pane => {
            pane.classList.remove('active', 'show');
        });

        // Activate clicked nav
        const clicked = event.target;
        clicked.classList.add('active');

        // Show target tab
        const targetId = clicked.getAttribute('data-target');
        const targetPane = document.getElementById(targetId);
        if (targetPane) {
            targetPane.classList.add('active', 'show');
        }
    }
    document.addEventListener('click', function(e) {
        const minus = e.target.closest('.minus');
        const plus = e.target.closest('.plus');

        if (!minus && !plus) return;

        const card = e.target.closest('.input-angka');
        const input = card.querySelector('.qty-input');

        let value = parseInt(input.value) || 1;

        if (minus && value > parseInt(input.min)) {
            input.value = value - 1;
        }

        if (plus && value < parseInt(input.max)) {
            input.value = value + 1;
        }
        });

    function openPopup() {
        document.getElementById('myPopup').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('myPopup').style.display = 'none';
    }

    function renderEquipments(data) {
        const container = document.getElementById("list-equipments");
        container.innerHTML = '';

        data.forEach(item => {
            container.innerHTML += `
            <div class="wequip-box" data-id="${item.id}">
                <div class="photo-info">
                <div class="item-photo">
                    <img src="${item.link_photo}" class="photo-item">
                </div>
                <div class="input-angka">
                    <div class="quantity-selector">
                    <button class="qty-btn minus">-</button>
                    <input type="number" min="1" max="${item.quantity}" value="1" class="qty-input" />
                    <button class="qty-btn plus">+</button>
                    </div>
                </div>
                </div>
                <div class="desc-item">
                <div class="item-name">${item.goods_name}</div>
                <div class="item-desc">Deskripsi</div>
                <div class="item-max">(Max.${item.quantity})</div>
                <div class="cost-add">
                    <div class="cost-item">
                    <span>${item.price.toLocaleString()}</span>
                    </div>
                    <div class="add-btn"> 
                    <a class="add-to-cart">Add to <i class="bi bi-cart" style="color:white"></i></a>
                    </div>
                </div>
                </div>
            </div>
            `;
        });
    }

    

    let cart = [];

    function renderCart() {
        const cartList = document.querySelector(".cart-list");
        cartList.innerHTML = "";

        let total = 0;

        cart.forEach(item => {
            const subtotal = item.price * item.quantity;
            total += subtotal;

            cartList.innerHTML += `
            <div class="cart-item">
                <div class="item-photo">
                    <img src="${item.link_photo}" class="photo-item">
                </div>
                <div class="desc-item">
                    <div class="item-name">${item.goods_name}</div>
                    <div>Qty: ${item.quantity}</div>
                    <div>Price: ${item.price.toLocaleString()}</div>
                    <div>Total: ${subtotal.toLocaleString()}</div>
                    <button
                        class="remove-cart-btn"
                        data-id="${item.id}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
            `;
        });

        document.querySelector(".cart-total").textContent =
            `Total = ${total.toLocaleString()}`;
    }

    document.addEventListener("click", function (e) {
        const btn = e.target.closest(".add-to-cart");
        if (!btn) return;

        const card = btn.closest(".wequip-box");

        const id = card.dataset.id;

        const qty =
            parseInt(card.querySelector(".qty-input").value) || 1;

        const product =
            merchantItems.find(item => item.id === id);

        if (!product) return;

        addToCart(product, qty);
    });

    function addToCart(product, qty = 1) {
        const existing = cart.find(item => item.id === product.id);

        if (existing) {
            existing.quantity += qty;

            // optional: jangan lebih dari stok merchant
            if (existing.quantity > product.quantity) {
                existing.quantity = product.quantity;
            }
        } else {
            cart.push({
                id: product.id,
                goods_id: product.goods_id,
                goods_type: product.goods_type,
                goods_name: product.goods_name,
                price: product.price,
                link_photo: product.link_photo,
                quantity: qty
            });
        }

        renderCart();
    }

    function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        renderCart();
    }

    document.addEventListener("click", function(e) {
        const btn = e.target.closest(".remove-cart-btn");

        if (!btn) return;

        removeFromCart(btn.dataset.id);
    });


    async function init() {
        try {
            const session = await requireLogin();
            if (!session) return; // ✅ sekarang valid

            //await loadStorage(session);
            
            await loadData(session);
            setTimeout(hideLoading, 500);

        } catch (err) {
            console.error("Loading error:", err);
        }
    }

    init();
  </script>
</body>
</html>
