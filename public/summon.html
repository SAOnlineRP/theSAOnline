<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gacha Wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      
      min-height: 100vh;
    }

    .screen {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

    .content {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        margin: 0 20px;
      }

    /* top icons */
    .top-left {
      position: absolute;
      top: 12px;
      left: 14px;
      display: flex;
      gap: 14px;
      font-size: 50px;
    }

    .top-left .icon {
      cursor: pointer;
      line-height: 1;
    }

    /* top currency */
    .top-right {
      position: absolute;
      top: 10px;
      right: 0;
      display: flex;
      gap: 12px;
      padding-right: 0;
    }

    .currency-box {
      min-width: 100px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 40px;
    }

    /* left menu */
    .left-panel {
      position: absolute;
      left: 42px;
      top: 100px;
      width: 200px;
      height: 450px;
      background: #6d6d6d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      width: 150px;
      min-height: 80px;
      background: #d9d9d9;
      border: none;
      font-size: 30px;
      cursor: pointer;
      padding: 6px;
      text-align: center;
    }

    .menu-btn.active {
      background: #ffffff;
      border: 3px solid #111;
    }

    /* info text */
    .guarantee-box {
      position: absolute;
      top: 200px;
      right: 18px;
      background: #d9d9d9;
      padding: 8px 10px;
      font-size: 20px;
      text-align: center;
    }

    /* summon buttons */
    .bottom-actions {
      position: absolute;
      right: 26px;
      bottom: 40px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .summon-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .summon-btn {
      width: 150px;
      min-height: 70px;
      background: #d9d9d9;
      border: none;
      font-size: 25px;
      cursor: pointer;
      text-align: center;
      padding: 6px;
    }

    .cost {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media (max-width: 640px) {
      .screen {
        aspect-ratio: 9 / 16;
        min-height: 100vh;
        width: unset;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0 20px;
      }

      .left-panel {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 100px;

        width: auto;
        height: auto;

        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;

        gap: 20px;
        padding: 20px;

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;
      }

      .menu-btn {
        flex: 0 0 150px;
        min-height: 80px;
        font-size: 18px;
      }

      .guarantee-box {
        top: unset;
        bottom: 200px;
      }

      .currency-box {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top-left">
        <button class="icon" onclick="goBack()"><img src="/img/back.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
        <button class="icon" onclick="goHome()"><img src="/img/home.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
    </div>

    <div class="top-right">
      <div class="currency-box">🪙 10000</div>
      <div class="currency-box">💎 50</div>
    </div>

    <div class="content">
      <div class="left-panel">
        <button class="menu-btn active" onclick="changeSummon('special', this)">
          Special<br>Summon
        </button>

        <button class="menu-btn" onclick="changeSummon('regular', this)">
          Regular<br>Summon
        </button>
      </div>
      <div class="right-panel">
        <div class="guarantee-box">
          Get guaranteed partner<br>
          every 10 summons!
        </div>

        <div class="bottom-actions">
          <div class="summon-group">
            <button class="summon-btn">Single<br>Summon</button>
            <div class="cost">💎 250</div>
          </div>

          <div class="summon-group">
            <button class="summon-btn">Summon<br>4x</button>
            <div class="cost">💎 2000</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const summonData = {
      special: {
        text: "Get guaranteed partner<br>every 10 summons!",
        singleText: "Single<br>Summon",
        singleCost: "💎 250",
        multiText: "Summon<br>4x",
        multiCost: "💎 2000"
      },
      regular: {
        text: "Regular summon banner<br>standard partner pool!",
        singleText: "Single<br>Summon",
        singleCost: "🪙 1000",
        multiText: "Summon<br>10x",
        multiCost: "🪙 9000"
      }
    };

    function changeSummon(type, button) {
      const data = summonData[type];
      const rightPanel = document.querySelector(".right-panel");

      rightPanel.innerHTML = `
        <div class="guarantee-box">
          ${data.text}
        </div>

        <div class="bottom-actions">
          <div class="summon-group">
            <button class="summon-btn">${data.singleText}</button>
            <div class="cost">${data.singleCost}</div>
          </div>

          <div class="summon-group">
            <button class="summon-btn">${data.multiText}</button>
            <div class="cost">${data.multiCost}</div>
          </div>
        </div>
      `;

      document.querySelectorAll(".menu-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
    }

    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
