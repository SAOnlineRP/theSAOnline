<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gacha Wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      
      min-height: 100vh;
    }

    .screen {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

    .content {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        margin: 0 20px;
      }

    /* top icons */
    .top-left {
      position: absolute;
      top: 12px;
      left: 14px;
      display: flex;
      gap: 14px;
      font-size: 50px;
    }

    .top-left .icon {
      cursor: pointer;
      line-height: 1;
    }

    /* top currency */
    .top-right {
      position: absolute;
      top: 10px;
      right: 0;
      display: flex;
      gap: 12px;
      padding-right: 0;
    }

    .currency-box {
      min-width: 100px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 40px;
    }

    /* left menu */
    .left-panel {
      position: absolute;
      left: 42px;
      top: 100px;
      width: 200px;
      height: 450px;
      background: #6d6d6d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      width: 150px;
      min-height: 80px;
      background: #d9d9d9;
      border: none;
      font-size: 30px;
      cursor: pointer;
      padding: 6px;
      text-align: center;
    }

    .menu-btn.active {
      background: #ffffff;
      border: 3px solid #111;
    }

    /* info text */
    .guarantee-box {
      position: absolute;
      top: 200px;
      right: 18px;
      background: #d9d9d9;
      padding: 8px 10px;
      font-size: 20px;
      text-align: center;
    }

    /* summon buttons */
    .bottom-actions {
      position: absolute;
      right: 26px;
      bottom: 40px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .summon-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .summon-btn {
      width: 150px;
      min-height: 70px;
      background: #d9d9d9;
      border: none;
      font-size: 25px;
      cursor: pointer;
      text-align: center;
      padding: 6px;
    }

    .cost {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.7);

      display: flex;
      align-items: center;     /* CENTER VERTICAL */
      justify-content: center; /* CENTER HORIZONTAL */

      z-index: 999;
    }

    .popup.hidden {
      display: none;
    }

    .popup-content {
      width: 90%;
      max-width: 500px;

      background: #fff;
      padding: 20px;
      border-radius: 20px;

      text-align: center;

      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .popup-content {
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .popup-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .popup-card {
      width: 100px;
      height: 140px;
      perspective: 1000px;
    }

    .popup-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .popup-card.flip .popup-card-inner {
      transform: rotateY(180deg);
    }

    .popup-card-front,
    .popup-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #000;
      backface-visibility: hidden;
    }

    .popup-card-front {
      background: #444;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .popup-card-back {
      transform: rotateY(180deg);
      overflow: hidden;
    }

    .popup-card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card {
      width: 100px;
      height: 140px;
      perspective: 1000px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .card.flip .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backface-visibility: hidden;
      border: 2px solid #000;
    }

    .card-front {
      background: #444;
      color: #fff;
    }

    .card-back {
      background: #fff;
      transform: rotateY(180deg);
    }

    .partner { background: gold; }
    .item { background: lightblue; }
    .shard { background: lightgreen; }

    @media (max-width: 640px) {
      .screen {
        aspect-ratio: 9 / 16;
        min-height: 100vh;
        width: unset;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0 20px;
      }

      .left-panel {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 100px;

        width: auto;
        height: auto;

        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;

        gap: 20px;
        padding: 20px;

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;
      }

      .menu-btn {
        flex: 0 0 150px;
        min-height: 80px;
        font-size: 18px;
      }

      .guarantee-box {
        top: unset;
        bottom: 200px;
      }

      .currency-box {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top-left">
        <button class="icon" onclick="goBack()"><img src="/img/back.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
        <button class="icon" onclick="goHome()"><img src="/img/home.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
    </div>

    <div class="top-right">
      <div class="currency-box">🪙 10000</div>
      <div class="currency-box">💎 50</div>
    </div>

    <div class="content">
      <div class="left-panel">
        <button class="menu-btn active" onclick="changeSummon('special', this)">
          Special<br>Summon
        </button>

        <button class="menu-btn" onclick="changeSummon('regular', this)">
          Regular<br>Summon
        </button>
      </div>
      <div class="right-panel">
        <div class="guarantee-box">
          Get guaranteed partner<br>
          every 10 summons!
        </div>

        <div class="bottom-actions">
          <div class="summon-group">
            <button class="summon-btn">Single<br>Summon</button>
            <div class="cost">💎 250</div>
          </div>

          <div class="summon-group">
            <button class="summon-btn">Summon<br>4x</button>
            <div class="cost">💎 2000</div>
          </div>
        </div>
      </div>
      <!-- POPUP RESULT -->
      <div id="result-popup" class="popup hidden">
        <div class="popup-content">
          <div id="popup-cards" class="popup-cards"></div>

          <div class="popup-actions">
            <button onclick="summonAgain()">Summon Again</button>
            <button onclick="closePopup()">Kembali</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // =========================
    // 🎯 DATA
    // =========================

    // 20 partner (equal chance)
    const partners = [
      { id: 1, name: "Kirito", image: "/img/partners/kirito.png" },
      { id: 2, name: "Asuna", image: "/img/partners/asuna.png" },
      { id: 3, name: "Agil", image: "/img/partners/agil.png" },
      { id: 4, name: "Klein", image: "/img/partners/klein.png" },
      { id: 5, name: "Leafa", image: "/img/partners/leafa.png" },
      { id: 6, name: "Lisbeth", image: "/img/partners/lisbeth.png" },
      { id: 7, name: "Sachi", image: "/img/partners/sachi.png" },
      { id: 8, name: "Silica", image: "/img/partners/silica.png" },
      { id: 9, name: "Sinon", image: "/img/partners/sinon.png" },
      { id: 10, name: "Yui", image: "/img/partners/yui.png" },
      { id: 11, name: "Yuuki", image: "/img/partners/yuuki.png" },
      { id: 12, name: "Alice", image: "/img/partners/alice.png" },
      { id: 13, name: "Argo", image: "/img/partners/argo.png" },
      { id: 14, name: "Diavel", image: "/img/partners/diavel.png" },
      { id: 15, name: "Eugeo", image: "/img/partners/eugeo.png" },
      { id: 16, name: "Eydis", image: "/img/partners/eydis.png" },
      { id: 17, name: "Heathcliff", image: "/img/partners/heathcliff.png" },
      { id: 18, name: "Mito", image: "/img/partners/mito.png" },
      { id: 19, name: "Philia", image: "/img/partners/philia.png" },
      { id: 20, name: "Strea", image: "/img/partners/strea.png" }
    ];

    // 10 items (equal chance)
    const items = Array.from({ length: 10 }, (_, i) => ({
      id: i + 1,
      name: `Item ${i + 1}`
    }));

    const inventory = {
      partners: new Set(), // punya siapa aja
      shards: {} // { partnerId: totalShard }
    };

    let pityCounter = 0;
    const MAX_PITY = 10;

    function getPartnerRate() {
      return Math.min(0.01 + pityCounter * 0.01, 1);
    }

    // =========================
    // 🎲 HELPER
    // =========================

    function randomFromArray(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }


    // =========================
    // 🎁 ROLL LOGIC
    // =========================

    function rollPartner() {
      return {
        type: "partner",
        data: randomFromArray(partners)
      };
    }

    function rollNonPartner() {
      const rand = Math.random();

      if (rand < 0.5) {
        return {
          type: "item",
          data: randomFromArray(items)
        };
      }

      return {
        type: "shard",
        data: {
          partner: randomFromArray(partners),
          amount: randomInt(5, 10)
        }
      };
    }

    function multiRoll(count = 10) {
      const results = [];

      for (let i = 0; i < count; i++) {
        results.push(rollWithPity());
      }

      return results;
    }

    function rollWithPity() {
      pityCounter++;

      // 💥 HARD PITY
      if (pityCounter >= MAX_PITY) {
        pityCounter = 0;
        return rollPartner();
      }

      const rate = getPartnerRate();
      const rand = Math.random();

      if (rand < rate) {
        pityCounter = 0;
        return rollPartner();
      }

      return rollNonPartner();
    }

    function processResult(result) {
      if (result.type === "partner") {
        const id = result.data.id;

        // kalau sudah punya → convert jadi shard
        if (inventory.partners.has(id)) {
          const amount = 10;

          inventory.shards[id] = (inventory.shards[id] || 0) + amount;

          return {
            type: "shard",
            data: {
              partner: result.data,
              amount: amount,
              fromDuplicate: true
            }
          };
        }

        // kalau baru → simpan
        inventory.partners.add(id);
      }

      return result;
    }

    function renderPopup(results) {
      const container = document.getElementById("popup-cards");
      container.innerHTML = "";

      document.getElementById("result-popup").classList.remove("hidden");

      results.forEach((r, index) => {
        const card = document.createElement("div");
        card.className = "popup-card";

        const inner = document.createElement("div");
        inner.className = "popup-card-inner";

        const front = document.createElement("div");
        front.className = "popup-card-front";
        front.innerText = "?";

        const back = document.createElement("div");
        back.className = "popup-card-back";

        const img = document.createElement("img");

        if (r.type === "partner") {
          img.src = r.data.partner.image;
        } else if (r.type === "shard") {
          img.src = r.data.partner.image;
        } else {
          img.src = "/img/item.png";
        }

        back.appendChild(img);

        inner.appendChild(front);
        inner.appendChild(back);
        card.appendChild(inner);
        container.appendChild(card);

        // 🔥 animasi flip delay satu-satu
        setTimeout(() => {
          card.classList.add("flip");
        }, index * 300);
      });
    }

    function renderCards(results) {
      const container = document.getElementById("gacha-result");
      container.innerHTML = "";

      results.forEach((r, index) => {
        const card = document.createElement("div");
        card.className = "card";

        const inner = document.createElement("div");
        inner.className = "card-inner";

        const front = document.createElement("div");
        front.className = "card-front";
        front.innerText = "?";

        const back = document.createElement("div");
        back.className = "card-back " + r.type;

        if (r.type === "partner") {
          back.innerText = `🎉 ${r.data.name}`;
        } else if (r.type === "item") {
          back.innerText = `🎉 ${r.data.name}`;
        } else {
          const tag = r.data.fromDuplicate ? " (dup)" : "";
          back.innerText = `🧩 ${r.data.partner.name} x${r.data.amount}${tag}`;
        }

        inner.appendChild(front);
        inner.appendChild(back);
        card.appendChild(inner);
        container.appendChild(card);

        // delay flip satu-satu
        setTimeout(() => {
          card.classList.add("flip");
        }, index * 300);
      });
    }


    // =========================
    // 🔄 UI SWITCH (punya kamu)
    // =========================
    const summonData = {
      special: {
        text: "Get guaranteed partner<br>every 10 summons!",
        singleText: "Single<br>Summon",
        singleCost: "💎 250",
        multiText: "Summon<br>4x",
        multiCost: "💎 2000"
      },
      regular: {
        text: "Regular summon banner<br>standard partner pool!",
        singleText: "Single<br>Summon",
        singleCost: "🪙 1000",
        multiText: "Summon<br>10x",
        multiCost: "🪙 9000"
      }
    };

    function changeSummon(type, button) {
      const data = summonData[type];
      const rightPanel = document.querySelector(".right-panel");

      rightPanel.innerHTML = `
        <div class="guarantee-box">
          ${data.text}
        </div>

        <div class="bottom-actions">
          <div class="summon-group">
            <button class="summon-btn">${data.singleText}</button>
            <div class="cost">${data.singleCost}</div>
          </div>

          <div class="summon-group">
            <button class="summon-btn">${data.multiText}</button>
            <div class="cost">${data.multiCost}</div>
          </div>
        </div>
      `;

      document.querySelectorAll(".menu-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
    }

     // =========================
    // 🎮 SUMMON HANDLER
    // =========================

    document.addEventListener("click", function (e) {
      if (!e.target.classList.contains("summon-btn")) return;

      const text = e.target.innerText;

      let count = 1;
      if (text.includes("4x")) count = 4;
      if (text.includes("10x")) count = 10;

      let results = multiRoll(count);

      // proses duplicate
      results = results.map(r => processResult(r));

      console.log("FINAL RESULT:", results);
      console.log("INVENTORY:", inventory);

      renderPopup(results);
    });


    // =========================
    // NAVIGATION
    // =========================

    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }
  </script>
</body>
</html>
