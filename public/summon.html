<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gacha Wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-top: #003973;
      --bg-mid: #11375d;
      --bg-bottom: #020813;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      min-height: 100vh;
      background-size: cover;
      background: radial-gradient(circle at top, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
    }

    .screen {
      height: 100vh;              /* patok ke tinggi layar */
        width: calc(100vh * 16 / 9); /* biar tetap 16:9 */
        max-width: 100%;
        margin: 0 auto;

        position: relative;
        overflow: hidden;
    }

    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-size: 20px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
    }

    .loading-bar-container {
        width: 300px;
        height: 30px;
        background-color: #444;
        border: 2px solid #d4af4d;
        border-radius: 15px;
        margin-top: 20px;
    }

    .loading-bar {
        height: 100%;
        background: linear-gradient(90deg, #061b33, #1f1b10);
        box-shadow: 0 0 10px #000311;
        border-radius: 13px;
        width: 0%;
        transition: width 0.2s ease;
    }

    .bg-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 60vw);
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 0 20px rgba(0, 221, 255, 0.5)) blur(0.5px);
      z-index: -1;
    }

    .content {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      margin: 0 20px;
    }
    /* top bar */
    .topbar {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-top: 10px;
        margin-bottom: 30px;
        font-size: 40px;
    }

    .top-left {
        display: flex;
        gap: 18px;
        color: #000;
        align-items: center;
    }

    .top-left button {
        border: none;
        background: none;
        font-size: 40px;
        cursor: pointer;
    }

    .top-right {
        display: flex;
        gap: 14px;
    }

    .currency-box {
      min-width: 100px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 40px;
      color: white;
      padding: 0 12px;
  }

    /* left menu */
    .left-panel {
      position: absolute;
      left: 42px;
      top: 100px;
      width: 200px;
      height: 450px;
      background: #215b7a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      border-radius: 10px;
      box-shadow:
            inset 0 0 18px rgba(255,255,255,0.04),
            0 10px 28px rgba(0,0,0,0.35);
    }

    .menu-btn {
      width: 150px;
      min-height: 80px;
      background: #d9d9d9;
      border-radius: 10px;
      font-size: 25px;
      cursor: pointer;
      padding: 6px;
      text-align: center;
    }

    .menu-btn.active {
      background: #ffffff;
      border: 3px solid #111;
    }

    /* info text */
    .guarantee-box {
      position: absolute;
      top: 200px;
      right: 18px;
      background: #215b7a;
      padding: 8px 10px;
      font-size: 20px;
      text-align: center;
      color: white;
      box-shadow:
            inset 0 0 18px rgba(255,255,255,0.04),
            0 10px 28px rgba(0,0,0,0.35);
    }

    /* summon buttons */
    .bottom-actions {
      position: absolute;
      right: 26px;
      bottom: 40px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .summon-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .summon-btn {
      width: 150px;
      min-height: 70px;
      background: #215b7a;
      border: none;
      font-size: 25px;
      cursor: pointer;
      text-align: center;
      padding: 6px;
      color: white;
      border-radius: 20px;
      box-shadow:
            inset 0 0 18px rgba(255,255,255,0.04),
            0 10px 28px rgba(0,0,0,0.35);
    }

    .cost {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: white;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.7);

      display: flex;
      align-items: center;     /* CENTER VERTICAL */
      justify-content: center; /* CENTER HORIZONTAL */

      z-index: 999;
    }

    .popup.hidden {
      display: none;
    }

    .popup-content {
      width: 90%;
      max-width: 500px;

      background: #fff;
      padding: 20px;
      border-radius: 20px;

      text-align: center;

      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .popup-content {
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .popup-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .popup-card {
      width: 100px;
      height: 160px;
      perspective: 1000px;
    }

    .popup-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .popup-card.flip .popup-card-inner {
      transform: rotateY(180deg);
    }

    .popup-card-front,
    .popup-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #000;
      backface-visibility: hidden;
    }

    .popup-card-front {
      background: #444;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .popup-card-back {
      transform: rotateY(180deg);
      overflow: hidden;
    }

    .popup-card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rare {
      animation: rarePop 0.5s ease;
      box-shadow: 0 0 20px gold, 0 0 40px orange;
      border: 3px solid gold;
    }

    @keyframes rarePop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      70% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .partner { background: gold; }
    .item { background: lightblue; }
    .shard { background: lightgreen; }

    @media (max-width: 640px) {
      .screen {
        aspect-ratio: 9 / 16;
        min-height: 100vh;
        width: unset;
        padding-right: 10px;
        padding-left: 10px;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0 20px;
      }

      .top-right{
        justify-content: flex-end;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
      }

      .left-panel {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 100px;

        width: auto;
        height: auto;

        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;

        gap: 20px;
        padding: 20px;

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;
      }

      .menu-btn {
        flex: 0 0 150px;
        min-height: 80px;
        font-size: 18px;
      }

      .guarantee-box {
        top: unset;
        bottom: 200px;
      }

      .currency-box {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div id="loading-overlay" class="loading-overlay">
        <div>Loading Assets...</div>
        <div class="loading-bar-container">
            <div id="loading-bar" class="loading-bar"></div>
        </div>
    </div>
    <img src="/img/aincard.png" class="bg-image" alt="Aincrad" />
    <div class="topbar">
      <div class="top-left">
          <button onclick="goBack()"><img src="/img/back2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Back"></button>
          <button onclick="goHome()"><img src="/img/home2.png" style="width: 35px; height: 35px; margin-top:10px" alt="Home"></button>
      </div>

      <div class="top-right">
        <div class="currency-box"><img src="img/col.png" style="width: 50px; height: 50px;"><span id="col-player">10000</span></div>
        <div class="currency-box"><img src="img/gems.png" style="width: 50px; height: 50px;"><span id="gems-player">50</span></div>
      </div>
    </div>

    <div class="content">
      <div class="left-panel">
        <button class="menu-btn active" onclick="changeSummon('special', this)">
          Special<br>Summon
        </button>

        <button class="menu-btn" onclick="changeSummon('regular', this)">
          Regular<br>Summon
        </button>
      </div>
      <div class="right-panel">
        <div class="guarantee-box">
          Get guaranteed partner<br>
          every 10 summons!
        </div>

        <div class="bottom-actions">
          <div class="summon-group">
            <button class="summon-btn">Single<br>Summon</button>
            <div class="cost">💎 250</div>
          </div>

          <div class="summon-group">
            <button class="summon-btn">Summon<br>4x</button>
            <div class="cost">💎 2000</div>
          </div>
        </div>
      </div>
      <!-- POPUP RESULT -->
      <div id="result-popup" class="popup hidden">
        <div class="popup-content">
          <div id="popup-cards" class="popup-cards"></div>

          <div class="popup-actions">
            <button onclick="summonAgain()">Summon Again</button>
            <button onclick="closePopup()">Kembali</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { supabase } from "/js/supabaseClient.js";
    import { requireLogin } from "/js/authGuard.js";

    const overlay = document.getElementById("loading-overlay");
    const bar = document.getElementById("loading-bar");

    // =========================
    // 🎯 DATA
    // =========================

    
    const inventory = {
      partners: new Set(), // punya siapa aja
      shards: {} // { partnerId: totalShard }
    };

    let pityCounter = 0;
    const MAX_PITY = 10;

    function getPartnerRate() {
      return Math.min(0.01 + pityCounter * 0.005, 0.2);
    }

    let progress = 0;
    let partnerSummons;
    let itemSummons;

    let lastSummonCount = 1;
    let lastSummonCost = 0;

    async function loadData(session){
      try {
          setProgress(10);
          const response = await fetch(
              `/api/player_data`,
              {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                      Authorization: `Bearer ${session.access_token}`,
                  },
                  body: JSON.stringify({
                      action: "getColGems",
                  })
              }
          );

          const colGem = await response.json();

          if (!response.ok) throw new Error(colGem.error);

          document.getElementById("col-player").innerHTML = colGem.data.col;
          document.getElementById("gems-player").innerHTML = colGem.data.arcana_gems;
          setProgress(20);

          const resSummon = await fetch(
              `/api/admin`,
              {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                      Authorization: `Bearer ${session.access_token}`,
                  },
                  body: JSON.stringify({
                      action: "getAll",
                      table: "summon_pool"
                  })
              }
          );

          const summonRes = await resSummon.json();
          console.log("Summon ", summonRes.data);
          const dataSummon = summonRes.data;
          partnerSummons = dataSummon.filter(
            pool => pool.reward_type === "partner"
          );
          itemSummons = dataSummon.filter(
            pool => pool.reward_type === "item"
          );

          if (!resSummon.ok) throw new Error(summonRes.error);

          const resPartners = await fetch(
              `/api/player_data`,
              {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                      Authorization: `Bearer ${session.access_token}`,
                  },
                  body: JSON.stringify({
                      action: "getDataPlayer",
                      table: "player_partners"
                  })
              }
          );

          const partnerRes = await resPartners.json();
          if (!resPartners.ok) throw new Error(partnerRes.error);
          
          setProgress(50);
          await waitForImages();

          // selesai semua
          setProgress(100);

          setTimeout(hideLoading, 300);
      } catch (err) {
          console.error("Load error:", err);
          hideLoading();
      }
    }

    function setProgress(value) {
      progress = value;
      bar.style.width = progress + "%";
    }

    function hideLoading() {
      overlay.classList.add("fade-out");
      setTimeout(() => {
        overlay.style.display = "none";
      }, 500);
    }

    function waitForImages() {
      const images = document.querySelectorAll("img");
      let loaded = 0;
      const total = images.length;

      if (total === 0) return Promise.resolve();

      return new Promise((resolve) => {
          images.forEach((img) => {
          if (img.complete) {
              loaded++;
              update();
          } else {
              img.onload = () => {
              loaded++;
              update();
              };
              img.onerror = () => {
              loaded++;
              update();
              };
          }
          });

          function update() {
          const percent = (loaded / total) * 50; // max 50%
          setProgress(50 + percent);

          if (loaded === total) resolve();
          }
      });
    }

    // =========================
    // 🎲 HELPER
    // =========================

    function randomFromArray(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }


    // =========================
    // 🎁 ROLL LOGIC
    // =========================

    function rollPartner() {
      return {
        type: "partner",
        data: randomFromArray(partnerSummons)
      };
    }

    function rollNonPartner() {
      const rand = Math.random();

      if (rand < 0.5) {
        return {
          type: "item",
          data: randomFromArray(itemSummons)
        };
      }

      return {
        type: "shard",
        data: {
          partner: randomFromArray(partnerSummons),
          amount: randomInt(5, 10)
        }
      };
    }

    function multiRoll(count = 10) {
      const results = [];

      for (let i = 0; i < count; i++) {
        results.push(rollWithPity());
      }

      return results;
    }

    function rollWithPity() {
      pityCounter++;

      // 💥 HARD PITY
      if (pityCounter >= MAX_PITY) {
        pityCounter = 0;
        return rollPartner();
      }

      const rate = getPartnerRate();
      const rand = Math.random();

      if (rand < rate) {
        pityCounter = 0;
        return rollPartner();
      }

      return rollNonPartner();
    }

    function processResult(result) {
      if (result.type === "partner") {
        const id = result.data.id;

        // kalau sudah punya → convert jadi shard
        if (inventory.partners.has(id)) {
          const amount = 10;

          inventory.shards[id] = (inventory.shards[id] || 0) + amount;

          return {
            type: "shard",
            data: {
              partner: result.data,
              amount: amount,
              fromDuplicate: true
            }
          };
        }

        // kalau baru → simpan
        inventory.partners.add(id);
      }

      return result;
    }

    async function renderPopup(results) {
      const container = document.getElementById("popup-cards");
      container.innerHTML = "";

      document.getElementById("result-popup").classList.remove("hidden");
      console.log("results ", results);
      const dataRes = results.map(item => ({
        summon_type: item.type,
        summon_id:
          item.type === "shard"
            ? item.data.partner.reward_id
            : item.data.reward_id,
        quantity:
          item.type === "shard"
            ? item.data.amount
            : item.data.quantity
      }));

      console.log(dataRes);
      const total_price = lastSummonCost;
      try{
        const session = await requireLogin();
        const response = await fetch(
            `/api/player_data`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${session.access_token}`,
                },
                body: JSON.stringify({
                    action: "doSummon",
                    data: dataRes,
                    total_price: total_price
                })
            }
        ); 
      } catch (err) {

      } finally {
        
      }

      results.forEach((r, index) => {
        const card = document.createElement("div");
        card.className = "popup-card";

        const inner = document.createElement("div");
        inner.className = "popup-card-inner";

        const front = document.createElement("div");
        front.className = "popup-card-front";
        front.innerText = "?";

        const back = document.createElement("div");
        back.className = "popup-card-back";

        const img = document.createElement("img");

        if (r.type === "partner") {
          img.style.padding = "5px";
          img.src = r.data.link_photo;
          back.appendChild(img);
        } else if (r.type === "shard") {
          const tag = r.data.fromDuplicate ? " (dup)" : "";
          back.innerText = `🧩 ${r.data.partner.reward_name} x${r.data.amount}${tag}`;
        } else {
          back.innerText = `${r.data.reward_name} x${r.data.quantity}`;
          img.style.width = "90px";
          img.style.height = "90px";
          img.src = r.data.link_photo;
        }

        back.appendChild(img);

        inner.appendChild(front);
        inner.appendChild(back);
        card.appendChild(inner);
        container.appendChild(card);

        // 🔥 animasi flip delay satu-satu
        setTimeout(() => {
          card.classList.add("flip");

          // ⭐ RARE EFFECT (partner only)
          if (r.type === "partner") {
            setTimeout(() => {
              card.classList.add("rare");
            }, 200); // sedikit delay setelah flip
          }

        }, index * 300);
      });
    }


    // =========================
    // 🔄 UI SWITCH (punya kamu)
    // =========================
    const summonData = {
      special: {
        text: "Get guaranteed partner<br>every 10 summons!",
        singleText: "Single<br>Summon",
        singleCost: "💎 250",
        multiText: "Summon<br>4x",
        multiCost: "💎 2000"
      },
      regular: {
        text: "Regular summon banner<br>standard partner pool!",
        singleText: "Single<br>Summon",
        singleCost: "🪙 1000",
        multiText: "Summon<br>4x",
        multiCost: "🪙 9000"
      }
    };

    function changeSummon(type, button) {
      const data = summonData[type];
      const rightPanel = document.querySelector(".right-panel");

      rightPanel.innerHTML = `
        <div class="guarantee-box">
          ${data.text}
        </div>

        <div class="bottom-actions">
          <div class="summon-group">
            <button class="summon-btn">${data.singleText}</button>
            <div class="cost">${data.singleCost}</div>
          </div>

          <div class="summon-group">
            <button class="summon-btn">${data.multiText}</button>
            <div class="cost">${data.multiCost}</div>
          </div>
        </div>
      `;

      document.querySelectorAll(".menu-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
    }

    function summonAgain() {
      const gemsElement = document.getElementById("gems-player");
      let gems = parseInt(gemsElement.innerText, 10);

      if (gems < lastSummonCost) {
        alert("Arcana Gems tidak cukup!");
        return;
      }

      gems -= lastSummonCost;
      gemsElement.innerText = gems;

      closePopup();

      let results = multiRoll(lastSummonCount);
      results = results.map(r => processResult(r));

      renderPopup(results);
    }

     // =========================
    // 🎮 SUMMON HANDLER
    // =========================

    document.addEventListener("click", function (e) {
      if (!e.target.classList.contains("summon-btn")) return;

      const text = e.target.innerText;

      let count = 1;
      let cost = 200;

      if (text.includes("4x")) {
        count = 4;
        cost = 1000;
      }

      const gemsElement = document.getElementById("gems-player");
      let gems = parseInt(gemsElement.innerText, 10);

      if (gems < cost) {
        alert("Arcana Gems tidak cukup!");
        return;
      }

      // simpan summon terakhir
      lastSummonCount = count;
      lastSummonCost = cost;

      // kurangi gems
      gems -= cost;
      gemsElement.innerText = gems;

      let results = multiRoll(count);

      results = results.map(r => processResult(r));

      renderPopup(results);
    });

    window.goBack = goBack;
    window.goHome = goHome;
    window.closePopup = closePopup;
    window.summonAgain = summonAgain;
    window.changeSummon = changeSummon;

    // =========================
    // NAVIGATION
    // =========================

    function goBack() {
      window.history.back();
    }

    function goHome() {
      window.location.href = "menu.html";
    }

    function closePopup() {
      document.getElementById("result-popup").classList.add("hidden");
    }

    // klik background modal → close
    document.getElementById("result-popup").addEventListener("click", function (e) {
      if (e.target.id === "result-popup") {
        closePopup();
      }
    });

    async function init() {
      try {
          const session = await requireLogin();
          if (!session) return; // ✅ sekarang valid

          await loadData(session);
          setTimeout(hideLoading, 500);

      } catch (err) {
          console.error("Loading error:", err);
      }
    }

    init();
  </script>
</body>
</html>
